         + '. Dew point sits near ' + Math.round(d.dewDawn) + DEG + ', so moisture will freeze onto the surface. '
         + (hard ? 'Build ten minutes into the morning, or cover the glass tonight.'
                 : 'A quick scrape, or a few minutes of defrost.') };
  }

  /* Pipes burst on duration, not on the low. Roughly six hours below
     20 F is the point plumbers start warning about uninsulated runs. */
  function pipeCard(d) {
    if (d.coldRun < 4) return null;
    var severe = d.coldRun >= 10 || d.feelsMin <= -5;
    return { bg: bgAt('feels', d.feelsMin, 8),
      bold: severe ? 'Drip the Faucets' : 'Pipe Freeze Watch',
      tip: Math.round(d.coldRun) + ' straight hours at or below 20' + DEG
         + ', bottoming out near ' + Math.round(d.feelsMin) + DEG + '. '
         + (severe
            ? 'Long enough for uninsulated pipes in crawl spaces and exterior walls to freeze. Let a faucet drip on the coldest runs and open cabinet doors under sinks.'
            : 'Getting toward the range where exposed pipes are at risk. Worth checking anything in a crawl space or against an outside wall.') };
  }

  /* Mould grows where humid air meets a cold surface. A basement in
     summer sits around 60-65 F, so an outdoor dew point above that
     means condensation on every wall you let the air touch. */
  function moldCard(d) {
    var dp = d.dewMax;
    if (dp < 58 || d.tMax < 55) return null;
    var bad = dp >= 68;
    return { bg: bgFrom('risk', bad ? 78 : 48),
      bold: bad ? 'Keep the Basement Shut' : 'Basement Damp Risk',
      tip: 'Outdoor dew point reaches ' + Math.round(dp) + DEG
         + ', above the surface temperature of a typical basement or crawl space. '
         + (bad
            ? 'Opening windows down there will condense water onto the walls. Keep it closed and run the dehumidifier.'
            : 'Borderline. Airing the basement out today will do more harm than good.')
         + ' Mould spores off damp surfaces are the same trigger as the outdoor mould in the allergen card.' };
  }

  /* Asphalt in full sun runs far hotter than the air, and paw pads
     burn well before a person notices through shoes. Cold is the other
     end: salt and ice cut pads below about 20 F. */
  function pavementCard(d) {
    var midCloud = (function () {
      var v = [];
      for (var h = 11; h <= 16; h++) { var r = d.hours[h]; if (r && r.cloud != null) v.push(r.cloud); }
      return v.length ? avg(v) : 50;
    })();
    var loading = midCloud < 30 ? 45 : midCloud < 60 ? 30 : 14;
    var surface = d.tMax + loading;
    var hot = d.tMax >= 75 && surface >= 125;
    var cold = d.feelsMin <= 15;
    if (!hot && !cold) return null;

    if (cold) {
      return { bg: bgAt('feels', d.feelsMin, 8), bold: 'Hard on Paws',
        tip: 'Wind chill near ' + Math.round(d.feelsMin) + DEG
           + '. Ice and road salt split pads at this range. Keep walks short, and rinse paws afterwards.' };
    }
    return { bg: bgFrom('risk', Math.min(100, (surface - 110) * 3)),
      bold: surface >= 140 ? 'Pavement Burns Paws' : 'Hot Pavement',
      tip: 'Air reaches ' + Math.round(d.tMax) + DEG + ', and asphalt in '
         + (midCloud < 30 ? 'full sun' : 'this much sun') + ' runs roughly '
         + Math.round(surface) + DEG + '. '
         + 'Hold the back of your hand to it for seven seconds \u2014 if you cannot, neither can a dog. Walk early or after sunset, and stay on grass.' };
  }

  /* Wind, which the app had been fetching and never showing. Gust
     factor is the interesting part: steady wind is workable, gusty
     wind is what makes sailing and flying miserable. */
  function windCard(d) {
    var mean = d.windMean, gust = d.gustMax || d.windMax;
    var factor = mean > 1 ? gust / mean : 1;
    var word = gust < 8 ? 'Calm' : gust < 15 ? 'Light Wind' : gust < 25 ? 'Breezy'
             : gust < 38 ? 'Windy' : 'Strong Wind';
    var steady = factor < 1.6 ? 'steady' : factor < 2.2 ? 'a bit gusty' : 'very gusty';
    var use = gust < 6 ? 'Too still for a kite or a sail.'
            : (gust >= 8 && gust <= 22 && factor < 1.9) ? 'Good steady air for a kite or a small sail.'
            : gust > 30 ? 'Too much for recreational sailing, and a kite will not survive it.'
            : 'Flyable, but the gusts will fight you.';
    return { bg: bgFrom('risk', Math.min(100, gust * 2.2)), bold: word,
      tip: 'Averaging ' + Math.round(mean) + ' mph with gusts to ' + Math.round(gust)
         + ' mph \u2014 ' + steady + '. ' + use };
  }

  /* The light-exposure card. Not a mood score: how much bright light
     the day actually offers, and when to go get it. */
  function lightCard(d) {
    var mins = Math.round((d.sunset - d.sunrise) * 60 * (1 - d.cloudDay / 140));
    var word = d.cloudDay >= 80 ? 'Little Bright Light' : d.cloudDay >= 55 ? 'Patchy Light'
             : d.cloudDay >= 25 ? 'Decent Light' : 'Plenty of Light';
    var best = null;
    for (var h = d.sunrise; h <= Math.min(d.sunset, d.sunrise + 6); h++) {
      var r = d.hours[h];
      if (r && r.cloud != null && r.cloud < 55) { best = h; break; }
    }
    var tip = 'Roughly ' + hm(mins) + ' of usable outdoor light, '
            + Math.round(d.cloudDay) + '% cloud through the day. ';
    tip += best != null
      ? 'The clearest early stretch starts around ' + hr(best) + ' \u2014 morning light does more for your body clock than the same time later on.'
      : 'No clear morning window, so take whatever midday offers.';
    if (d.greyStreak >= 3) {
      tip += ' That is ' + d.greyStreak + ' overcast days running; if you use a lamp, this is the week for it.';
    }
    return { bg: bgFrom('sky', Math.min(100, d.cloudDay)), bold: word, tip: tip };
  }

  /* Aurora needs three things at once: a disturbed magnetosphere, a
     clear evening, and a dark-enough moon. At Great Lakes latitudes
     the Kp bar is high, so this fires rarely and means something. */
  function auroraCard(d, kp) {
    if (!kp || kp.max < 5) return null;
    var ev = [];
    for (var e = d.sunset + 1; e <= d.sunset + 5; e++) {
      var r = d.hours[e % 24];
      if (r && r.cloud != null) ev.push(r.cloud);
    }
    var cloud = ev.length ? avg(ev) : 100;
    var lit = Math.round(((1 - Math.cos(2 * Math.PI * (moonAge(d.date) / LUNATION))) / 2) * 100);
    var strong = kp.max >= 7;
    var word = strong && cloud < 40 ? 'Aurora Possible Tonight'
             : strong ? 'Aurora Active, Sky Cloudy' : 'Aurora Watch';
    return { bg: bgFrom('risk', Math.min(100, kp.max * 11)), bold: word,
      tip: 'Planetary K index forecast to reach ' + kp.max.toFixed(1)
         + '. Aurora usually needs Kp 7 or better to be seen this far south. '
         + 'Evening cloud around ' + Math.round(cloud) + '%, moon ' + lit + '% lit. '
         + (strong && cloud < 40
            ? 'Worth driving north away from town lights and looking low on the northern horizon.'
            : 'Conditions are not there tonight, but the storm may hold for another day.')
         + ' From NOAA Space Weather Prediction Center.' };
  }

  /* Which shoes. Rain, snow and ice were already in the data; mud and
     road salt were the gaps, and those are the two that cost you a
     cleaning job afterwards. Written as a recommendation, not a report
     \u2014 "boots, not the good ones" is useful before you leave, and
     "your shoes got muddy" is not. */
  function shoeCard(d) {
    var codes = [];
    for (var h = 6; h <= 20; h++) { var r = d.hours[h]; if (r && r.code != null) codes.push(r.code); }
    var icy = codes.some(function (c) { return [56, 57, 66, 67].indexOf(c) > -1; });
    var snowing = d.snowToday >= 0.2 || codes.some(function (c) { return [71, 73, 75, 77, 85, 86].indexOf(c) > -1; });
    var slush = d.snow3 >= 0.5 && d.tMax > 33 && d.tMax < 46;
    var freezeThaw = d.snow3 >= 0.2 && d.tMin <= 32 && d.tMax > 33;
    // Salt sits on dry pavement after a cold snowy stretch.
    var salty = d.snow3 >= 0.2 && d.saltCold && d.rainSum < 0.05 && !snowing;
    // Mud needs unfrozen, saturated ground. Fall back to rainfall when
    // the model gives no soil data.
    var muddy = d.soilMoist != null
      ? (d.soilMoist >= 0.33 && (d.soilTemp == null || d.soilTemp > 34))
      : (d.rain3 >= 0.4 && d.tMin > 34);
    var wet = d.rainChance >= 50 || d.rainSum >= 0.10;

    var word, why, dirty = false;
    if (icy || freezeThaw) {
      word = 'Traction, Not Style';
      why = (icy ? 'Freezing rain in the forecast. ' : 'Snow on the ground with the temperature crossing freezing, so it thaws and refreezes. ')
          + 'Whatever has the best grip, and take the shorter route if there is one.';
      dirty = true;
    } else if (snowing) {
      word = 'Waterproof Boots';
      why = Math.round(d.snowToday * 10) / 10 + '\u2033 of snow expected. Boots that seal at the ankle, not shoes you will be drying on a radiator.';
      dirty = true;
    } else if (slush) {
      word = 'Waterproof Boots';
      why = 'Snow on the ground and a high near ' + Math.round(d.tMax) + DEG + ', which makes slush. Deeper and wetter than it looks at the curb.';
      dirty = true;
    } else if (muddy && wet) {
      word = 'Boots You Can Hose Off';
      why = 'Ground is saturated and more rain is coming. Anything off pavement will be mud.';
      dirty = true;
    } else if (salty) {
      word = 'Not the Good Leather';
      why = 'Cold and snowy the last few days, dry today \u2014 that leaves salt crust on the walks. It stains leather and suede for good.';
      dirty = true;
    } else if (muddy) {
      word = 'Boots You Can Hose Off';
      why = 'Ground is still saturated from recent rain, so grass and trails will be soft.';
      dirty = true;
    } else if (wet) {
      word = 'Waterproof Shoes';
      why = Math.round(d.rainChance) + '% chance of rain. Wet feet all day is the main risk, not the shoes themselves.';
    } else {
      word = 'Any Shoes You Like';
      why = 'Dry ground, nothing falling, no salt or mud to speak of.';
    }

    if (dirty) why += ' Expect to be cleaning these afterwards, so pick a pair you do not mind that with.';
    var score = word === 'Any Shoes You Like' ? 8 : word === 'Waterproof Shoes' ? 32
              : word === 'Traction, Not Style' ? 82 : 58;
    return { bg: bgFrom('risk', score), bold: word,
      tip: why + (d.soilMoist == null ? ' Ground wetness estimated from rainfall \u2014 no soil data for this location.' : '') };
  }

  /* The app fetches a week and shows one day. This is the only card
     that looks past the day you selected: it scans the next six and
     surfaces the one thing worth knowing in advance. Silent unless
     something genuinely stands out, and only while you are looking at
     today \u2014 there is no "ahead" when you are already browsing
     Thursday. */
  function dayName(dateStr, tz, off) {
    if (off === 1) return 'Tomorrow';
    var t = Date.parse(dateStr + 'T12:00:00Z');
    return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long' }).format(new Date(t));
  }

  function aheadCard(p, tz, offset) {
    if (offset !== 0 || !p || !p.wx) return null;
    var today;
    try { today = derive(p.wx, p.aq, tz, 0); } catch (e) { return null; }
    var todayWorst = Math.max(migraineScore(today).s, arthritisScore(today).s);

    var days = [];
    for (var off = 1; off <= 6; off++) {
      try {
        var dd = derive(p.wx, p.aq, tz, off);
        days.push({ off: off, d: dd, m: migraineScore(dd), a: arthritisScore(dd) });
      } catch (e) { /* beyond the forecast */ }
    }
    if (!days.length) return null;

    // 1. A day that is both bad and notably worse than today.
    var worst = null;
    days.forEach(function (x) {
      var v = Math.max(x.m.s, x.a.s);
      if (!worst || v > worst.v) worst = { v: v, x: x };
    });
    if (worst && worst.v >= 45 && worst.v - todayWorst >= 12) {
      var x = worst.x;
      var which = x.m.s >= x.a.s ? 'migraine' : 'joints';
      var driver = topOf(x.m.s >= x.a.s ? x.m.why : x.a.why);
      var name = dayName(x.d.date, tz, x.off);
      return { note: true, ahead: true, bold: name + ' looks like a rough one',
        tip: 'Worst day in the week ahead for ' + which + (driver ? ' \u2014 ' + driver : '')
           + '. Today scores ' + todayWorst + ' out of 100 and ' + name + ' scores '
           + worst.v + '. Worth not stacking anything demanding onto it.' };
    }

    // 2. First freeze of the run, when today is above it.
    if (today.tMin > 34) {
      for (var i = 0; i < days.length; i++) {
        if (days[i].d.tMin <= 32) {
          var n2 = dayName(days[i].d.date, tz, days[i].off);
          return { note: true, ahead: true, bold: 'First freeze ' + n2,
            tip: 'Low of ' + Math.round(days[i].d.tMin) + DEG + ' on ' + n2
               + '. Time for the outside tap, the hose, and anything still in the garden.' };
        }
      }
    }

    // 3. A swing large enough to plan around.
    var drop = null, rise = null;
    days.forEach(function (x) {
      var diff = x.d.tMax - today.tMax;
      if (diff <= -18 && (!drop || diff < drop.diff)) drop = { diff: diff, x: x };
      if (diff >= 20 && (!rise || diff > rise.diff)) rise = { diff: diff, x: x };
    });
    var swing = drop || rise;
    if (swing) {
      var n3 = dayName(swing.x.d.date, tz, swing.x.off);
      return { note: true, ahead: true,
        bold: (swing.diff < 0 ? 'Cools ' : 'Warms ') + Math.abs(Math.round(swing.diff)) + DEG + ' by ' + n3,
        tip: 'High goes from ' + Math.round(today.tMax) + DEG + ' today to '
           + Math.round(swing.x.d.tMax) + DEG + ' on ' + n3
           + '. Swings that size are their own trigger, separate from where the temperature lands.' };
    }
    return null;
  }

  /* Mowing. Two separate questions the data can answer: is the grass
     actually growing, and will the ground take a mower without tearing.
     Deeper soil moisture matters more than the top centimetre, which
     dries out within hours of a shower. Cool-season turf, which is what
     grows across the Great Lakes and most of the north. */
  function mowCard(d, lat) {
    // Cool-season turf north of roughly 36 degrees, warm-season south of
    // it. They grow in different temperature bands entirely, so the same
    // soil reading means opposite things in Michigan and Georgia.
    var warmSeason = lat != null && lat < 36;
    var lo = warmSeason ? 62 : 50, hi = warmSeason ? 100 : 88;
    var fastLo = warmSeason ? 70 : 55, fastHi = warmSeason ? 95 : 82;
    var turf = warmSeason ? 'warm-season grass' : 'cool-season grass';
    var st = d.soilTemp;
    if (st == null ? d.tMax < 50 : st < (warmSeason ? 50 : 40)) return null;
    var wet = d.soilDeep != null ? d.soilDeep : d.soilMoist;
    var soggy = (wet != null && wet >= 0.36) || d.rainSum >= 0.25 || d.rainYesterday >= 0.5;
    var parched = wet != null && wet < 0.12;
    var dormant = (st != null && (st < lo || st > hi)) || parched;
    var rainComing = d.rainChance >= 60;
    var growingFast = !dormant && st != null && st >= fastLo && st <= fastHi
                      && (wet == null || (wet >= 0.18 && wet < 0.36));

    var word, why;
    if (soggy) {
      word = 'Too Wet to Mow';
      why = 'Ground is saturated' + (d.rainYesterday >= 0.5 ? ' after ' + d.rainYesterday.toFixed(2) + '\u2033 of rain' : '')
          + '. Mowing now tears the turf and leaves ruts, and wet clippings clump and smother what is underneath.';
    } else if (dormant) {
      word = 'Grass Is Not Growing';
      why = parched
        ? 'Soil is dry enough that the grass has gone dormant to protect itself. Cutting it now just stresses it further.'
        : (st != null && st > hi
            ? 'Soil is too warm for ' + turf + ' to put on growth. It is coasting, not growing.'
            : 'Soil sits near ' + Math.round(st) + DEG + ', below the point where ' + turf + ' grows. Nothing to cut.');
    } else if (rainComing) {
      word = 'Mow Before the Rain';
      why = Math.round(d.rainChance) + '% chance of rain'
          + (d.rainRun ? ', likeliest ' + hr(d.rainRun.a) + DASH + hr(d.rainRun.b + 1) : '')
          + '. Ground is fine now, so the window is before it arrives rather than after.';
    } else if (growingFast) {
      word = 'Growing Fast, Mow Soon';
      why = 'Soil near ' + Math.round(st) + DEG + ' with moisture in the sweet spot, so it is putting on real growth. '
          + 'Ground is firm enough to cut today.';
    } else {
      word = 'Fine to Mow';
      why = 'Ground is firm and nothing is falling. Growth is slow, so it can wait if you would rather.';
    }
    var score = soggy ? 72 : dormant ? 20 : rainComing ? 48 : growingFast ? 40 : 14;
    return { bg: bgFrom('risk', score), bold: word,
      tip: why + (d.soilDeep == null ? ' Soil moisture estimated from rainfall \u2014 no soil data for this location.' : '') };
  }

  /* Road salt does its worst damage not while it is freezing but once
     it thaws: the reaction needs liquid water, so a warm day after a
     salted stretch is when the undercarriage actually corrodes. Reuses
     the salt detection from the shoe call. */
  function rustCard(d) {
    if (!(d.snow3 >= 0.2 && d.saltCold && d.tMax >= 40)) return null;
    var washing = d.rainSum >= 0.3;
    return { bg: bgFrom('risk', washing ? 42 : 66),
      bold: washing ? 'Rain Is Rinsing the Salt' : 'Wash the Salt Off',
      tip: 'Snow and salt in the last few days, and today reaches '
         + Math.round(d.tMax) + DEG + '. '
         + (washing
            ? d.rainSum.toFixed(2) + '\u2033 of rain will take some of it off, though rain does not reach the undercarriage where it matters most.'
            : 'Salt corrodes fastest once it thaws, because the reaction needs liquid water \u2014 a cold salted week does less damage than the first warm day after it. This is the day a wash with an undercarriage rinse is worth the money.') };
  }

  function alertCard(al, tz) {
    var until = al.ends ? shortTime(al.ends, tz) : '';
    return { alert: true, bold: al.event, det: until ? ' (until ' + until + ')' : '',
             tip: al.headline || null };
  }


  /* ---- contrast ----
     Ramps are checked rather than warned about in the abstract: sample
     each one, compute the WCAG ratio against the ink colour, and name
     the ramp that fails so a single anchor can be nudged. */
  function lum(c) {
    var v = c.map(function (x) {
      x = x / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function ratio(a, b) {
    var l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  var INK = [22, 35, 47];
  var RAMP_LABEL = { feels: 'Feels Like', sweat: 'Humidity', aqi: 'Air quality',
    risk: 'the risk tiles', burn: 'Sunburn', rain: 'Precipitation',
    water: 'Water', sky: 'Sun and cloud' };
  function sampleRamp(key, v) {
    var r = RAMP[key];
    if (v <= r[0][0]) return r[0][1];
    for (var i = 1; i < r.length; i++) {
      if (v <= r[i][0]) {
        var a = r[i - 1], b = r[i], t = (v - a[0]) / (b[0] - a[0]);
        return blend(a[1], b[1], t);
      }
    }
    return r[r.length - 1][1];
  }
  function contrastReport() {
    var worst = null;
    Object.keys(RAMP).forEach(function (k) {
      var r = RAMP[k], lo = r[0][0], hi = r[r.length - 1][0];
      for (var i = 0; i <= 12; i++) {
        var v = lo + (hi - lo) * (i / 12);
        var rr = ratio(sampleRamp(k, v), INK);
        if (!worst || rr < worst.r) worst = { r: rr, ramp: k, at: i / 12 };
      }
    });
    [['night', NIGHT], ['dawn', TWILIGHT], ['midday', DAYLIT]].forEach(function (pr) {
      var rr = ratio(pr[1], INK);
      if (!worst || rr < worst.r) worst = { r: rr, ramp: 'sunrise', at: 0.5, band: pr[0] };
    });
    if (!worst) return null;
    if (worst.r >= 4.5) return { ok: true, text: 'Text stays readable across every card.' };
    if (worst.ramp === 'sunrise') {
      return { ok: false, text: 'Hard to read on the ' + worst.band + ' band of Sunrise and sunset \u2014 contrast '
             + worst.r.toFixed(1) + ' to 1, below the 4.5 guideline. Try a lighter colour.' };
    }
    var where = worst.at < 0.34 ? 'low end' : worst.at > 0.66 ? 'high end' : 'middle';
    return { ok: false, text: 'Hard to read at the ' + where + ' of ' + (RAMP_LABEL[worst.ramp] || worst.ramp)
           + ' \u2014 contrast ' + worst.r.toFixed(1) + ' to 1, below the 4.5 guideline. '
           + 'Try a lighter colour for that anchor.' };
  }

  /* ---- card order ----
     Stored as a list of ids; anything unlisted keeps its default slot,
     so adding a card later does not strand it. */
  var DEFAULT_TILE_ORDER = ['burn','frostbite','frost','pipe','fire','bug','pavement','shoe',
    'rust','mow','wind','frizz','mold','arthritis','allergy','migraine','air','light','aurora','moon'];
  var DEFAULT_HOURLY_ORDER = ['feels','sweat','sky','rain','daylight'];
  function orderOf(which) {
    var def = which === 'hourly' ? DEFAULT_HOURLY_ORDER : DEFAULT_TILE_ORDER;
    var saved = (which === 'hourly' ? store.orderH : store.order) || [];
    var out = saved.filter(function (id) { return def.indexOf(id) > -1; });
    def.forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    return out;
  }
  function tileOrder() { return orderOf('tiles'); }
  function hourlyOrder() { return orderOf('hourly'); }
  function moveCard(id, dir, which) {
    var o = orderOf(which), i = o.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= o.length) return;
    o.splice(j, 0, o.splice(i, 1)[0]);
    if (which === 'hourly') store.orderH = o; else store.order = o;
    saveStore(); buildSettings(); renderHome(); renderShore();
  }

  /* ================= data =================
     Every request goes straight from this browser to a public,
     keyless endpoint. Nothing is proxied. */
  function j(url, opts) {
    return fetch(url, opts || {}).then(function (r) {
      if (!r.ok) throw new Error('Service returned ' + r.status);
      return r.json();
    });
  }

  var FORECAST = 'https://api.open-meteo.com/v1/forecast';
  function wxUrl(lat, lon, tz, past) {
    return FORECAST + '?latitude=' + lat + '&longitude=' + lon
      + '&timezone=' + encodeURIComponent(tz || 'auto')
      + '&hourly=apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation_probability,'
      + 'precipitation,snowfall,pressure_msl,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index,'
      + 'weather_code,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_temperature_0cm'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,'
      + 'apparent_temperature_min,precipitation_sum,snowfall_sum,precipitation_probability_max,'
      + 'uv_index_max,shortwave_radiation_sum,sunrise,sunset'
      + '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch'
      + '&past_days=' + past + '&forecast_days=7';
  }

  function loadHome(place) {
    if (!place) return;
    state.place = place;
    var host = document.getElementById('homeBody');
    host.classList.add('busy');

    var jobs = [
      j(wxUrl(place.lat, place.lon, place.tz, 3)),
      j('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + place.lat
        + '&longitude=' + place.lon + '&timezone=' + encodeURIComponent(place.tz || 'auto')
        + '&hourly=pm2_5,ozone,us_aqi&forecast_days=5&past_days=1').catch(function () { return null; }),
      j('https://api.weather.gov/alerts/active?point=' + place.lat.toFixed(4) + ',' + place.lon.toFixed(4),
        { headers: { 'Accept': 'application/geo+json' } })
        .then(function (a) {
          return (a.features || []).slice(0, 4).map(function (f) {
            return { event: f.properties.event, headline: f.properties.headline || '',
                     ends: f.properties.ends || f.properties.expires || '' };
          });
        }).catch(function () { return []; }),
      j('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json')
        .then(function (rows) {
          var max = 0;
          for (var i = 1; i < rows.length; i++) {
            var v = parseFloat(rows[i][1]); if (isFinite(v) && v > max) max = v;
          }
          return max ? { max: max } : null;
        }).catch(function () { return null; })
    ];

    Promise.all(jobs).then(function (r) {
      state.home = { wx: r[0], aq: r[1], alerts: r[2], kp: r[3], pollen: null, airGoogle: null };
      state.tz = r[0].timezone || place.tz || 'America/Detroit';
      store.place = place;
      store.recents = [place].concat((store.recents || []).filter(function (x) {
        return Math.abs(x.lat - place.lat) > 0.02 || Math.abs(x.lon - place.lon) > 0.02;
      })).slice(0, 8);
      state.recents = store.recents;
      saveStore();
      buildDays(); buildPlaces(); renderHome();
      host.classList.remove('busy');
      if (store.keys.google) loadGoogle(place);
    }).catch(function (e) {
      state.home = { error: (e && e.message) || 'Could not reach the weather service.' };
      renderHome(); host.classList.remove('busy');
    });
  }

  /* Optional, and billed to whoever owns the key. Without one the app
     falls back to CAMS air quality and a modelled bloom calendar, and
     each card says which it used. */
  function loadGoogle(place) {
    var k = store.keys.google; if (!k) return;
    var now = new Date();
    Promise.all([
      j('https://pollen.googleapis.com/v1/forecast:lookup?key=' + encodeURIComponent(k)
        + '&location.latitude=' + place.lat + '&location.longitude=' + place.lon
        + '&days=5&languageCode=en&plantsDescription=false')
        .then(function (p) {
          return { days: (p.dailyInfo || []).map(function (dd) {
            var dt2 = dd.date || {};
            function p2(n) { return (n < 10 ? '0' : '') + n; }
            return { date: dt2.year + '-' + p2(dt2.month) + '-' + p2(dt2.day),
              types: (dd.pollenTypeInfo || []).map(function (t) {
                return { name: t.displayName || t.code, index: t.indexInfo ? t.indexInfo.value : null,
                         inSeason: !!t.inSeason }; }),
              plants: (dd.plantInfo || []).filter(function (x) { return x.indexInfo && x.indexInfo.value > 0; })
                .map(function (x) { return { name: x.displayName || x.code, index: x.indexInfo.value }; }) };
          }) };
        }).catch(function (e) { return { error: 'Pollen: ' + e.message }; }),
      fetch('https://airquality.googleapis.com/v1/forecast:lookup?key=' + encodeURIComponent(k), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          location: { latitude: place.lat, longitude: place.lon },
          period: { startTime: now.toISOString(),
                    endTime: new Date(now.getTime() + 95 * 3600 * 1000).toISOString() },
          universalAqi: false,
          extraComputations: ['HEALTH_RECOMMENDATIONS', 'DOMINANT_POLLUTANT_CONCENTRATION', 'LOCAL_AQI'],
          customLocalAqis: [{ regionCode: 'us', aqi: 'usa_epa' }],
          languageCode: 'en', pageSize: 96 })
      }).then(function (r) { return r.json(); }).then(function (jj) {
        var byDay = {};
        (jj.hourlyForecasts || []).forEach(function (h) {
          if (!h.dateTime) return;
          var day = new Intl.DateTimeFormat('en-CA', { timeZone: state.tz, year: 'numeric',
            month: '2-digit', day: '2-digit' }).format(new Date(h.dateTime));
          var epa = null;
          (h.indexes || []).forEach(function (ix) { if (ix.code === 'usa_epa') epa = ix; });
          if (!epa || epa.aqi == null) return;
          if (!byDay[day] || epa.aqi > byDay[day].aqi) {
            byDay[day] = { aqi: epa.aqi, dominant: epa.dominantPollutant || '',
              lungAdvice: (h.healthRecommendations && h.healthRecommendations.lungDiseasePopulation) || '',
              generalAdvice: (h.healthRecommendations && h.healthRecommendations.generalPopulation) || '' };
          }
        });
        return Object.keys(byDay).length ? { days: byDay } : null;
      }).catch(function (e) { return { error: 'Air quality: ' + e.message }; })
    ]).then(function (g) {
      if (!state.home || state.home.error) return;
      state.home.pollen = g[0]; state.home.airGoogle = g[1];
      renderHome();
    });
  }

  /* ---- water ----------------------------------------------------
     Two sources. NDBC buoys are real thermometers but only exist
     where one is moored; the Marine API models sea surface
     temperature for ocean coasts but does not cover the Great Lakes
     or any inland water. The station list is fetched once and cached
     for a day, so nearest-buoy works anywhere without a hardcoded
     list of guesses. */
  var STATIONS_KEY = 'morningbrief.stations.v1';
  function stations() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(STATIONS_KEY)); } catch (e) {}
    if (cached && cached.at && Date.now() - cached.at < 86400000) return Promise.resolve(cached.list);
    return fetch('https://www.ndbc.noaa.gov/activestations.xml')
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var list = [], re = /<station\s+([^>]*)\/?>/g, m;
        while ((m = re.exec(txt))) {
          var a = m[1];
          function attr(n) { var x = new RegExp(n + '="([^"]*)"').exec(a); return x ? x[1] : null; }
          var lat = parseFloat(attr('lat')), lon = parseFloat(attr('lon'));
          if (!isFinite(lat) || !isFinite(lon)) continue;
          list.push({ id: attr('id'), lat: lat, lon: lon, name: attr('name') || attr('id') });
        }
        try { localStorage.setItem(STATIONS_KEY, JSON.stringify({ at: Date.now(), list: list })); } catch (e) {}
        return list;
      })
      .catch(function () { return null; });   // blocked or offline: fall through to the model
  }
  function milesBetween(a, b, c, e) {
    var R = 3958.8, t = Math.PI / 180;
    var dLat = (c - a) * t, dLon = (e - b) * t;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2)
          + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }
  function nearestBuoy(lat, lon) {
    return stations().then(function (list) {
      if (!list || !list.length) return null;
      var best = null;
      list.forEach(function (s) {
        var d2 = milesBetween(lat, lon, s.lat, s.lon);
        if (d2 <= 60 && (!best || d2 < best.miles)) best = { st: s, miles: Math.round(d2) };
      });
      return best;
    });
  }
  function buoyReading(b) {
    return fetch('https://www.ndbc.noaa.gov/data/realtime2/' + b.st.id + '.txt')
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (txt) {
        var lines = txt.split('\n');
        var cols = lines[0].replace(/^#/, '').trim().split(/\s+/);
        var iW = cols.indexOf('WTMP'), iV = cols.indexOf('WVHT');
        var wC = null, vM = null, stamp = null;
        for (var i = 2; i < lines.length && i < 60; i++) {
          var f = lines[i].trim().split(/\s+/);
          if (f.length < cols.length) continue;
          if (stamp === null) stamp = Date.UTC(+f[0], +f[1] - 1, +f[2], +f[3], +f[4]);
          if (wC === null && iW > -1 && f[iW] !== 'MM') wC = parseFloat(f[iW]);
          if (vM === null && iV > -1 && f[iV] !== 'MM') vM = parseFloat(f[iV]);
          if (wC !== null && vM !== null) break;
        }
        if (wC === null || (stamp && Date.now() - stamp > 86400000)) return null;
        return { kind: 'buoy', available: true, station: b.st.name, miles: b.miles,
                 waterF: Math.round(wC * 9 / 5 + 32),
                 waveFt: vM === null ? null : Math.round(vM * 3.281 * 10) / 10 };
      }).catch(function () { return null; });
  }
  function marineReading(lat, lon, tz) {
    return j('https://marine-api.open-meteo.com/v1/marine?latitude=' + lat + '&longitude=' + lon
      + '&timezone=' + encodeURIComponent(tz || 'auto')
      + '&hourly=sea_surface_temperature,wave_height&temperature_unit=fahrenheit'
      + '&length_unit=imperial&forecast_days=5')
      .then(function (r) {
        var H = r.hourly; if (!H || !H.time) return null;
        var acc = {};
        for (var i = 0; i < H.time.length; i++) {
          var day = H.time[i].slice(0, 10);
          var sst = H.sea_surface_temperature ? H.sea_surface_temperature[i] : null;
          var w = H.wave_height ? H.wave_height[i] : null;
          if (sst == null && w == null) continue;
          if (!acc[day]) acc[day] = { sum: 0, n: 0, w: null };
          if (sst != null) { acc[day].sum += sst; acc[day].n++; }
          if (w != null && (acc[day].w == null || w > acc[day].w)) acc[day].w = w;
        }
        var days = {}, any = false;
        Object.keys(acc).forEach(function (k2) {
          if (!acc[k2].n) return; any = true;
          days[k2] = { waterF: Math.round(acc[k2].sum / acc[k2].n),
                       waveFt: acc[k2].w == null ? null : Math.round(acc[k2].w * 10) / 10 };
        });
        return any ? { kind: 'marine', days: days } : null;
      }).catch(function () { return null; });
  }

  /* NOAA CO-OPS. Covers the coastline AND the Great Lakes, which no
     ocean model does, and its stations sit on piers and in harbours
     rather than miles offshore \u2014 closer to where anyone actually gets
     in. This is what keeps Lake Michigan working. */
  var COOPS_KEY = 'morningbrief.coops.v1';
  function coopsStations() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(COOPS_KEY)); } catch (e) {}
    if (cached && cached.at && Date.now() - cached.at < 86400000) return Promise.resolve(cached.list);
    return j('https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=watertemp')
      .then(function (r) {
        var list = (r.stations || []).map(function (st) {
          return { id: st.id, name: st.name, lat: st.lat, lon: st.lng };
        }).filter(function (st) { return st.id && isFinite(st.lat) && isFinite(st.lon); });
        try { localStorage.setItem(COOPS_KEY, JSON.stringify({ at: Date.now(), list: list })); } catch (e) {}
        return list;
      }).catch(function () { return null; });
  }
  function coopsReading(lat, lon) {
    return coopsStations().then(function (list) {
      if (!list || !list.length) return null;
      var best = null;
      list.forEach(function (st) {
        var d2 = milesBetween(lat, lon, st.lat, st.lon);
        if (d2 <= 45 && (!best || d2 < best.miles)) best = { st: st, miles: Math.round(d2) };
      });
      if (!best) return null;
      return j('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest'
        + '&station=' + encodeURIComponent(best.st.id)
        + '&product=water_temperature&units=english&time_zone=lst_ldt'
        + '&application=MorningBrief&format=json')
        .then(function (r) {
          var row = r && r.data && r.data[0];
          var v = row ? parseFloat(row.v) : NaN;
          if (!isFinite(v)) return null;
          return { kind: 'station', available: true, waterF: Math.round(v),
                   waveFt: null, station: best.st.name, miles: best.miles };
        }).catch(function () { return null; });
    }).catch(function () { return null; });
  }

  /* Tried in order: an offshore buoy, then a shoreline station, then a
     model. Whichever answers first is what the card reports, and the
     card names it. */
  function waterFor(place, tz) {
    return nearestBuoy(place.lat, place.lon)
      .then(function (b) { return b ? buoyReading(b) : null; })
      .catch(function () { return null; })
      .then(function (w) { return w || coopsReading(place.lat, place.lon); })
      .then(function (w) { return w || marineReading(place.lat, place.lon, tz); });
  }

  function loadShore(place) {
    if (!place) return;
    state.shoreSel = place; store.shore = place;
    store.shores = [place].concat((store.shores || []).filter(function (x) {
      return Math.abs(x.lat - place.lat) > 0.05 || Math.abs(x.lon - place.lon) > 0.05;
    })).slice(0, 6);
    state.shoreRecents = store.shores; saveStore();
    var host = document.getElementById('shoreBody'); host.classList.add('busy');
    buildBeaches();

    j(wxUrl(place.lat, place.lon, place.tz, 1)).then(function (wx) {
      return waterFor(place, wx.timezone).then(function (water) {
        state.shore = { wx: wx, water: water, name: placeLabel(place), lat: place.lat };
        renderShore(); host.classList.remove('busy');
      });
    }).catch(function (e) {
      state.shore = { error: (e && e.message) || 'Could not reach the weather service.' };
      renderShore(); host.classList.remove('busy');
    });
  }

  function search(q) {
    return j('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(q)
      + '&count=8&language=en&format=json&countryCode=US')
      .then(function (r) {
        return (r.results || []).map(function (x) {
          return { name: x.name, region: x.admin1 || '', country: x.country_code || '',
                   lat: x.latitude, lon: x.longitude, tz: x.timezone || 'auto' };
        });
      }).catch(function () { return []; });
  }

  /* ================= render ================= */
  function card(row) {
    var el = document.createElement(row.tip ? 'button' : 'div');
    el.className = 'card' + (row.tip ? '' : ' flat') + (row.plain ? ' plain' : '')
                 + (row.alert ? ' alert' : '') + (row.note ? ' note' : '')
                 + (row.ahead ? ' ahead' : '')
                 + (row.timeline || row.alert || row.note ? '' : ' sm');
    if (row.bg) el.style.background = row.bg;

    var line = document.createElement('div');
    line.className = 'face' + (row.split ? ' split' : '');
    if (row.split) {
      ['left', 'right'].forEach(function (side) {
        var box = document.createElement('div'); box.className = 'end ' + side;
        row.split[side].forEach(function (txt) {
          var b3 = document.createElement('b'); b3.textContent = txt; box.appendChild(b3);
        });
        line.appendChild(box);
      });
    } else {
      var b = document.createElement('b'); b.textContent = row.bold; line.appendChild(b);
      if (row.det) { var s2 = document.createElement('span'); s2.className = 'det'; s2.textContent = row.det; line.appendChild(s2); }
    }
    if (row.timeline && state.dayOffset === 0) {
      var tick = document.createElement('div');
      tick.className = 'now';
      tick.style.left = (nowFraction() * 100).toFixed(2) + '%';
      line.appendChild(tick);
    }
    el.appendChild(line);

    if (row.tip) {
      var t = document.createElement('p'); t.className = 'tip'; t.textContent = row.tip; t.style.display = 'none';
      el.appendChild(t);
      el.setAttribute('aria-expanded', 'false');
      el.addEventListener('click', function () {
        var open = t.style.display === 'none';
        t.style.display = open ? 'block' : 'none';
        el.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (el.className.indexOf('sm') > -1) {
          el.className = open ? el.className + ' open' : el.className.replace(/ open/g, '');
        }
      });
    }
    return el;
  }
  function addCard(host, id, build) {
    if (id && !on(id)) return;
    try {
      var row = build();
      if (!row) return;
      host.appendChild(card(row));
    } catch (e) {
      var el = document.createElement('div');
      el.className = 'card flat plain';
      el.textContent = 'This card failed: ' + ((e && e.message) || e);
      host.appendChild(el);
    }
  }
  function skeleton(host, tall, short) {
    host.innerHTML = '';
    var c = document.createElement('div'); c.className = 'hourly';
    for (var i = 0; i < tall; i++) {
      var a = document.createElement('div'); a.className = 'card flat skel'; c.appendChild(a);
    }
    host.appendChild(c);
    var g = document.createElement('div'); g.className = 'grid';
    for (var jx = 0; jx < short; jx++) {
      var b2 = document.createElement('div'); b2.className = 'card flat sm skel'; g.appendChild(b2);
    }
    host.appendChild(g);
  }
  function fail(host, msg) {
    host.innerHTML = '';
    var e = document.createElement('div'); e.className = 'card flat alert'; e.textContent = msg; host.appendChild(e);
  }

  function renderHome() {
    var host = document.getElementById('homeBody'), p = state.home;
    if (!state.place) { host.innerHTML = ''; return; }
    if (!p) return skeleton(host, 5, 6);
    if (p.error) return fail(host, p.error);
    var d;
    try { d = derive(p.wx, p.aq, state.tz, state.dayOffset); } catch (e) { return fail(host, e.message); }
    var lat = state.place.lat, lon = state.place.lon;
    var cal = calendarFor(lat, lon);
    host.innerHTML = '';

    (p.alerts || []).forEach(function (al) { host.appendChild(card(alertCard(al, state.tz))); });
    var season = seasonCard(d.date, state.tz, lat);
    if (season) host.appendChild(card(season));
    var ahead = aheadCard(p, state.tz, state.dayOffset);
    if (ahead) host.appendChild(card(ahead));

    var hourlyBuilders = {
      feels:    function () { return feelsCard(d); },
      sweat:    function () { return sweatCard(d); },
      sky:      function () { return skyCard(d); },
      rain:     function () { return rainCard(d); },
      daylight: function () { return daylightCard(d); }
    };
    var col = document.createElement('div'); col.className = 'hourly';
    hourlyOrder().forEach(function (id) { addCard(col, id, hourlyBuilders[id]); });
    host.appendChild(col);

    var grid = document.createElement('div'); grid.className = 'grid';
    var builders = {
      burn:      function () { return burnCard(d); },
      frostbite: function () { return frostbiteCard(d); },
      frost:     function () { return frostCard(d); },
      pipe:      function () { return pipeCard(d); },
      fire:      function () { return fireCard(d); },
      bug:       function () { return bugCard(d); },
      pavement:  function () { return pavementCard(d); },
      shoe:      function () { return shoeCard(d); },
      rust:      function () { return rustCard(d); },
      mow:       function () { return mowCard(d, lat); },
      wind:      function () { return windCard(d); },
      frizz:     function () { return frizzCard(d); },
      mold:      function () { return moldCard(d); },
      arthritis: function () { return arthritisCard(d); },
      allergy:   function () { return allergyCard(d, p.pollen, cal); },
      migraine:  function () { return migraineCard(d); },
      air:       function () { return airCard(d, p.airGoogle); },
      light:     function () { return lightCard(d); },
      aurora:    function () { return auroraCard(d, p.kp); },
      moon:      function () { return moonCard(d.date); }
    };
    tileOrder().forEach(function (id) { addCard(grid, id, builders[id]); });
    host.appendChild(grid);
  }

  function renderShore() {
    var sec = document.getElementById('shoreSection');
    sec.style.display = on('shore') ? 'block' : 'none';
    if (!on('shore')) return;
    var host = document.getElementById('shoreBody');
    if (!state.shoreSel) {
      host.innerHTML = '';
      var hint = document.createElement('div');
      hint.className = 'card flat plain';
      hint.textContent = 'Pick a coast or lake town to see water temperature and conditions.';
      host.appendChild(hint);
      return;
    }
    var p = state.shore;
    if (!p) return skeleton(host, 5, 2);
    if (p.error) return fail(host, p.error);
    var d;
    try { d = derive(p.wx, null, p.wx.timezone || state.tz, state.dayOffset); }
    catch (e) { return fail(host, e.message); }
    host.innerHTML = '';
    var sHourly = {
      feels:    function () { return feelsCard(d); },
      sweat:    function () { return sweatCard(d); },
      sky:      function () { return skyCard(d); },
      rain:     function () { return rainCard(d); },
      daylight: function () { return daylightCard(d); }
    };
    var scol = document.createElement('div'); scol.className = 'hourly';
    hourlyOrder().forEach(function (id) { addCard(scol, id, sHourly[id]); });
    host.appendChild(scol);
    var g = document.createElement('div'); g.className = 'grid';
    addCard(g, 'burn', function () { return burnCard(d); });
    addCard(g, 'wind', function () { return windCard(d); });
    addCard(g, 'bug',  function () { return bugCard(d); });
    addCard(g, null,   function () { return waterCard(p.water, d.date); });
    host.appendChild(g);

    // Rip current and beach hazard products are regional. Rather than
    // point everyone at a Great Lakes page, send them to the NWS
    // forecast for their own coordinates.
    var l = document.createElement('div'); l.className = 'linkcard';
    var a = document.createElement('a');
    a.href = 'https://forecast.weather.gov/MapClick.php?lat=' + state.shoreSel.lat.toFixed(4)
           + '&lon=' + state.shoreSel.lon.toFixed(4);
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Local swim & surf forecast';
    l.appendChild(a); host.appendChild(l);
  }

  /* ================= controls ================= */
  var shoreBox = document.getElementById('shoreBox');
  var daySel = document.getElementById('daySel'), placeSel = document.getElementById('placeSel'),
      beachSel = document.getElementById('beachSel'), searchBox = document.getElementById('searchBox'),
      results = document.getElementById('results'), qIn = document.getElementById('q'),
      shoreResults = document.getElementById('shoreResults'),
      shoreQ = document.getElementById('shoreQ');

  function buildDays() {
    daySel.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var o = document.createElement('option');
      o.value = String(i); o.textContent = labelFor(state.tz, i);
      if (i === state.dayOffset) o.selected = true;
      daySel.appendChild(o);
    }
  }
  function buildPlaces() {
    placeSel.innerHTML = '';
    if (!state.place) {
      var ph = document.createElement('option');
      ph.textContent = 'Choose your town'; ph.disabled = true; ph.selected = true;
      placeSel.appendChild(ph);
      var f = document.createElement('option'); f.value = '__search';
      f.textContent = 'Search a town'; placeSel.appendChild(f);
      return;
    }
    var seen = {};
    (state.recents || []).forEach(function (x) {
      var k2 = x.lat.toFixed(2) + ',' + x.lon.toFixed(2); if (seen[k2]) return; seen[k2] = 1;
      var o = document.createElement('option'); o.value = k2; o.textContent = placeLabel(x); o._place = x;
      if (Math.abs(x.lat - state.place.lat) < 0.02 && Math.abs(x.lon - state.place.lon) < 0.02) o.selected = true;
      placeSel.appendChild(o);
    });
    var s = document.createElement('option'); s.value = '__search'; s.textContent = 'Search another town';
    placeSel.appendChild(s);
  }
  function buildBeaches() {
    beachSel.innerHTML = '';
    if (!state.shoreSel) {
      // A one-option select is a dead control: re-picking the option
      // already selected fires no change event. So the placeholder is a
      // disabled option and the real action sits below it, and the
      // search box opens straight away.
      var ph = document.createElement('option');
      ph.textContent = 'Choose a shore'; ph.disabled = true; ph.selected = true;
      beachSel.appendChild(ph);
      var f = document.createElement('option'); f.value = '__shoresearch';
      f.textContent = 'Search a coast or lake town'; beachSel.appendChild(f);
      shoreBox.style.display = 'block';
      return;
    }
    (state.shoreRecents || []).forEach(function (x) {
      var o = document.createElement('option');
      o.value = x.lat.toFixed(2) + ',' + x.lon.toFixed(2);
      o.textContent = placeLabel(x); o._place = x;
      if (Math.abs(x.lat - state.shoreSel.lat) < 0.05 && Math.abs(x.lon - state.shoreSel.lon) < 0.05) o.selected = true;
      beachSel.appendChild(o);
    });
    var s = document.createElement('option'); s.value = '__shoresearch';
    s.textContent = 'Search another shore'; beachSel.appendChild(s);
  }

  daySel.addEventListener('change', function () {
    state.dayOffset = parseInt(daySel.value, 10) || 0; renderHome(); renderShore();
  });
  placeSel.addEventListener('change', function () {
    if (placeSel.value === '__search') {
      searchBox.style.display = 'block'; results.innerHTML = ''; qIn.value = ''; qIn.focus(); return;
    }
    searchBox.style.display = 'none';
    var o = placeSel.options[placeSel.selectedIndex];
    if (o && o._place) loadHome(o._place);
  });
  beachSel.addEventListener('change', function () {
    if (beachSel.value === '__shoresearch') {
      shoreBox.style.display = 'block'; shoreResults.innerHTML = ''; shoreQ.value = ''; shoreQ.focus(); return;
    }
    shoreBox.style.display = 'none';
    var o = beachSel.options[beachSel.selectedIndex];
    if (o && o._place) loadShore(o._place);
  });

  function wireSearch(input, list, onPick) {
    function go() {
      var q = input.value.trim(); if (q.length < 2) return;
      list.innerHTML = '<li style="padding:8px 4px">Searching</li>';
      search(q).then(function (r) {
        list.innerHTML = '';
        if (!r.length) { list.innerHTML = '<li style="padding:8px 4px">Nothing found.</li>'; return; }
        r.forEach(function (x) {
          var li = document.createElement('li');
          li.style.cssText = 'padding:9px 4px;border-top:1px solid #E4E4E4;cursor:pointer';
          li.textContent = placeLabel(x);
          li.addEventListener('click', function () { onPick(x); });
          list.appendChild(li);
        });
      });
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    input.addEventListener('search', go);
    // Search as you type, so nobody has to guess that Enter is required.
    var timer = null;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(go, 350);
    });
  }
  wireSearch(qIn, results, function (x) { searchBox.style.display = 'none'; loadHome(x); });
  wireSearch(shoreQ, shoreResults, function (x) { shoreBox.style.display = 'none'; loadShore(x); });

  /* ================= settings ================= */
  var settingsPanel = document.getElementById('settingsPanel');
  var aboutPanel = document.getElementById('aboutPanel');

  var TABS = [['cards', 'Cards'], ['colour', 'Colour'], ['key', 'API key']];

  function buildSettings() {
    settingsPanel.innerHTML = '';
    var tab = store.tab || 'cards';

    var bar = document.createElement('div'); bar.className = 'tabs';
    TABS.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'tab' + (tab === t[0] ? ' sel' : '');
      b.textContent = t[1];
      b.addEventListener('click', function () { store.tab = t[0]; saveStore(); buildSettings(); });
      bar.appendChild(b);
    });
    settingsPanel.appendChild(bar);

    if (tab === 'cards') buildCardsTab();
    else if (tab === 'colour') buildColourTab();
    else buildKeyTab();
  }

  /* One list, not two: each row carries its own on/off and its own
     position, so a card is never listed twice. */
  function buildCardsTab() {
    var groups = [['Weather', hourlyOrder(), 'hourly'],
                  ['Tiles', tileOrder(), 'tiles']];
    groups.forEach(function (g) {
      var h = document.createElement('h3'); h.textContent = g[0];
      settingsPanel.appendChild(h);
      g[1].forEach(function (id, i, arr) {
        var meta = null;
        CARDS.forEach(function (c) { if (c.id === id) meta = c; });
        if (!meta) return;
        var row = document.createElement('div'); row.className = 'ord';
        var box = document.createElement('input'); box.type = 'checkbox';
        box.checked = on(id); box.disabled = !!meta.always;
        box.addEventListener('change', function () {
          store.cards[id] = box.checked; saveStore(); renderHome(); renderShore();
        });
        var nm = document.createElement('span'); nm.textContent = meta.name;
        if (meta.note) { var sm = document.createElement('small'); sm.textContent = meta.note; nm.appendChild(sm); }
        var up = document.createElement('button'); up.textContent = '\u2191';
        up.setAttribute('aria-label', 'Move ' + meta.name + ' up');
        up.disabled = i === 0;
        up.addEventListener('click', function () { moveCard(id, -1, g[2]); });
        var dn = document.createElement('button'); dn.textContent = '\u2193';
        dn.setAttribute('aria-label', 'Move ' + meta.name + ' down');
        dn.disabled = i === arr.length - 1;
        dn.addEventListener('click', function () { moveCard(id, 1, g[2]); });
        row.appendChild(box); row.appendChild(nm); row.appendChild(up); row.appendChild(dn);
        settingsPanel.appendChild(row);
      });
    });

    var sh = document.createElement('h3'); sh.textContent = 'Sections';
    settingsPanel.appendChild(sh);
    var srow = document.createElement('label'); srow.className = 'opt';
    var sbox = document.createElement('input'); sbox.type = 'checkbox'; sbox.checked = on('shore');
    sbox.addEventListener('change', function () {
      store.cards.shore = sbox.checked; saveStore(); renderShore();
    });
    var stx = document.createElement('span'); stx.textContent = 'Water section';
    var ssm = document.createElement('small'); ssm.textContent = 'A coast or lake worth checking';
    stx.appendChild(ssm);
    srow.appendChild(sbox); srow.appendChild(stx); settingsPanel.appendChild(srow);
  }

  function buildColourTab() {
    var pr = document.createElement('div'); pr.className = 'presets';
    Object.keys(PRESETS).forEach(function (k) {
      var b = document.createElement('button');
      var t = store.theme || {};
      var custom = t.cold || t.good || t.warm || t.danger || t.night || t.dawn || t.day;
      b.className = 'preset' + ((t.preset || 'default') === k && !custom ? ' sel' : '');
      b.textContent = PRESETS[k].name;
      var sw = document.createElement('span'); sw.className = 'sw';
      ['cold','good','warm','danger'].forEach(function (a) {
        var d2 = document.createElement('i'); d2.style.background = PRESETS[k][a]; sw.appendChild(d2);
      });
      b.appendChild(sw);
      b.addEventListener('click', function () {
        store.theme = { preset: k }; saveStore(); buildRamps();
        buildSettings(); renderHome(); renderShore();
      });
      pr.appendChild(b);
    });
    settingsPanel.appendChild(pr);

    var A = anchors();
    swatchRow('cold', 'Cold and dry', A.cold);
    swatchRow('good', 'Fine', A.good);
    swatchRow('warm', 'Warm', A.warm);
    swatchRow('danger', 'Dangerous', A.danger);

    var dh = document.createElement('h3'); dh.textContent = 'Sunrise and sunset';
    settingsPanel.appendChild(dh);
    var TH = store.theme || {};
    swatchRow('night', 'Night', TH.night || rgb2hex(NIGHT));
    swatchRow('dawn', 'Dawn and dusk', TH.dawn || rgb2hex(TWILIGHT));
    swatchRow('day', 'Midday', TH.day || rgb2hex(DAYLIT));

    var warn = document.createElement('p'); warn.className = 'lede contrast'; warn.id = 'contrastNote';
    settingsPanel.appendChild(warn);

    var reset = document.createElement('button'); reset.className = 'reset';
    reset.textContent = 'Reset colours';
    reset.addEventListener('click', function () {
      store.theme = { preset: 'default' }; saveStore(); buildRamps();
      buildSettings(); renderHome(); renderShore();
    });
    settingsPanel.appendChild(reset);
    updateContrast();
  }

  function swatchRow(key, label, value) {
    var row = document.createElement('label'); row.className = 'opt';
    var inp = document.createElement('input'); inp.type = 'color'; inp.value = value;
    inp.style.cssText = 'width:34px;height:26px;padding:0;border:1px solid #D6D0C4;border-radius:6px;background:none';
    inp.addEventListener('input', function () {
      store.theme = store.theme || {};
      store.theme[key] = inp.value;
      saveStore(); buildRamps(); renderHome(); renderShore(); updateContrast();
    });
    var sp = document.createElement('span'); sp.textContent = label;
    row.appendChild(inp); row.appendChild(sp); settingsPanel.appendChild(row);
  }

  function buildKeyTab() {
    var lede = document.createElement('p'); lede.className = 'lede';
    lede.textContent = 'Optional. Without a key, allergens come from a regional bloom calendar and air quality from Copernicus CAMS at about 45 km. A key replaces both with measured pollen naming the plants in season, and air quality on a 500 m grid.';
    settingsPanel.appendChild(lede);

    var steps = [
      'Go to console.cloud.google.com and create a project.',
      'In APIs & Services, enable both the Pollen API and the Air Quality API.',
      'Turn on billing for the project. Both are paid-tier products, so a card is required even though you are unlikely to be charged.',
      'Under Credentials, create an API key.',
      'Restrict the key to those two APIs so it cannot be used for anything else.',
      'Under Google Maps Platform, then Quotas, set a daily cap of about 100 on each so a mistake cannot run up a bill.',
      'Paste the key below.'
    ];
    var ol = document.createElement('ol'); ol.className = 'steps';
    steps.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
    settingsPanel.appendChild(ol);

    var cost = document.createElement('p'); cost.className = 'lede';
    cost.textContent = 'Each API allows 5,000 free calls a month. This app uses a handful a day, cached for 30 minutes, so a personal bill should be zero. The key is stored in this browser only and is billed to whoever created it.';
    settingsPanel.appendChild(cost);

    var input = document.createElement('input'); input.type = 'text';
    input.placeholder = 'Paste key, or leave blank';
    input.value = store.keys.google || '';
    input.addEventListener('change', function () {
      store.keys.google = input.value.trim(); saveStore();
      if (state.place) loadHome(state.place);
    });
    settingsPanel.appendChild(input);
  }

  function updateContrast() {
    var el = document.getElementById('contrastNote');
    if (!el) return;
    var r = contrastReport();
    if (!r) { el.textContent = ''; return; }
    el.textContent = r.text;
    el.className = 'lede contrast' + (r.ok ? ' ok' : ' bad');
  }

  function buildAbout() {
    aboutPanel.innerHTML = '';
    var h = document.createElement('h2'); h.textContent = 'Where the numbers come from';
    aboutPanel.appendChild(h);
    [['Forecast, soil and marine data', 'Open-Meteo, which blends NOAA HRRR and GFS with ECMWF. Free and keyless.'],
     ['Air quality', 'Copernicus CAMS by default, at roughly 45 km. Google Air Quality at 500 m if you add a key.'],
     ['Allergens', 'A regional bloom calendar \u2014 modelled, not counted \u2014 unless you add a Google key. Six US regions, and it is a rough guide even within them.'],
     ['Alerts', 'National Weather Service, verbatim. US only.'],
     ['Water temperature', 'NDBC buoys where one is moored within 60 miles, otherwise modelled sea surface temperature, which does not cover the Great Lakes or inland water.'],
     ['Aurora', 'NOAA Space Weather Prediction Center planetary K index.'],
     ['Moon and sun', 'Calculated in your browser, not fetched.'],
     ['Everything else', 'Rules written by hand \u2014 migraine, arthritis, bugs, frizz, shoes, mowing and the rest are heuristics from commonly cited triggers, not validated indices.']
    ].forEach(function (pair2) {
      var t = document.createElement('h3'); t.textContent = pair2[0]; aboutPanel.appendChild(t);
      var p = document.createElement('p'); p.className = 'lede'; p.textContent = pair2[1]; aboutPanel.appendChild(p);
    });
    var pv = document.createElement('h3'); pv.textContent = 'Privacy'; aboutPanel.appendChild(pv);
    var pp = document.createElement('p'); pp.className = 'lede';
    pp.textContent = 'There is no account and no server. Your settings and saved places live in this browser. Your coordinates go to the weather services above as part of each request, and nowhere else.';
    aboutPanel.appendChild(pp);
  }

  function toggle(btn, panel, build) {
    btn.addEventListener('click', function () {
      var open = panel.style.display === 'none';
      if (open) build();
      panel.style.display = open ? 'block' : 'none';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  toggle(document.getElementById('settingsBtn'), settingsPanel, buildSettings);
  toggle(document.getElementById('aboutBtn'), aboutPanel, buildAbout);

  document.getElementById('disclaimer').innerHTML =
    '<b>This is not medical advice.</b> The health-related cards are rules of thumb built from '
    + 'commonly cited weather triggers, not validated clinical tools, and no forecast can tell you '
    + 'how you will feel. Do not use this app to make decisions about medication, treatment, or '
    + 'whether to seek care. For weather that could hurt you, the National Weather Service is the '
    + 'authority \u2014 not this page. Water conditions in particular change faster than any forecast: '
    + 'check local flags and signage before you swim.';

  /* ================= start ================= */
  buildRamps();
  buildDays(); buildPlaces(); buildBeaches();
  renderShore();
  if (state.place) loadHome(state.place);
  else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      loadHome({ name: 'Your location', region: '', country: 'US',
                 lat: pos.coords.latitude, lon: pos.coords.longitude, tz: 'auto' });
    }, function () {
      searchBox.style.display = 'block';
    }, { timeout: 8000 });
  } else { searchBox.style.display = 'block'; }
  if (state.shoreSel && on('shore')) loadShore(state.shoreSel);
})();
</script>
</body>
</html>
