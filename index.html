  function renderHome() {
    var host = document.getElementById('homeBody'), p = state.home;
    if (!state.place) { host.innerHTML = ''; return; }
    if (!p) return skeleton(host, 5, 6);
    if (p.error) return fail(host, p.error);
    var d;
    try { d = derive(p.wx, p.aq, state.tz, state.dayOffset); } catch (e) { return fail(host, e.message); }
    var lat = state.place.lat, lon = state.place.lon;
    var cal = calendarFor(lat, lon);
    var span = store.span || 1;
    if (span > 1) return renderMultiDay(p, lat, lon, cal, span);
    host.className = '';
    host.innerHTML = '';
    todos = [];

    // Outside the grid entirely. Inside it, the to-do block claims row
    // one, so a full-width alert could not sit above it and got pushed
    // into the middle of the page.
    var alertHost = document.getElementById('alertBody');
    alertHost.innerHTML = '';
    (p.alerts || []).forEach(function (al) { alertHost.appendChild(card(alertCard(al, state.tz))); });
    if (state.dayOffset === 0) {
      var nc = nowCard(p.current, state.tz);
      if (nc) alertHost.appendChild(card(nc));
    }

    var hourlyBuilders = {
      feels:    function () { return feelsCard(d); },
      sky:      function () { return skyCard(d); },
      daylight: function () { return daylightCard(d, lat, lon, state.tz); },
      moon:     function () { return moonCard(d.date, state.tz, lat, lon); }
    };
    var col = document.createElement('div'); col.className = 'hourly';
    hourlyOrder().forEach(function (id) { addCard(col, id, hourlyBuilders[id]); });
    roundEnds(col);

    var grid = document.createElement('div'); grid.className = 'grid';
    var builders = {
      light:     function () { return lightCard(d); },
      burn:      function () { return burnCard(d); },
      frostbite: function () { return frostbiteCard(d); },
      frost:     function () { return frostCard(d); },
      pipe:      function () { return pipeCard(d); },
      fire:      function () { return fireCard(d); },
      bug:       function () { return bugCard(d); },
      pavement:  function () { return pavementCard(d); },
      shoe:      function () { return shoeCard(d); },
      rust:      function () { return rustCard(d); },
      mow:       function () { return mowCard(d, lat); },
      wind:      function () { return windCard(d); },
      frizz:     function () { return frizzCard(d); },
      mold:      function () { return moldCard(d); },
      arthritis: function () { return arthritisCard(d); },
      allergy:   function () { return allergyCard(d, p.pollen, cal); },
      burn:      function () { return burnCard(d); },
      migraine:  function () { return migraineCard(d); },
      air:       function () { return airCard(d, p.airGoogle); },
      light:     function () { return lightCard(d); },
      mask:      function () { return null; },   // a switch, not a card
      aurora:    function () { return auroraCard(d, p.kp); },
      eclipse:   function () {
        var hits = eclipseOn(d.date, state.tz);
        return hits.length ? eclipseCard(hits[0], state.tz, lat, lon) : null;
      },
      water:     function () { return waterCard(p.water, d.date); },
      virus:     function () { return virusCard(p.virus); },
      flag:      function () { return flagCard(p.flag); },
      moon:      function () { return moonCard(d.date, state.tz, lat, lon); }
    };
    tileOrder().forEach(function (id) { addCard(grid, id, builders[id]); });
    // Pill-only cards are built now, so the to-do list is complete
    // before anything is placed.
    PILL_ONLY.forEach(function (id) { collectOnly(id, builders[id]); });

    // Solstices and equinoxes: today's goes with the day, one in the
    // coming week goes with the week.
    if (on('eclipse')) {
      eclipseWithin(6, state.tz).forEach(function (e) {
        if (eclipseNightOwner(e, state.tz) !== dateStrIn(state.tz, 0)) return;
        todos.push({ text: eclipseLabel(e, state.tz), when: 'day', rank: 2, outdoor: true });
      });
    }

    var todaySeason = seasonPill(d.date, state.tz, lat, 0);
    if (todaySeason) todos.push({ text: todaySeason + ' today', when: 'day', rank: 1 });
    var weekItems = aheadItems(p, state.tz, state.dayOffset);
    for (var so = 1; so <= 6; so++) {
      var sp = seasonPill(d.date, state.tz, lat, so);
      if (sp) { weekItems.push({ pill: sp + ' ' + dayName(dateStrIn(state.tz, so), state.tz, so),
                                 detail: sp + ' falls this week.' }); break; }
    }

    var todoEl = on('todo') ? todoCard(weekItems) : null;
    if (todoEl) todoEl.className += ' todoblock';

    // Lines are already drawn per card (see card()); only the label row
    // is shared here.
    var axis = timeAxis();

    var blocks = { cards: col, tiles: grid, todo: todoEl };
    var order = blockOrder().filter(function (b) { return on('block-' + b); });
    // Left is the equivalent of top. If the to-do list is ordered first

  /* ================= controls ================= */
  var daySel = document.getElementById('daySel'), placeSel = document.getElementById('placeSel'),

      results = document.getElementById('results'), qIn = document.getElementById('q');

  /* The dropdown works the same in every view: pick a date, land on that
     date's full single-day page \u2014 same words, same tiles, same pills as
     if you had chosen "1 day" to begin with. In multi-day mode nothing
     is pre-selected, since none of the seven dates is "the" current one
     the way it is in single-day mode. */
  function buildDays() {
    daySel.innerHTML = '';
    var span = store.span || 1;
    if (span > 1) {
      var ph = document.createElement('option');
      ph.textContent = 'Jump to a day'; ph.disabled = true; ph.selected = true;

  function buildSpan() {
    var sel = document.getElementById('spanSel');

    [[1, '1 day'], [3, '3 days'], [5, '5 days'], [7, '7 days']].forEach(function (opt) {
      var o = document.createElement('option'); o.value = String(opt[0]); o.textContent = opt[1];

      var o = document.createElement('option'); o.value = k2; o.textContent = placeLabel(x); o._place = x;
      if (Math.abs(x.lat - state.place.lat) < 0.02 && Math.abs(x.lon - state.place.lon) < 0.02) o.selected = true;
      placeSel.appendChild(o);

    placeSel.appendChild(s);
  }

  daySel.addEventListener('change', function () {
    state.dayOffset = parseInt(daySel.value, 10) || 0;

    buildDays(); renderHome();

    }

  function wireSearch(input, list, onPick) {
    function go() {
      var q = input.value.trim(); if (q.length < 2) return;
      list.innerHTML = '<li style="padding:8px 4px">Searching</li>';
      search(q).then(function (r) {
        list.innerHTML = '';
        if (!r.length) { list.innerHTML = '<li style="padding:8px 4px">Nothing found.</li>'; return; }
        r.forEach(function (x) {
          var li = document.createElement('li');
          li.style.cssText = 'padding:9px 4px;border-top:1px solid #E4E4E4;cursor:pointer';
          li.textContent = placeLabel(x);
          li.addEventListener('click', function () { onPick(x); });
          list.appendChild(li);
        });
      });
    }
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    input.addEventListener('search', go);
    // Search as you type, so nobody has to guess that Enter is required.
    var timer = null;
    input.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(go, 350);
    });
  }

  /* A row: checkbox, name, and the two arrows. Sub-controls that only
     make sense for one card hang underneath it rather than sitting in a

  function cardRow(id, i, arr, which) {
    var meta = cardMeta(id);
    var row = document.createElement('div'); row.className = 'ord';
    var box = document.createElement('input'); box.type = 'checkbox';
    box.checked = on(id); box.disabled = !!meta.always;
    box.addEventListener('change', function () {

    });
    var nm = document.createElement('span'); nm.textContent = meta.name;
    if (meta.note) { var sm = document.createElement('small'); sm.textContent = meta.note; nm.appendChild(sm); }
    var up = document.createElement('button'); up.textContent = '\u2191';
    up.setAttribute('aria-label', 'Move ' + meta.name + ' up'); up.disabled = i === 0;
    up.addEventListener('click', function () { moveCard(id, -1, which); });
    var dn = document.createElement('button'); dn.textContent = '\u2193';
    dn.setAttribute('aria-label', 'Move ' + meta.name + ' down'); dn.disabled = i === arr.length - 1;
    dn.addEventListener('click', function () { moveCard(id, 1, which); });

          store.skin = sk.id; saveStore(); renderHome();
        });
        var sp = document.createElement('span'); sp.textContent = sk.label;
        row.appendChild(r); row.appendChild(sp); settingsPanel.appendChild(row);
      });
    }
  }

  /* Alphabetical, and no arrows: order in the to-do list comes from how
     urgent a thing is, not from a list you drag. */
  function buildTodoTab() {
    var h = document.createElement('h3'); h.textContent = 'To-do list';
    settingsPanel.appendChild(h);
    PILL_ONLY.map(cardMeta).sort(function (a, b) {
      return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
    }).forEach(function (meta) {
      var row = document.createElement('label'); row.className = 'opt';
      var box = document.createElement('input'); box.type = 'checkbox'; box.checked = on(meta.id);
      box.addEventListener('change', function () {
        store.cards[meta.id] = box.checked; saveStore(); renderHome();
      });
      var nm = document.createElement('span'); nm.textContent = meta.name;
      if (meta.note) { var sm = document.createElement('small'); sm.textContent = meta.note; nm.appendChild(sm); }
      row.appendChild(box); row.appendChild(nm); settingsPanel.appendChild(row);
    });
  }

  function buildOrderTab() {
    var h = document.createElement('h3'); h.textContent = 'Order on the page';
    settingsPanel.appendChild(h);
    function orderRow(label, checked, onToggle, onUp, onDown, first, last, indent) {
      var row = document.createElement('div'); row.className = 'ord' + (indent ? ' sub' : '');
      var box = document.createElement('input'); box.type = 'checkbox'; box.checked = checked;
      box.addEventListener('change', function () { onToggle(box.checked); });
      var nm = document.createElement('span'); nm.textContent = label;
      var up = document.createElement('button'); up.textContent = '\u2191';
      up.setAttribute('aria-label', 'Move ' + label + ' up'); up.disabled = first;
      up.addEventListener('click', onUp);
      var dn = document.createElement('button'); dn.textContent = '\u2193';
      dn.setAttribute('aria-label', 'Move ' + label + ' down'); dn.disabled = last;
      dn.addEventListener('click', onDown);
      row.appendChild(box); row.appendChild(nm); row.appendChild(up); row.appendChild(dn);
      settingsPanel.appendChild(row);
    }
    blockOrder().forEach(function (b, i, arr) {
      orderRow(BLOCK_NAME[b], on('block-' + b),
        function (v) { store.cards['block-' + b] = v; saveStore(); renderHome(); },
        function () { moveBlock(b, -1); }, function () { moveBlock(b, 1); },
        i === 0, i === arr.length - 1, false);
      if (b === 'todo' && on('block-todo')) {
        sectionOrder().forEach(function (sec, si, sarr) {
          orderRow(sectionName(sec), on('sec-' + sec),
            function (v) { store.cards['sec-' + sec] = v; saveStore(); renderHome(); },
            function () { moveSection(sec, -1); }, function () { moveSection(sec, 1); },
            si === 0, si === sarr.length - 1, true);
        });
      }
    });
  }

  function buildColourTab() {
    var pr = document.createElement('div'); pr.className = 'presets';
    Object.keys(PRESETS).forEach(function (k) {
      var b = document.createElement('button');
      var t = store.theme || {};
      var custom = t.cold || t.good || t.warm || t.danger || t.night || t.dawn || t.day;
      b.className = 'preset' + ((t.preset || 'default') === k && !custom ? ' sel' : '');
      b.textContent = PRESETS[k].name;
      var sw = document.createElement('span'); sw.className = 'sw';
      ['cold','good','warm','danger'].forEach(function (a) {
        var d2 = document.createElement('i'); d2.style.background = PRESETS[k][a]; sw.appendChild(d2);
      });
      b.appendChild(sw);
      b.addEventListener('click', function () {
        store.theme = { preset: k }; saveStore(); buildRamps();
        buildSettings(); renderHome();
      });
      pr.appendChild(b);
    });
    settingsPanel.appendChild(pr);

    var A = anchors();
    swatchRow('cold', 'Cold and dry', A.cold);
    swatchRow('good', 'Fine', A.good);
    swatchRow('warm', 'Warm', A.warm);
    swatchRow('danger', 'Dangerous', A.danger);

    var dh = document.createElement('h3'); dh.textContent = 'Sunrise and sunset';
    settingsPanel.appendChild(dh);
    var TH = store.theme || {};
    swatchRow('night', 'Night', TH.night || rgb2hex(NIGHT));
    swatchRow('dawn', 'Dawn and dusk', TH.dawn || rgb2hex(TWILIGHT));
    swatchRow('day', 'Midday', TH.day || rgb2hex(DAYLIT));

    var warn = document.createElement('p'); warn.className = 'lede contrast'; warn.id = 'contrastNote';
    settingsPanel.appendChild(warn);

    var reset = document.createElement('button'); reset.className = 'reset';
    reset.textContent = 'Reset colours';
    reset.addEventListener('click', function () {
      store.theme = { preset: 'default' }; saveStore(); buildRamps();
      buildSettings(); renderHome();
    });
    settingsPanel.appendChild(reset);
    updateContrast();
  }

  function swatchRow(key, label, value) {
    var row = document.createElement('label'); row.className = 'opt';
    var inp = document.createElement('input'); inp.type = 'color'; inp.value = value;
    inp.style.cssText = 'width:38px;height:26px;padding:0;border:1px solid #D6D0C4;border-radius:5px;background:none;flex:0 0 auto';
    inp.addEventListener('input', function () {
      store.theme = store.theme || {};
      store.theme[key] = inp.value;
      saveStore(); buildRamps(); renderHome(); updateContrast();
    });
    var sp = document.createElement('span'); sp.textContent = label;
    row.appendChild(inp); row.appendChild(sp); settingsPanel.appendChild(row);
  }

  function buildKeyTab() {
    var lede = document.createElement('p'); lede.className = 'lede';
    lede.textContent = 'Optional. Without a key, allergens come from a regional bloom calendar and air quality from Copernicus CAMS at about 45 km. A key replaces both with measured pollen naming the plants in season, and air quality on a 500 m grid.';
    settingsPanel.appendChild(lede);

    var steps = [
      'Go to console.cloud.google.com and create a project.',
      'In APIs & Services, enable both the Pollen API and the Air Quality API.',
      'Turn on billing for the project. Both are paid-tier products, so a card is required even though you are unlikely to be charged.',
      'Under Credentials, create an API key.',
      'Restrict the key to those two APIs so it cannot be used for anything else.',
      'Under Google Maps Platform, then Quotas, set a daily cap of about 100 on each so a mistake cannot run up a bill.',
      'Paste the key below.'
    ];
    var ol = document.createElement('ol'); ol.className = 'steps';
    steps.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
    settingsPanel.appendChild(ol);

    var cost = document.createElement('p'); cost.className = 'lede';
    cost.textContent = 'Each API allows 5,000 free calls a month. This app uses a handful a day, cached for 30 minutes, so a personal bill should be zero. The key is stored in this browser only and is billed to whoever created it.';
    settingsPanel.appendChild(cost);

    var input = document.createElement('input'); input.type = 'text';
    input.placeholder = 'Paste key, or leave blank';
    input.value = store.keys.google || '';
    input.addEventListener('change', function () {
      store.keys.google = input.value.trim(); saveStore();
      if (state.place) loadHome(state.place);
    });
    settingsPanel.appendChild(input);

    var mh = document.createElement('h3'); mh.textContent = 'Mast key, for state flag orders';
    settingsPanel.appendChild(mh);
    var ml = document.createElement('p'); ml.className = 'lede';
    ml.textContent = 'Optional. Without a key the flag card covers federal orders only \u2014 presidential proclamations and the dates set by law. Governors issue their own orders and there is no single source for them, so state coverage needs Mast, which maintains a reader for each state. The free tier is 250 requests a month; this app uses up to four a day, per state, cached for six hours. Sign up at mast.today.';
    settingsPanel.appendChild(ml);
    var mi = document.createElement('input'); mi.type = 'text';
    mi.placeholder = 'Paste Mast key, or leave blank';
    mi.value = (store.keys && store.keys.mast) || '';
    mi.addEventListener('change', function () {
      store.keys.mast = mi.value.trim(); saveStore();
      try { localStorage.removeItem('morningbrief.flag.v1'); } catch (e) {}
      if (state.place) loadHome(state.place);
    });
    settingsPanel.appendChild(mi);
  }

  function updateContrast() {
    var el = document.getElementById('contrastNote');
    if (!el) return;
    var r = contrastReport();
    if (!r) { el.textContent = ''; return; }
    el.textContent = r.text;
    el.className = 'lede contrast' + (r.ok ? ' ok' : ' bad');
  }

  /* Kept in one place so it stays honest as cards change: what is
     measured, what is forecast, what is arithmetic, and what is a rule
     somebody wrote by hand. */
  var ABOUT = [
    ['How to read this', [
      ['Measured', 'Water temperature, viral levels in wastewater, and National Weather Service alerts are real observations. So is air quality, if you add a key.'],
      ['Forecast', 'Temperature, humidity, cloud, rain, wind, soil and UV come from weather models. As good as any forecast and no better.'],
      ['Calculated', 'Sunrise, sunset, moonrise, moonset, phase and the solstices are astronomy. They are exact and need no data source.'],
      ['Rules written by hand', 'Migraine, arthritis, bugs, frizz, shoes, mowing, frost and the rest are heuristics built from commonly cited triggers. They are the weakest thing here. Every threshold is a number someone chose.']
    ]],
    ['Sources', [
      ['Open-Meteo', 'Forecast, soil, marine and place search. Blends NOAA HRRR and GFS with ECMWF. Free, keyless, CC BY 4.0.'],
      ['Copernicus CAMS', 'Air quality by default, at roughly 45 km. Replaced by Google Air Quality at 500 m if you add a key.'],
      ['National Weather Service', 'Active alerts, verbatim. US only.'],
      ['NOAA CO-OPS and NDBC', 'Water temperature from a shoreline gauge or a buoy. NDBC does not allow browser requests, so in practice it is usually the CO-OPS gauge.'],
      ['CDC wastewater surveillance', 'Weekly viral activity levels for COVID, influenza A and RSV, by state.'],
      ['NOAA Space Weather Prediction Center', 'Planetary K index, for the aurora card.'],
      ['Google Pollen and Air Quality', 'Only if you add your own key. Otherwise allergens come from a bloom calendar.']
    ]],
    ['How the less obvious ones work', [
      ['\u201cRight now\u201d vs the Sky card', 'Two different readings from the same request. The Sky card is built from the hourly and daily forecast, rolled up across the whole day \u2014 what the model expects today to look like. \u201cRight now\u201d reads Open-Meteo\u2019s separate current-conditions estimate, updated roughly hourly rather than from live radar. The two can disagree, which is usually the point: a short or localized shower can be genuinely falling without moving the day\u2019s overall forecast enough to change the headline above.'],
      ['Migraine', 'Mostly barometric pressure: how far it moved over the past 24 hours, with falls weighted heavier than rises, plus the next twelve hours. Then temperature swing, warm and muggy air, bright glare on a clear day, and gusty wind. Scored out of 100.'],
      ['Arthritis', 'Falling pressure only \u2014 rises do not count. Then the damp-and-cool combination, which reads worse than either alone, plus rain, a large temperature swing, and heavy humidity. Settled warm dry weather subtracts from the score. Worth knowing: this is the most widely reported weather link and one of the least well supported. Several large studies found little or no association.'],
      ['Sunburn', 'Minimal erythemal dose for your skin type divided by the UV at solar noon. Fitzpatrick I burns in about a fifth of the time Fitzpatrick VI does. Longer is not the same as safe \u2014 pigment slows burning without stopping UV damage.'],
      ['Frostbite', 'National Weather Service wind chill thresholds: about thirty minutes on bare skin at minus eighteen, ten at minus thirty-two, five at minus forty-eight. Those assume you are dry; wet clothing changes everything.'],
      ['Hair frizz', 'Dew point. Above about sixty-six the air swells the hair shaft; below twenty it pulls moisture out and leaves it charged.'],
      ['Bug spray', 'Warm enough to fly, humid, little wind to keep them off, and standing water from recent rain. A cold night knocks the score back. There is no free mosquito data anywhere, so this is a rule of thumb rather than an observation.'],
      ['Which shoes', 'Rain, snow and ice come from the forecast. Mud comes from soil moisture and soil temperature \u2014 saturated and unfrozen ground stays soft on a dry day. Road salt is inferred from a cold snowy stretch followed by a dry one.'],
      ['Mowing', 'Soil temperature and deeper soil moisture, not the top centimetre, which dries within hours of a shower. Cool-season grass north of about thirty-six degrees latitude, warm-season south of it \u2014 the same soil reading means opposite things in Michigan and Georgia.'],
      ['Allergens', 'Without a key, a bloom calendar for one of six US regions, adjusted for wind, humidity and recent rain. Modelled from the season, not counted. January reads quiet in Michigan and peak mountain cedar in Texas.'],
      ['Viruses about', 'Wastewater picks up infections before people test or see a doctor, including ones without symptoms. It describes a whole state, not a neighbourhood, and says nothing about your own risk.'],
      ['Moonrise and moonset', 'A low-precision lunar position converted to altitude for your latitude, then solved for the horizon crossings. Accurate to a couple of minutes.'],
      ['Later this week', 'Scans the next six days for a migraine or arthritis score that is both high and clearly worse than today, the first overnight freeze, or a temperature swing worth planning around.']
    ]],
    ['Privacy', [
      ['', 'There is no account, no server, no analytics and no cookies. Your settings, saved places and API keys live in this browser. Your coordinates go to the weather services above as part of each request, and nowhere else. One exception worth naming: if you add a Mast key, opening this panel loads one font from Google so the Mast credit renders in their wordmark. Nothing else on the page fetches anything from a third party.']
    ]],
    ['Limits', [
      ['', 'US only: units are imperial, alerts and the air quality index are American, and the bloom calendars cover six US regions. Health cards are estimates, not medical advice, and no forecast can tell you how you will feel. Your own record of what sets a condition off is better evidence than any threshold in here.']
    ]]
  ];

  function buildAbout() {
    aboutPanel.innerHTML = '';
    ABOUT.forEach(function (group) {
      var h = document.createElement('h2'); h.textContent = group[0];
      h.style.cssText = 'font-size:16px;margin:18px 0 2px;';
      aboutPanel.appendChild(h);
      group[1].forEach(function (item) {
        if (item[0]) {
          var t = document.createElement('h3'); t.textContent = item[0];
          aboutPanel.appendChild(t);
        }
        var p2 = document.createElement('p'); p2.className = 'lede'; p2.textContent = item[1];
        aboutPanel.appendChild(p2);
      });
    });
    if (store.keys && store.keys.mast) {
      var cr = document.createElement('p'); cr.className = 'lede';
      cr.style.marginTop = '10px';
      cr.appendChild(mastLockup());
      aboutPanel.appendChild(cr);
    }

    var live = document.createElement('p'); live.className = 'lede';
    live.style.cssText = 'margin-top:16px;padding-top:12px;border-top:1px solid var(--line);';
    var h2 = state.home || {};
    live.textContent = 'Right now: allergens '
      + (h2.pollen && h2.pollen.days ? 'measured, from the Google Pollen API.' : 'from a bloom calendar, not measured.')
      + ' Air quality ' + (h2.airGoogle && h2.airGoogle.days ? 'from Google at 500 m.' : 'from Copernicus CAMS at about 45 km.')
      + (h2.water ? ' Water temperature ' + (h2.water.kind === 'marine' ? 'modelled for open water.' : 'measured at ' + h2.water.station + '.') : '');
    aboutPanel.appendChild(live);
  }

  function toggle(btn, panel, build) {
    btn.addEventListener('click', function () {
      var open = panel.style.display === 'none';
      if (open) build();
      panel.style.display = open ? 'block' : 'none';
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }
  toggle(document.getElementById('settingsBtn'), settingsPanel, buildSettings);
  toggle(document.getElementById('aboutBtn'), aboutPanel, buildAbout);

  document.getElementById('disclaimer').innerHTML =
    '<b>This is not medical advice.</b> The health-related cards are rules of thumb built from '
    + 'commonly cited weather triggers, not validated clinical tools, and no forecast can tell you '
    + 'how you will feel. Do not use this app to make decisions about medication, treatment, or '
    + 'whether to seek care. For weather that could hurt you, the National Weather Service is the '
    + 'authority \u2014 not this page. Water conditions in particular change faster than any forecast: '
    + 'check local flags and signage before you swim.';

  /* ================= start ================= */
  buildRamps();
  pruneDone();

  /* Rotating a phone changes which layout applies, but the gradients and
     column widths are computed in JavaScript, so a CSS breakpoint on its
     own leaves them stale. Re-render, debounced. */
  var relayout = null;
  function onViewportChange() {
    clearTimeout(relayout);
    relayout = setTimeout(function () {
      if (state.home) { renderHome(); }
    }, 180);
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if (store.tapped) document.getElementById('tipHint').style.display = 'none';
  buildDays(); buildSpan(); buildPlaces();
    if (state.place) loadHome(state.place);
  else if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      loadHome({ name: 'Your location', region: '', country: 'US',
                 lat: pos.coords.latitude, lon: pos.coords.longitude, tz: 'auto' });
    }, function () {
      searchBox.style.display = 'block';
    }, { timeout: 8000 });
  } else { searchBox.style.display = 'block'; }
})();
</script>
</body>
</html>
