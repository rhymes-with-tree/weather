     local hour rather than the calendar date alone. */
  function localHourOf(iso, tz) {
    var h = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', hour12: false })
      .format(new Date(iso));
    var n = parseInt(h, 10);
    return n === 24 ? 0 : n;
  }
  function whenWord(hour) {
    return hour < 5 ? 'Overnight' : hour < 12 ? 'This Morning'
         : hour < 17 ? 'This Afternoon' : 'Tonight';
  }
  function dayOffsetOf(dateStr, tz) {
    for (var i = 0; i <= 7; i++) if (dateStrIn(tz, i) === dateStr) return i;
    return null;
  }

  /* The night an eclipse belongs to is not always the date it falls on.
     12:13 AM Friday is Thursday night as far as anyone staying up is
     concerned, so it is named for both days. */
  function eclipseNightOwner(e, tz) {
    if (!e.greatest) return e.dateUTC;
    var day = dateInTz(new Date(e.greatest), tz);
    if (localHourOf(e.greatest, tz) >= 5) return day;
    return dayBefore(day);
  }
  function eclipseLabel(e, tz) {
    var kindName = e.type + ' ' + (e.kind === 'lunar' ? 'Lunar' : 'Solar') + ' Eclipse';
    if (!e.greatest) {
      var d0 = dayOffsetOf(e.dateUTC, tz);
      return kindName + (d0 != null ? ' ' + dayName(e.dateUTC, tz, d0) : '');
    }
    var day = dateInTz(new Date(e.greatest), tz);
    var off = dayOffsetOf(day, tz);
    var time = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' })
      .format(new Date(e.greatest));
    if (localHourOf(e.greatest, tz) < 5) {
      // Both ends of the night as plain weekday names. Works whether the
      // eclipse is today or days out \u2014 the previous day comes from the
      // date itself, not from an offset that goes negative on day zero.
      var wd = function (ds) {
        return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long' })
          .format(new Date(ds + 'T12:00:00Z'));
      };
      return kindName + ', ' + wd(dayBefore(day)) + '\u2013' + wd(day) + ' night, ' + time;
    }
    return kindName + (off != null ? ' ' + dayName(day, tz, off) : '') + ' at ' + time;
  }

  function dayBefore(dateStr) {
    return new Date(Date.parse(dateStr + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10);
  }
  /* Only events still to come, or still under way. A partial eclipse that
     ended at one in the morning should not still be sitting on the page
     at lunchtime saying "Overnight". */
  function eclipseOn(dateStr, tz) {
    return ECLIPSES.filter(function (e) {
      if (!e.greatest) return e.dateUTC === dateStr;
      if (dateInTz(new Date(e.greatest), tz) !== dateStr) return false;
      var ends = e.u4 ? new Date(e.u4) : new Date(new Date(e.greatest).getTime() + 2 * 3600 * 1000);
      return ends.getTime() > Date.now();
    });
  }
  function eclipseWithin(days, tz) {
    var out = [];
    ECLIPSES.forEach(function (e) {
      var diff = (new Date(e.greatest) - new Date()) / 86400000;
      if (diff > 0 && diff <= days) out.push(e);
    });
    return out;
  }

  function eclipseCard(e, tz, lat, lon) {
    if (!e) return null;
    // Penumbral lunar eclipses are listed without a precise greatest-eclipse
    // time because the shading is faint enough that the exact minute is
    // not worth claiming \u2014 the whole event is a soft, easy-to-miss dimming.
    if (e.kind === 'lunar' && !e.greatest) {
      return { bg: bgFlat('risk', 15), bold: 'Penumbral Lunar Eclipse Today',
        tip: 'A subtle shading across part of the moon, not the dramatic red of a total eclipse. '
           + 'Easy to miss even when the sky is clear. Visible in general from ' + e.region + '.' };
    }
    var when = new Date(e.greatest);
    var localTime = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(when);

    if (e.kind === 'lunar') {
      var alt = null;
      if (lat != null) {
        var y = when.getUTCFullYear(), m = when.getUTCMonth() + 1, d = when.getUTCDate();
        var hUTC = when.getUTCHours() + when.getUTCMinutes() / 60;
        alt = moonAlt(y, m, d, hUTC, 0, lat, lon);
      }
      var up = alt != null && alt > 0;
      var face = e.type + ' Lunar Eclipse ' + whenWord(localHourOf(e.greatest, tz));
      var tip = 'Greatest eclipse at ' + localTime + ' local time. ' + e.duration + '. ';
      tip += up
        ? 'The moon is above your horizon then, so it should be visible if the sky is clear.'
        : 'The moon is below your horizon at that point, so this one is not visible from here.';
      tip += ' Visible in general from ' + e.region + '.';
      return { bg: bgFlat('risk', up ? 60 : 20), bold: face, tip: tip };
    }

    var face2 = e.type + ' Solar Eclipse ' + (e.dateUTC === dateStrIn(tz, 0) ? 'Today' : 'This Week');
    var tip2 = 'Greatest eclipse around ' + localTime + ' local time. ' + e.region + '. '
             + 'Whether it reaches your exact location depends on the path, which this cannot calculate \u2014 '
             + 'check timeanddate.com/eclipse or NASA\u2019s eclipse pages for your coordinates. '
             + 'Never look at the sun without eclipse glasses, even during a partial phase.';
    return { bg: bgFlat('burn', 6), bold: face2, tip: tip2,
             link: { href: 'https://www.timeanddate.com/eclipse/', text: 'Check exact visibility' } };
  }

  function moonCard(dateStr, tz, lat, lon) {
    var age = moonAge(dateStr);
    var f = age / LUNATION;
    var illum = Math.round(((1 - Math.cos(2 * Math.PI * f)) / 2) * 100);
    var name = age < 1.0 ? 'New Moon' : age < 6.38 ? 'Waxing Crescent' : age < 8.38 ? 'First Quarter'
             : age < 13.765 ? 'Waxing Gibbous' : age < 15.765 ? 'Full Moon' : age < 21.15 ? 'Waning Gibbous'
             : age < 23.15 ? 'Last Quarter' : age < 28.53 ? 'Waning Crescent' : 'New Moon';

    var t = (lat == null) ? { rise: null, set: null, up: [] }
                          : moonTimes(dateStr, tz || 'UTC', lat, lon);

    // The card is the night: dark where the moon is down, brightening
    // with how much of it is lit where it is up.
    var DARK = NIGHT;   // the same night the sunrise card ends on
    var lambda = illum / 100;
    var bg = 'linear-gradient(90deg,' + Array.from({ length: 24 }, function (_, h) {
      var isUp = t.up.length ? t.up[h] : false;
      var c = isUp ? blend(DARK, [248, 249, 251], 0.25 + 0.7 * lambda) : DARK;
      return css(c) + ' ' + ((h / 23) * 100).toFixed(1) + '%';
    }).join(',') + ')';

    var left, right;
    if (lat == null) {
      // No location yet, so rise and set cannot be worked out at all.
      left = [name, illum + '% lit']; right = ['', ''];
    } else {
      var riseBox = t.rise != null ? ['Moonrise', hr(t.rise)] : null;
      var setBox  = t.set  != null ? ['Moonset', hr(t.set)]   : null;
      // Whichever happens first goes on the left, so the card reads the
      // way the night runs. Past first quarter the moon sets before it
      // rises again, and showing rise-then-set implied otherwise.
      if (riseBox && setBox) {
        if (t.set < t.rise) { left = setBox; right = riseBox; }
        else { left = riseBox; right = setBox; }
      } else if (riseBox) { left = riseBox; right = ['Moonset', 'after midnight']; }
      else if (setBox)    { left = ['Moon', 'already up']; right = setBox; }
      else { left = ['Moon', 'up all day']; right = ['', '']; }
    }

    var toFull = ((14.765 - age) % LUNATION + LUNATION) % LUNATION;
    var toNew  = ((LUNATION - age) % LUNATION + LUNATION) % LUNATION;
    var next = toFull < toNew
      ? 'Full moon in ' + Math.round(toFull) + ' day' + (Math.round(toFull) === 1 ? '' : 's') + '.'
      : 'New moon in ' + Math.round(toNew) + ' day' + (Math.round(toNew) === 1 ? '' : 's') + '.';

    // The tip is what multi-day's tap-to-expand reads from, and it never
    // had the actual rise/set times in it \u2014 only split.left/right did,
    // which only the single-day card face uses. Built once here so both
    // surfaces read the same sentence instead of two different views of
    // the same computation. right can be empty (moon up or down all
    // day), in which case there is only one clause to say.
    var riseSetText = '';
    if (lat != null) {
      var clause = function (pair2) { return pair2[0] + ' ' + pair2[1]; };
      riseSetText = clause(left);
      if (right[0]) riseSetText += ', ' + clause(right)[0].toLowerCase() + clause(right).slice(1);
      riseSetText += '. ';
    }

    return { timeline: true, bg: bg,
      split: { left: left, right: right },
      caption: lat == null ? null : name + ' \u00B7 ' + illum + '% lit',
      tip: riseSetText + illum + '% illuminated, ' + Math.round(age) + ' days into the cycle. ' + next };
  }

  /* Solar longitude passes 0, 90, 180 and 270 degrees at the equinoxes
     and solstices. Solve for the instant rather than testing day
     boundaries: the June solstice often lands late on the 20th local
     time in North America while sitting on the 21st in UTC. Accurate
     to about fifteen minutes, which only matters if an event falls
     within fifteen minutes of local midnight. */
  function solLon(n) {
    var L = 280.460 + 0.9856474 * n;
    var g = (357.528 + 0.9856003 * n) * Math.PI / 180;
    return ((L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360 + 360) % 360;
  }
  var J2000 = Date.UTC(2000, 0, 1, 12, 0);
  function seasonInstant(k, year, approxDay) {
    var start = (Date.UTC(year, 0, 1) - J2000) / 86400000 + approxDay - 5;
    var f = function (n) { return ((solLon(n) - k + 540) % 360) - 180; };
    for (var a = start; a < start + 10; a += 0.25) {
      if (f(a) < 0 && f(a + 0.25) >= 0) {
        var lo = a, hi = a + 0.25;
        for (var i = 0; i < 40; i++) {
          var m = (lo + hi) / 2;
          if (f(lo) < 0 && f(m) >= 0) hi = m; else lo = m;
        }
        return new Date(J2000 + (lo + hi) / 2 * 86400000);
      }
    }
    return null;
  }
  function dateInTz(dateObj, tz) {
    var p = new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(dateObj);
    function g(t) { for (var i = 0; i < p.length; i++) if (p[i].type === t) return p[i].value; }
    return g('year') + '-' + g('month') + '-' + g('day');
  }
  /* The solstice is a note, not a card. Today it belongs with the day;
     within the coming week it belongs with the week. */
  function seasonPill(dateStr, tz, lat, offsetDays) {
    var y = parseInt(dateStr.slice(0, 4), 10);
    var north = lat == null || lat >= 0;
    var events = [
      [0,   79,  north ? 'Spring Equinox' : 'Autumn Equinox'],
      [90,  172, north ? 'Summer Solstice' : 'Winter Solstice'],
      [180, 266, north ? 'Autumn Equinox' : 'Spring Equinox'],
      [270, 355, north ? 'Winter Solstice' : 'Summer Solstice']
    ];
    var want = new Date(Date.parse(dateStr + 'T12:00:00Z') + offsetDays * 86400000);
    var target = dateInTz(want, tz);
    for (var i = 0; i < events.length; i++) {
      for (var yy = y - 1; yy <= y + 1; yy++) {
        var t = seasonInstant(events[i][0], yy, events[i][1]);
        if (t && dateInTz(t, tz) === target) return events[i][2];
      }
    }
    return null;
  }


  /* Mosquitoes. Warm, humid, calm, and water standing around from
     recent rain. No free mosquito index exists, so this is a rule of
     thumb rather than data. */
  function bugCard(d) {
    if (d.tMax < 50) return null;
    var s = 0, why = [];
    if (d.tMax >= 65 && d.tMax <= 92) { s += 34; why.push('warm enough for them to fly'); }
    else if (d.tMax >= 55) { s += 16; }
    if (d.dewMax >= 62) { s += 26; why.push('humid'); }
    else if (d.dewMax >= 52) { s += 13; }
    if (d.windMax < 8) { s += 20; why.push('barely any wind to keep them off'); }
    else if (d.windMax < 13) { s += 9; }
    else if (d.windMax >= 18) { s -= 12; why.push('windy enough to keep them down'); }
    if (d.rainYesterday >= 0.1 || d.rainSum >= 0.1) { s += 18; why.push('recent rain leaves standing water'); }
    if (d.tMin < 42) { s -= 20; why.push('a cold night knocks them back'); }
    s = Math.max(0, Math.min(100, s));
    var word = s >= 65 ? 'Bugs Are Brutal' : s >= 40 ? 'Bring Bug Spray' : s >= 20 ? 'A Few Bugs' : 'Bug-Free';
    return { bg: bgFlat('risk', s), bold: word, todo: s >= 40 ? 'Bug spray' : null, todoWhen: 'out', todoRank: 40,
      tip: (why.length ? cap(listJoin(why)) + '. ' : '')
         + (s >= 40 ? 'Worst at dawn and dusk. Repellent on exposed skin, and long sleeves after sunset. '
                    : 'You can probably skip the repellent. ')
         + 'Estimated from temperature, dew point, wind and recent rain \u2014 there is no free mosquito data to check it against.' };
  }

  /* Frostbite, using apparent temperature as the wind chill. Times
     follow the National Weather Service wind chill chart. Only shown
     when it is cold enough to matter. */
  function frostbiteCard(d) {
    var wc = d.feelsMin;
    if (wc > 32) return null;
    var word = wc <= -48 ? 'Frostbite in 5 min' : wc <= -32 ? 'Frostbite in 10 min'
             : wc <= -18 ? 'Frostbite in 30 min' : wc <= 5 ? 'Cover Exposed Skin'
             : 'Frostbite Unlikely';
    var tip = 'Wind chill bottoms out near ' + Math.round(wc) + DEG + '. ';
    tip += wc <= -18
      ? 'Those are National Weather Service wind chill thresholds for frostbite on uncovered skin. Nothing bare outdoors \u2014 face, ears, fingers.'
      : wc <= 5
        ? 'Not fast frostbite weather, but cold enough that uncovered skin suffers over a long stretch outside. Hat, gloves, something over your face.'
        : 'Below freezing, but not near frostbite territory. Frostbite needs a wind chill around 18 below before it happens in half an hour.';
    // Wind chill charts assume you are dry. Soaked fabric conducts heat
    // away many times faster, so a merely cold day turns dangerous.
    if (d.rainChance >= 40 || d.rainSum >= 0.05) {
      tip += ' Those figures assume you stay dry. Wet clothing pulls heat away many times faster than dry \u2014 melted snow soaking through changes a cold day into a genuinely risky one.';
    }
    // Cold plus wind constricts blood vessels and raises the load on
    // the heart. Advice, not a risk score.
    if (wc <= 15 && d.windMax >= 12) {
      tip += ' Cold this sharp with wind on top of it tightens blood vessels and puts more load on the heart, so heavy work outdoors \u2014 shovelling especially \u2014 costs more than it looks. Warm up inside first and take it in short stretches.';
    }
    return { bg: bgAt('feels', wc, 9), bold: word, tip: tip,
             // The risk belongs with planning; what to put on belongs with
             // walking out of the door.
             todos: wc <= -18
               ? [{ text: 'High risk of frostbite \u2014 bare skin in ' + word.replace('Frostbite in ', ''),
                    when: 'day', rank: 3 },
                  { text: 'Heavy coat, and cover your face, ears and hands', when: 'out', rank: 3 }]
               : wc <= 5
               ? [{ text: 'Frostbite risk on bare skin', when: 'day', rank: 10 },
                  { text: 'Heavy coat, hat, gloves, something over your face', when: 'out', rank: 8 }]
               : [{ text: 'Hat and gloves', when: 'out', rank: 12 }] };
  }

  /* Frizz is a dew point story, and it fails at both ends: damp air
     swells the hair shaft, bone-dry air turns it to static. Same ramp
     as Sweat, different consequence. */
  function frizzCard(d) {
    var dp = d.dewMax, w, why;
    if (dp < 20)      { w = 'Static & Flyaways'; why = 'Air this dry pulls moisture out of hair and leaves it charged.'; }
    else if (dp < 45) { w = 'Hair Behaves';      why = 'Dry enough to hold a style, damp enough to avoid static.'; }
    else if (dp < 56) { w = 'Slight Frizz';      why = 'Borderline. Fine on a good hair day, not on a bad one.'; }
    else if (dp < 66) { w = 'Frizz Likely';      why = 'Enough moisture in the air to swell the hair shaft.'; }
    else              { w = 'Frizz Guaranteed';  why = 'Saturated air. Nothing is holding today.'; }
    if (d.rainChance >= 60 && dp >= 45) why += ' Rain on top of it will not help.';
    return { bg: bgAt('sweat', dp, 7), bold: w,
      todo: dp >= 70 ? 'High chance of frizz'
          : dp >= 62 ? 'Some frizz likely'
          : dp < 20 ? 'Static air \u2014 hair will not behave' : null,
      todoWhen: 'day', todoRank: 60,
      tip: 'Dew point peaks near ' + Math.round(dp) + DEG + '. ' + why };
  }

  /* Fire weather. The National Weather Service issues Red Flag
     Warnings on roughly low humidity, strong sustained wind and dry
     fuels. A real warning arrives through the alert feed already; this
     tile is the day or two of lead time before one gets issued.
     Fuel dryness is the piece weather data cannot see, so this reads
     conditions, not fire danger. */
  function fireCard(d) {
    var rh = d.rhMin;
    if (rh == null) return null;
    var dryGround = d.rainSum < 0.05 && d.rainYesterday < 0.1;
    var inRange = rh <= 35 && d.windMax >= 15 && dryGround && d.tMax >= 40;
    if (!inRange) return null;

    var full = rh <= 25 && d.windMax >= 25;
    var near = rh <= 30 && d.windMax >= 20;
    var score = full ? 88 : near ? 62 : 40;
    var word = full ? 'Red Flag Conditions' : near ? 'Near Red Flag Conditions' : 'Elevated Fire Risk';

    var tip = 'Humidity bottoms out at ' + Math.round(rh) + '% with wind to '
            + Math.round(d.windMax) + ' mph, and no rain to speak of. ';
    tip += full
      ? 'That is the shape of a Red Flag Warning: fire spreads fast and is hard to stop. No burning, no sparks, and be careful where you park on dry grass.'
      : 'Not full Red Flag territory, but dry and windy enough that anything lit will run. Hold off on burning.';
    tip += ' Fuel dryness is the part this cannot see \u2014 an official Red Flag Warning would show up as an alert card at the top.';
    return { todo: full ? 'Fire danger: no burning, no sparks'
                        : 'Dry and windy \u2014 anything lit will run',
             todoWhen: 'day', todoRank: 4 };
  }

  /* Frost forms on a surface, not in the air. A clear calm night lets
     the windshield radiate several degrees below air temperature, so
     you can get frost with the thermometer above freezing. Needs the
     surface at or below both freezing and the dew point. */
  function frostCard(d) {
    if (d.cloudDawn == null || d.dewDawn == null) return null;
    var clearCalm = d.cloudDawn < 45 && (d.windDawn == null || d.windDawn < 7);
    var drop = clearCalm ? 5 : d.cloudDawn < 70 ? 2 : 0;
    var surface = d.tMin - drop;
    if (surface > 34 || d.dewDawn < surface - 2) return null;

    var hard = surface <= 28;
    return { bg: bgAt('feels', surface, 8),
      bold: hard ? 'Scrape the Windshield' : 'Light Frost Likely',
      todo: hard ? 'Ten extra minutes to scrape the windscreen' : 'A quick scrape before you drive',
      todoWhen: 'day', todoRank: 50,
      tip: 'Air bottoms out at ' + Math.round(d.tMin) + DEG
         + (drop ? ', and a ' + (clearCalm ? 'clear, calm' : 'partly clear') + ' night lets glass radiate to about '
                   + Math.round(surface) + DEG : '')
         + '. Dew point sits near ' + Math.round(d.dewDawn) + DEG + ', so moisture will freeze onto the surface. '
         + (hard ? 'Build ten minutes into the morning, or cover the glass tonight.'
                 : 'A quick scrape, or a few minutes of defrost.') };
  }

  /* Pipes burst on duration, not on the low. Roughly six hours below
     20 F is the point plumbers start warning about uninsulated runs. */
  function pipeCard(d) {
    if (d.coldRun < 4) return null;
    var severe = d.coldRun >= 10 || d.feelsMin <= -5;
    return { bg: bgAt('feels', d.feelsMin, 8),
      bold: severe ? 'Drip the Faucets' : 'Pipe Freeze Watch',
      todo: severe ? 'Drip the faucets tonight to prevent a burst pipe' : null,
      todoWhen: 'night', todoRank: 10,
      tip: Math.round(d.coldRun) + ' straight hours at or below 20' + DEG
         + ', bottoming out near ' + Math.round(d.feelsMin) + DEG + '. '
         + (severe
            ? 'Long enough for uninsulated pipes in crawl spaces and exterior walls to freeze. Let a faucet drip on the coldest runs and open cabinet doors under sinks.'
            : 'Getting toward the range where exposed pipes are at risk. Worth checking anything in a crawl space or against an outside wall.') };
  }

  /* Mould grows where humid air meets a cold surface. A basement in
     summer sits around 60-65 F, so an outdoor dew point above that
     means condensation on every wall you let the air touch. */
  function moldCard(d) {
    var dp = d.dewMax;
    if (dp < 58 || d.tMax < 55) return null;
    var bad = dp >= 68;
    return { bg: bgFlat('risk', bad ? 78 : 48),
      bold: bad ? 'Keep the Basement Shut' : 'Basement Damp Risk',
      todo: bad ? 'Dehumidifier on, and keep the basement shut' : null,
      todoWhen: 'day', todoRank: 60,
      tip: 'Outdoor dew point reaches ' + Math.round(dp) + DEG
         + ', above the surface temperature of a typical basement or crawl space. '
         + (bad
            ? 'Opening windows down there will condense water onto the walls. Keep it closed and run the dehumidifier.'
            : 'Borderline. Airing the basement out today will do more harm than good.')
         + ' Mould spores off damp surfaces are the same trigger as the outdoor mould in the allergen card.' };
  }

  /* Asphalt in full sun runs far hotter than the air, and paw pads
     burn well before a person notices through shoes. Cold is the other
     end: salt and ice cut pads below about 20 F. */
  function pavementCard(d) {
    var midCloud = (function () {
      var v = [];
      for (var h = 11; h <= 16; h++) { var r = d.hours[h]; if (r && r.cloud != null) v.push(r.cloud); }
      return v.length ? avg(v) : 50;
    })();
    var loading = midCloud < 30 ? 45 : midCloud < 60 ? 30 : 14;
    var surface = d.tMax + loading;
    var hot = d.tMax >= 75 && surface >= 125;
    var cold = d.feelsMin <= 15;
    if (!hot && !cold) return null;

    if (cold) {
      return { bg: bgFlat('feels', d.feelsMin), bold: 'Pavement Is Freezing',
        todo: 'Short walk, and rinse the salt off their paws after', todoWhen: 'day', todoRank: 55,
        tip: 'Wind chill near ' + Math.round(d.feelsMin) + DEG
           + '. Ice and road salt split pads at this range. Keep walks short, and rinse paws afterwards.' };
    }
    return { bg: bgFlat('risk', Math.min(100, (surface - 110) * 3)),
      bold: surface >= 140 ? 'Pavement Burns Paws' : 'Hot Pavement',
      todo: 'Walk the dog early or after sunset', todoWhen: 'day', todoRank: 55,
      tip: 'Air reaches ' + Math.round(d.tMax) + DEG + ', and asphalt in '
         + (midCloud < 30 ? 'full sun' : 'this much sun') + ' runs roughly '
         + Math.round(surface) + DEG + '. '
         + 'Hold the back of your hand to it for seven seconds \u2014 if you cannot, neither can a dog. Walk early or after sunset, and stay on grass.' };
  }

  /* Wind, which the app had been fetching and never showing. Gust
     factor is the interesting part: steady wind is workable, gusty
     wind is what makes sailing and flying miserable. */
  function windCard(d) {
    var mean = d.windMean, gust = d.gustMax || d.windMax;
    var factor = mean > 1 ? gust / mean : 1;
    var word = gust < 8 ? 'Calm' : gust < 15 ? 'Light Wind' : gust < 25 ? 'Breezy'
             : gust < 38 ? 'Windy' : 'Strong Wind';
    var steady = factor < 1.6 ? 'steady' : factor < 2.2 ? 'a bit gusty' : 'very gusty';
    var use = gust < 6 ? 'Too still for a kite or a sail.'
            : (gust >= 8 && gust <= 22 && factor < 1.9) ? 'Good steady air for a kite or a small sail.'
            : gust > 30 ? 'Too much for recreational sailing, and a kite will not survive it.'
            : 'Flyable, but the gusts will fight you.';
    return { bg: bgFlat('risk', Math.min(100, gust * 2.2)), bold: word,
      todo: (gust >= 8 && gust <= 22 && factor < 1.9) ? 'Fly a kite' : null,
      todoWhen: 'out', todoRank: 90, todoOutdoor: true,
      tip: 'Averaging ' + Math.round(mean) + ' mph with gusts to ' + Math.round(gust)
         + ' mph \u2014 ' + steady + '. ' + use };
  }

  /* The light-exposure card. Not a mood score: how much bright light
     the day actually offers, and when to go get it. */
  function lightCard(d) {
    var mins = Math.round((d.sunset - d.sunrise) * 60 * (1 - d.cloudDay / 140));
    var word = d.cloudDay >= 80 ? 'Little Bright Light' : d.cloudDay >= 55 ? 'Patchy Light'
             : d.cloudDay >= 25 ? 'Decent Light' : 'Plenty of Light';

    /* Morning light is what sets a body clock, but never before 7 \u2014 the
       old rule pointed at the first clear hour, which on a summer day was
       sunrise itself. Rounded to the nearest half hour, because nobody
       needs this to the minute. */
    var half = function (h) { return hr(Math.round(h * 2) / 2); };
    var startH = null, endH = null;
    for (var h = Math.max(7, Math.ceil(d.sunrise)); h <= 11; h++) {
      var r = d.hours[h];
      if (r && r.cloud != null && r.cloud < 55) { if (startH == null) startH = h; endH = h + 1; }
      else if (startH != null) break;
    }
    var todo = null;
    // A window that covers the whole morning is not a window. Say so
    // rather than naming five hours as if they were a slot.
    if (startH != null) {
      todo = (endH - startH >= 4)
        ? 'Morning light any time before noon'
        : 'Morning light between ' + half(startH) + ' and ' + half(endH);
    }
    else if (d.cloudDay < 55) todo = 'Get some daylight at lunch';
    else if (d.greyStreak >= 3) todo = 'Another grey day \u2014 get outside anyway, the light still helps';

    var tip = 'Roughly ' + hm(mins) + ' of usable outdoor light, '
            + Math.round(d.cloudDay) + '% cloud through the day. ';
    tip += startH != null
      ? (endH - startH >= 4 ? 'The whole morning is clear'
         : 'The clearest morning stretch runs ' + half(startH) + ' to ' + half(endH))
        + '. Light in the morning does more for your body clock than the same light later on.'
      : 'No clear morning window, so take whatever the middle of the day offers.';
    if (d.greyStreak >= 3) {
      tip += ' That is ' + d.greyStreak + ' overcast days running; if you use a lamp, this is the week for it.';
    }
    return { bg: bgFlat('sky', Math.min(100, d.cloudDay)), bold: word, tip: tip,
             todo: todo, todoWhen: 'day', todoRank: 40, todoOutdoor: true };
  }

  /* Aurora needs three things at once: a disturbed magnetosphere, a
     clear evening, and a dark-enough moon. At Great Lakes latitudes
     the Kp bar is high, so this fires rarely and means something. */
  function auroraCard(d, kp) {
    if (!kp || kp.max < 5) return null;
    var ev = [];
    for (var e = d.sunset + 1; e <= d.sunset + 5; e++) {
      var r = d.hours[e % 24];
      if (r && r.cloud != null) ev.push(r.cloud);
    }
    var cloud = ev.length ? avg(ev) : 100;
    var lit = Math.round(((1 - Math.cos(2 * Math.PI * (moonAge(d.date) / LUNATION))) / 2) * 100);
    var strong = kp.max >= 7;
    var word = strong && cloud < 40 ? 'Aurora Possible Tonight'
             : strong ? 'Aurora Active, Sky Cloudy' : 'Aurora Watch';
    return { bg: bgFlat('risk', Math.min(100, kp.max * 11)), bold: word,
      todo: (strong && cloud < 40) ? 'Drive north and look up \u2014 aurora possible' : null,
      todoWhen: 'night', todoRank: 85, todoOutdoor: true,
      tip: 'Planetary K index forecast to reach ' + kp.max.toFixed(1)
         + '. Aurora usually needs Kp 7 or better to be seen this far south. '
         + 'Evening cloud around ' + Math.round(cloud) + '%, moon ' + lit + '% lit. '
         + (strong && cloud < 40
            ? 'Worth driving north away from town lights and looking low on the northern horizon.'
            : 'Conditions are not there tonight, but the storm may hold for another day.')
         + ' From NOAA Space Weather Prediction Center.' };
  }

  /* Which shoes. Rain, snow and ice were already in the data; mud and
     road salt were the gaps, and those are the two that cost you a
     cleaning job afterwards. Written as a recommendation, not a report
     \u2014 "boots, not the good ones" is useful before you leave, and
     "your shoes got muddy" is not. */
  function shoeCard(d) {
    var codes = [];
    for (var h = 6; h <= 20; h++) { var r = d.hours[h]; if (r && r.code != null) codes.push(r.code); }
    var icy = codes.some(function (c) { return [56, 57, 66, 67].indexOf(c) > -1; });
    var snowing = d.snowToday >= 0.2 || codes.some(function (c) { return [71, 73, 75, 77, 85, 86].indexOf(c) > -1; });
    var slush = d.snow3 >= 0.5 && d.tMax > 33 && d.tMax < 46;
    var freezeThaw = d.snow3 >= 0.2 && d.tMin <= 32 && d.tMax > 33;
    // Salt sits on dry pavement after a cold snowy stretch.
    var salty = d.snow3 >= 0.2 && d.saltCold && d.rainSum < 0.05 && !snowing;
    // Mud needs unfrozen, saturated ground. Fall back to rainfall when
    // the model gives no soil data.
    var muddy = d.soilMoist != null
      ? (d.soilMoist >= 0.33 && (d.soilTemp == null || d.soilTemp > 34))
      : (d.rain3 >= 0.4 && d.tMin > 34);
    var wet = d.rainChance >= 50 || d.rainSum >= 0.10;

    var word, why, dirty = false;
    if (icy || freezeThaw) {
      word = 'Traction, Not Style';
      why = (icy ? 'Freezing rain in the forecast. ' : 'Snow on the ground with the temperature crossing freezing, so it thaws and refreezes. ')
          + 'Whatever has the best grip, and take the shorter route if there is one.';
      dirty = true;
    } else if (snowing) {
      word = 'Waterproof Boots';
      why = Math.round(d.snowToday * 10) / 10 + '\u2033 of snow expected. Boots that seal at the ankle, not shoes you will be drying on a radiator.';
      dirty = true;
    } else if (slush) {
      word = 'Waterproof Boots';
      why = 'Snow on the ground and a high near ' + Math.round(d.tMax) + DEG + ', which makes slush. Deeper and wetter than it looks at the curb.';
      dirty = true;
    } else if (muddy && wet) {
      word = 'Boots You Can Hose Off';
      why = 'Ground is saturated and more rain is coming. Anything off pavement will be mud.';
      dirty = true;
    } else if (salty) {
      word = 'Not the Good Leather';
      why = 'Cold and snowy the last few days, dry today \u2014 that leaves salt crust on the walks. It stains leather and suede for good.';
      dirty = true;
    } else if (muddy) {
      word = 'Boots You Can Hose Off';
      why = 'Ground is still saturated from recent rain, so grass and trails will be soft.';
      dirty = true;
    } else if (wet) {
      word = 'Waterproof Shoes';
      why = Math.round(d.rainChance) + '% chance of rain. Wet feet all day is the main risk, not the shoes themselves.';
    } else {
      word = 'Any Shoes You Like';
      why = 'Dry ground, nothing falling, no salt or mud to speak of.';
    }

    if (dirty) why += ' Expect to be cleaning these afterwards, so pick a pair you do not mind that with.';
    var score = word === 'Any Shoes You Like' ? 8 : word === 'Waterproof Shoes' ? 32
              : word === 'Traction, Not Style' ? 82 : 58;
    return { bg: bgFlat('risk', score), bold: word,
      todo: icy || freezeThaw ? 'Might be slippery \u2014 footwear with good traction'
          : (snowing || slush) ? 'Snow underfoot \u2014 something waterproof'
          : salty ? 'Road salt about \u2014 not the good leather'
          : muddy ? 'Shoes will get muddy \u2014 choose carefully'
          : wet ? 'Shoes for soaking wet weather' : null,
      todoWhen: 'out', todoRank: (icy || freezeThaw) ? 12 : 45,
      tip: why + (d.soilMoist == null ? ' Ground wetness estimated from rainfall \u2014 no soil data for this location.' : '') };
  }

  /* The app fetches a week and shows one day. This is the only card
     that looks past the day you selected: it scans the next six and
     surfaces the one thing worth knowing in advance. Silent unless
     something genuinely stands out, and only while you are looking at
     today \u2014 there is no "ahead" when you are already browsing
     Thursday. */
  function dayName(dateStr, tz, off) {
    if (off === 1) return 'Tomorrow';
    var t = Date.parse(dateStr + 'T12:00:00Z');
    return new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'long' }).format(new Date(t));
  }

  /* Names what it is about. "A rough one" said nothing once the app
     tracked twenty things. Returns a list so more than one thing can be
     worth flagging. */
  /* Water temperature changes over days, not hours, so today's reading
     is a fair stand-in for the week. The air is the part that varies,
     and that is forecast. */
  function swimAhead(p, tz, days) {
    var w = p && p.water;
    var t = w && w.available !== false
      ? (w.waterF != null ? w.waterF : (w.days && w.days[Object.keys(w.days)[0]] || {}).waterF)
      : null;
    if (t == null || t < 68) return null;
    var best = null;
    days.forEach(function (x) {
      if (x.d.feelsMax < 78 || x.d.rainChance > 45) return;
      if (!best || x.d.feelsMax > best.d.feelsMax) best = x;
    });
    if (!best) return null;
    var name = dayName(best.d.date, tz, best.off);
    return { pill: name + ': good swimming weather',
             detail: name + ' reaches ' + Math.round(best.d.feelsMax) + DEG
                   + ' with the water around ' + t + DEG
                   + '. Water temperature moves slowly, so today\u2019s reading is a fair guide to the week.' };
  }

  function aheadItems(p, tz, offset) {
    if (offset !== 0 || !p || !p.wx) return [];
    var today;
    try { today = derive(p.wx, p.aq, tz, 0); } catch (e) { return []; }
    var days = [];
    for (var off = 1; off <= 6; off++) {
      try {
        var dd = derive(p.wx, p.aq, tz, off);
        days.push({ off: off, d: dd, m: migraineScore(dd), a: arthritisScore(dd) });
      } catch (e) { /* past the forecast */ }
    }
    if (!days.length) return [];
    var out = [];

    [['m', 'Migraine Weather'], ['a', 'Arthritis Flare Weather']].forEach(function (pr) {
      var key = pr[0], label = pr[1];
      var todayScore = key === 'm' ? migraineScore(today).s : arthritisScore(today).s;
      var worst = null;
      days.forEach(function (x) { if (!worst || x[key].s > worst.v) worst = { v: x[key].s, x: x }; });
      if (worst && worst.v >= 45 && worst.v - todayScore >= 12) {
        var name = dayName(worst.x.d.date, tz, worst.x.off);
        var driver = topOf(worst.x[key].why);
        out.push({ pill: name + ': ' + label,
                   detail: name + ' scores ' + worst.v + ' out of 100 for ' + label.toLowerCase()
                         + ', against ' + todayScore + ' today'
                         + (driver ? ' \u2014 ' + driver.toLowerCase() : '') + '.' });
      }
    });

    if (today.tMin > 34) {
      for (var i = 0; i < days.length; i++) {
        if (days[i].d.tMin <= 32) {
          var n2 = dayName(days[i].d.date, tz, days[i].off);
          // Soil temperature separates the ground going over for the
          // first time from one more cold night on already-frozen
          // ground. Only three days of history, so never "first of the
          // season" \u2014 only the first in view.
          var frozenNow = today.soilMin != null && today.soilMin <= 32;
          out.push({ pill: 'Freezes overnight ' + n2,
                     detail: 'Low of ' + Math.round(days[i].d.tMin) + DEG + ' on ' + n2 + '. '
                           + (frozenNow
                              ? 'The ground is already frozen, so this is one more cold night rather than a change.'
                              : 'The ground is still unfrozen'
                                + (today.soilMin != null ? ' at about ' + Math.round(today.soilMin) + DEG : '')
                                + ', so this is the night for the outside tap, the hose, and anything still in the garden.') });
          break;
        }
      }
    }

    var swim = on('swim') ? swimAhead(p, tz, days) : null;
    if (swim) out.push(swim);

    if (on('eclipse')) {
      eclipseWithin(6, tz).forEach(function (e) {
        // Anything whose night is tonight is handled as a to-do instead.
        if (eclipseNightOwner(e, tz) === dateStrIn(tz, 0)) return;
        var day = e.greatest ? dateInTz(new Date(e.greatest), tz) : e.dateUTC;
        // Exact offset from local calendar dates rather than a rounded
        // millisecond difference, which drifts across a DST change.
        var off = dayOffsetOf(day, tz);
        if (off == null) return;
        out.push({ pill: eclipseLabel(e, tz), detail: eclipseCard(e, tz, null, null).tip });
      });
    }

    var drop = null, rise = null;
    days.forEach(function (x) {
      var diff = x.d.tMax - today.tMax;
      if (diff <= -18 && (!drop || diff < drop.diff)) drop = { diff: diff, x: x };
      if (diff >= 20 && (!rise || diff > rise.diff)) rise = { diff: diff, x: x };
    });
    var swing = drop || rise;
    if (swing) {
      var n3 = dayName(swing.x.d.date, tz, swing.x.off);
      out.push({ pill: (swing.diff < 0 ? 'Cools ' : 'Warms ') + Math.abs(Math.round(swing.diff)) + DEG + ' by ' + n3,
                 detail: 'High goes from ' + Math.round(today.tMax) + DEG + ' today to '
                       + Math.round(swing.x.d.tMax) + DEG + ' on ' + n3
                       + '. A swing that size is its own trigger, separate from where it lands.' });
    }
    return out.slice(0, 4);
  }


  /* Mowing. Two separate questions the data can answer: is the grass
     actually growing, and will the ground take a mower without tearing.
     Deeper soil moisture matters more than the top centimetre, which
     dries out within hours of a shower. Cool-season turf, which is what
     grows across the Great Lakes and most of the north. */
  function mowCard(d, lat) {
    // Cool-season turf north of roughly 36 degrees, warm-season south of
    // it. They grow in different temperature bands entirely, so the same
    // soil reading means opposite things in Michigan and Georgia.
    var warmSeason = lat != null && lat < 36;
    var lo = warmSeason ? 62 : 50, hi = warmSeason ? 100 : 88;
    var fastLo = warmSeason ? 70 : 55, fastHi = warmSeason ? 95 : 82;
    var turf = warmSeason ? 'warm-season grass' : 'cool-season grass';
    var st = d.soilTemp;
    if (st == null ? d.tMax < 50 : st < (warmSeason ? 50 : 40)) return null;
    var wet = d.soilDeep != null ? d.soilDeep : d.soilMoist;
    var soggy = (wet != null && wet >= 0.36) || d.rainSum >= 0.25 || d.rainYesterday >= 0.5;
    var parched = wet != null && wet < 0.12;
    var dormant = (st != null && (st < lo || st > hi)) || parched;
    var rainComing = d.rainChance >= 60;
    var growingFast = !dormant && st != null && st >= fastLo && st <= fastHi
                      && (wet == null || (wet >= 0.18 && wet < 0.36));

    var word, why;
    if (soggy) {
      word = 'Too Wet to Mow';
      why = 'Ground is saturated' + (d.rainYesterday >= 0.5 ? ' after ' + d.rainYesterday.toFixed(2) + '\u2033 of rain' : '')
          + '. Mowing now tears the turf and leaves ruts, and wet clippings clump and smother what is underneath.';
    } else if (dormant) {
      word = 'Grass Is Not Growing';
      why = parched
        ? 'Soil is dry enough that the grass has gone dormant to protect itself. Cutting it now just stresses it further.'
        : (st != null && st > hi
            ? 'Soil is too warm for ' + turf + ' to put on growth. It is coasting, not growing.'
            : 'Soil sits near ' + Math.round(st) + DEG + ', below the point where ' + turf + ' grows. Nothing to cut.');
    } else if (rainComing) {
      word = 'Mow Before the Rain';
      why = Math.round(d.rainChance) + '% chance of rain'
          + (d.rainRun ? ', likeliest ' + hr(d.rainRun.a) + DASH + hr(d.rainRun.b + 1) : '')
          + '. Ground is fine now, so the window is before it arrives rather than after.';
    } else if (growingFast) {
      word = 'Growing Fast, Mow Soon';
      why = 'Soil near ' + Math.round(st) + DEG + ' with moisture in the sweet spot, so it is putting on real growth. '
          + 'Ground is firm enough to cut today.';
    } else {
      word = 'Fine to Mow';
      why = 'Ground is firm and nothing is falling. Growth is slow, so it can wait if you would rather.';
    }
    var score = soggy ? 72 : dormant ? 20 : rainComing ? 48 : growingFast ? 40 : 14;
    return { bg: bgFlat('risk', score), bold: word,
      todo: rainComing ? 'Mow before the rain arrives' : growingFast ? 'Mow the lawn' : null,
      todoWhen: 'day', todoRank: 65, todoOutdoor: true,
      tip: why + (d.soilDeep == null ? ' Soil moisture estimated from rainfall \u2014 no soil data for this location.' : '') };
  }

  /* Road salt does its worst damage not while it is freezing but once
     it thaws: the reaction needs liquid water, so a warm day after a
     salted stretch is when the undercarriage actually corrodes. Reuses
     the salt detection from the shoe call. */
  function rustCard(d) {
    if (!(d.snow3 >= 0.2 && d.saltCold && d.tMax >= 40)) return null;
    var washing = d.rainSum >= 0.3;
    return { bg: bgFlat('risk', washing ? 42 : 66),
      bold: washing ? 'Rain Is Rinsing the Salt' : 'Wash the Salt Off',
      todo: washing ? null : 'Wash the salt off the car, undercarriage too, to prevent rust',
      todoWhen: 'day', todoRank: 70, todoOutdoor: true,
      tip: 'Snow and salt in the last few days, and today reaches '
         + Math.round(d.tMax) + DEG + '. '
         + (washing
            ? d.rainSum.toFixed(2) + '\u2033 of rain will take some of it off, though rain does not reach the undercarriage where it matters most.'
            : 'Salt corrodes fastest once it thaws, because the reaction needs liquid water \u2014 a cold salted week does less damage than the first warm day after it. This is the day a wash with an undercarriage rinse is worth the money.') };
  }

  /* Distinct from the day's forecast headline on purpose: this reads
     Open-Meteo's own current-conditions estimate, not the hourly/daily
     rollup the Sky card is built from. Silent unless something is
     actually falling right now \u2014 a clear "Right now: sunny" note would
     just repeat what the Sky card's gradient already shows at the "now"
     line, and the one time this needed to exist was precisely the case
     the rollup could miss: real rain, no mention anywhere on the page. */
  function nowCard(current, tz) {
    if (!current) return null;
    var kind = precipKindOne(current.weather_code);
    var amt = Math.max(current.precipitation || 0, current.rain || 0,
                        current.showers || 0, current.snowfall || 0);
    if (!kind || amt <= 0) return null;
    var noun = { hail: 'Hail', thunder: 'Thunderstorms', freezing: 'Freezing Rain',
                 snow: 'Snow', showers: 'Showers', rain: 'Rain', drizzle: 'Drizzle' }[kind];
    var t = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' })
      .format(new Date(current.time));
    // alert:true, not sm: without it this fell through to the small-tile
    // class, then got stretched full width in alertHost \u2014 the wrong
    // size for the wrong reason. Same flag alertCard() uses, so a real
    // weather alert and this sit at the same height and rhythm. The
    // methodology paragraph moved to About, where the other "how this
    // differs from the forecast" explanations already live \u2014 the tap
    // only needs the two facts someone actually wants mid-glance.
    return { alert: true, bold: noun + ' Right Now',
      det: current.temperature_2m != null ? ' (' + Math.round(current.temperature_2m) + DEG + ')' : '',
      tip: 'As of ' + t + ' local time.' };
  }

  function alertCard(al, tz) {
    var until = al.ends ? shortTime(al.ends, tz) : '';
    return { alert: true, bold: al.event, det: until ? ' (until ' + until + ')' : '',
             tip: al.headline || null };
  }


  /* ---- contrast ----
     Ramps are checked rather than warned about in the abstract: sample
     each one, compute the WCAG ratio against the ink colour, and name
     the ramp that fails so a single anchor can be nudged. */
  function lum(c) {
    var v = c.map(function (x) {
      x = x / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function ratio(a, b) {
    var l1 = lum(a), l2 = lum(b);
    return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  }
  var INK = [22, 35, 47];
  var RAMP_LABEL = { feels: 'Feels Like', sweat: 'Humidity', aqi: 'Air quality',
    risk: 'the risk tiles', burn: 'Sunburn', rain: 'Precipitation',
    water: 'Water', sky: 'Sun and cloud' };
  function sampleRamp(key, v) {
    var r = RAMP[key];
    if (v <= r[0][0]) return r[0][1];
    for (var i = 1; i < r.length; i++) {
      if (v <= r[i][0]) {
        var a = r[i - 1], b = r[i], t = (v - a[0]) / (b[0] - a[0]);
        return blend(a[1], b[1], t);
      }
    }
    return r[r.length - 1][1];
  }
  function contrastReport() {
    var worst = null;
    Object.keys(RAMP).forEach(function (k) {
      var r = RAMP[k], lo = r[0][0], hi = r[r.length - 1][0];
      for (var i = 0; i <= 12; i++) {
        var v = lo + (hi - lo) * (i / 12);
        var rr = ratio(sampleRamp(k, v), INK);
        if (!worst || rr < worst.r) worst = { r: rr, ramp: k, at: i / 12 };
      }
    });
    [['night', NIGHT], ['dawn', TWILIGHT], ['midday', DAYLIT]].forEach(function (pr) {
      var rr = ratio(pr[1], INK);
      if (!worst || rr < worst.r) worst = { r: rr, ramp: 'sunrise', at: 0.5, band: pr[0] };
    });
    if (!worst) return null;
    if (worst.r >= 4.5) return { ok: true, text: 'Text stays readable across every card.' };
    if (worst.ramp === 'sunrise') {
      return { ok: false, text: 'Hard to read on the ' + worst.band + ' band of Sunrise and sunset \u2014 contrast '
             + worst.r.toFixed(1) + ' to 1, below the 4.5 guideline. Try a lighter colour.' };
    }
    var where = worst.at < 0.34 ? 'low end' : worst.at > 0.66 ? 'high end' : 'middle';
    return { ok: false, text: 'Hard to read at the ' + where + ' of ' + (RAMP_LABEL[worst.ramp] || worst.ramp)
           + ' \u2014 contrast ' + worst.r.toFixed(1) + ' to 1, below the 4.5 guideline. '
           + 'Try a lighter colour for that anchor.' };
  }

  /* ---- card order ----
     Stored as a list of ids; anything unlisted keeps its default slot,
     so adding a card later does not strand it. */
  /* Tiles describe what the weather is doing. Anything that only ever
     produced an instruction is in PILL_ONLY instead \u2014 still built, still
     switchable, but it contributes a line to the to-do list rather than
     taking a slot in the grid. */
  /* Daylight lost its tile: the length of the day is already on the
     sunrise card and the cloud is already on the sky card, so the tile
     was restating both. Its pill \u2014 when to go get some light \u2014 is the
     part that was not said anywhere else, so that stays. */
  /* The whole blocks move too, not just the cards inside them. Alerts
     are pinned to the top \u2014 an urgent warning under a to-do list would
     be daft \u2014 and the solstice note stays last. */
  /* Three page blocks. "Later this week" used to be a fourth that
     spanned both columns, which is what wedged itself between them
     whenever the order changed \u2014 it is now a section of the to-do
     list, where it reads as part of the same thought anyway. */
  var DEFAULT_BLOCKS = ['cards', 'tiles', 'todo'];
  var BLOCK_NAME = { cards: 'Across the day', tiles: 'Tiles', todo: 'To-do list' };
  function blockOrder() {
    var saved = store.blocks || [];
    var out = saved.filter(function (b) { return DEFAULT_BLOCKS.indexOf(b) > -1; });
    DEFAULT_BLOCKS.forEach(function (b) { if (out.indexOf(b) < 0) out.push(b); });
    return out;
  }
  function moveBlock(id, dir) {
    var o = blockOrder(), i = o.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= o.length) return;
    o.splice(j, 0, o.splice(i, 1)[0]);
    store.blocks = o; saveStore(); buildSettings(); renderHome();
  }

  var DEFAULT_TILE_ORDER = ['flag', 'air', 'allergy', 'virus', 'burn', 'light', 'water', 'pavement', 'wind', 'aurora', 'eclipse'];
  var PILL_ONLY = ['frostbite','migraine','arthritis','frizz','bug',
                   'shoe','frost','pipe','rust','mow','mold','fire','mask','swim'];
  var DEFAULT_HOURLY_ORDER = ['feels', 'sky', 'daylight', 'moon'];
  function orderOf(which) {
    var def = which === 'hourly' ? DEFAULT_HOURLY_ORDER : DEFAULT_TILE_ORDER;
    var saved = (which === 'hourly' ? store.orderH : store.order) || [];
    var out = saved.filter(function (id) { return def.indexOf(id) > -1; });
    def.forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    return out;
  }
  function tileOrder() { return orderOf('tiles'); }
  function hourlyOrder() { return orderOf('hourly'); }
  function moveCard(id, dir, which) {
    var o = orderOf(which), i = o.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= o.length) return;
    o.splice(j, 0, o.splice(i, 1)[0]);
    if (which === 'hourly') store.orderH = o; else store.order = o;
    saveStore(); buildSettings(); renderHome();
  }

  /* ================= data =================
     Every request goes straight from this browser to a public,
     keyless endpoint. Nothing is proxied. */
  /* Google and CDC both return a JSON body explaining a 400. Reading it
     turns "Service returned 400" into something a person can act on \u2014
     an unsupported location reads very differently from a bad key. */
  function j(url, opts) {
    return fetch(url, opts || {}).then(function (r) {
      if (r.ok) return r.json();
      return r.text().then(function (body) {
        var msg = '';
        try {
          var parsed = JSON.parse(body);
          msg = (parsed.error && parsed.error.message) || parsed.message || '';
        } catch (e) { /* not JSON, fall back to the status */ }
        throw new Error(msg || ('Service returned ' + r.status));
      }, function () { throw new Error('Service returned ' + r.status); });
    });
  }

  var FORECAST = 'https://api.open-meteo.com/v1/forecast';
  function wxUrl(lat, lon, tz, past) {
    return FORECAST + '?latitude=' + lat + '&longitude=' + lon
      + '&timezone=' + encodeURIComponent(tz || 'auto')
      + '&hourly=apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation_probability,'
      + 'precipitation,snowfall,pressure_msl,cloud_cover,wind_speed_10m,wind_gusts_10m,uv_index,'
      + 'weather_code,soil_moisture_0_to_1cm,soil_moisture_3_to_9cm,soil_temperature_0cm'
      + '&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,'
      + 'apparent_temperature_min,precipitation_sum,snowfall_sum,precipitation_probability_max,'
      + 'uv_index_max,shortwave_radiation_sum,sunrise,sunset'
      // The day's headline is built entirely from the hourly/daily
      // forecast above, aggregated across all 24 hours \u2014 which is why
      // a short, localized, or under-forecast shower can be genuinely
      // happening outside while the headline still says "Mostly Sunny."
      // This asks Open-Meteo for its own current-conditions estimate in
      // the same request, so there is finally something to check that
      // isn't a forecast rollup. Same request, no extra round trip.
      + '&current=temperature_2m,precipitation,rain,showers,snowfall,weather_code,cloud_cover'
      + '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch'
      + '&past_days=' + past + '&forecast_days=7';
  }

  function loadHome(place) {
    if (!place) return;
    state.place = place;
    var host = document.getElementById('homeBody');
    host.classList.add('busy');

    var jobs = [
      j(wxUrl(place.lat, place.lon, place.tz, 3)),
      j('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + place.lat
        + '&longitude=' + place.lon + '&timezone=' + encodeURIComponent(place.tz || 'auto')
        + '&hourly=pm2_5,ozone,us_aqi&forecast_days=5&past_days=1').catch(function () { return null; }),
      j('https://api.weather.gov/alerts/active?point=' + place.lat.toFixed(4) + ',' + place.lon.toFixed(4),
        { headers: { 'Accept': 'application/geo+json' } })
        .then(function (a) {
          return (a.features || []).slice(0, 4).map(function (f) {
            return { event: f.properties.event, headline: f.properties.headline || '',
                     ends: f.properties.ends || f.properties.expires || '' };
          });
        }).catch(function () { return []; }),
      j('https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json')
        .then(function (rows) {
          var max = 0;
          for (var i = 1; i < rows.length; i++) {
            var v = parseFloat(rows[i][1]); if (isFinite(v) && v > max) max = v;
          }
          return max ? { max: max } : null;
        }).catch(function () { return null; })
    ];

    Promise.all(jobs).then(function (r) {
      state.home = { wx: r[0], aq: r[1], alerts: r[2], kp: r[3], pollen: null, airGoogle: null,
                     current: r[0].current || null,
                     water: null, virus: null, flag: null };
      state.tz = r[0].timezone || place.tz || 'America/Detroit';
      store.place = place;
      store.recents = [place].concat((store.recents || []).filter(function (x) {
        return Math.abs(x.lat - place.lat) > 0.02 || Math.abs(x.lon - place.lon) > 0.02;
      })).slice(0, 8);
      state.recents = store.recents;
      saveStore();
      buildDays(); buildSpan(); buildPlaces(); renderHome();
      host.classList.remove('busy');
      if (store.keys.google) loadGoogle(place);
      // Water arrives on its own schedule: a tile appears if a gauge or
      // buoy turns out to be near, and nothing appears if you are inland.
      if (on('water')) {
        waterFor(place, r[0].timezone).then(function (w) {
          if (!w || !state.home || state.home.error) return;
          state.home.water = w; renderHome();
        });
      }
      if (on('virus')) {
        virusFor(place).then(function (vv) {
          if (!vv || !state.home || state.home.error) return;
          state.home.virus = vv; renderHome();
        });
      }
      if (on('flag')) {
        flagFor(place, dateStrIn(r[0].timezone || place.tz, 0)).then(function (ff) {
          if (!ff || !state.home || state.home.error) return;
          state.home.flag = ff; renderHome();
        });
      }
    }).catch(function (e) {
      state.home = { error: (e && e.message) || 'Could not reach the weather service.' };
      renderHome(); host.classList.remove('busy');
    });
  }

  /* Optional, and billed to whoever owns the key. Without one the app
     falls back to CAMS air quality and a modelled bloom calendar, and
     each card says which it used. */
  function loadGoogle(place) {
    var k = store.keys.google; if (!k) return;
    var now = new Date();
    Promise.all([
      j('https://pollen.googleapis.com/v1/forecast:lookup?key=' + encodeURIComponent(k)
        + '&location.latitude=' + place.lat + '&location.longitude=' + place.lon
        // Google's docs are explicit that this takes 0, not false. Sending
        // 'false' is rejected as a malformed request.
        + '&days=5&languageCode=en&plantsDescription=0')
        .then(function (p) {
          return { days: (p.dailyInfo || []).map(function (dd) {
            var dt2 = dd.date || {};
            function p2(n) { return (n < 10 ? '0' : '') + n; }
            return { date: dt2.year + '-' + p2(dt2.month) + '-' + p2(dt2.day),
              types: (dd.pollenTypeInfo || []).map(function (t) {
                return { name: t.displayName || t.code, index: t.indexInfo ? t.indexInfo.value : null,
                         inSeason: !!t.inSeason }; }),
              plants: (dd.plantInfo || []).filter(function (x) { return x.indexInfo && x.indexInfo.value > 0; })
                .map(function (x) { return { name: x.displayName || x.code, index: x.indexInfo.value }; }) };
          }) };
        }).catch(function (e) { return { error: 'Pollen: ' + e.message }; }),
      fetch('https://airquality.googleapis.com/v1/forecast:lookup?key=' + encodeURIComponent(k), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          location: { latitude: place.lat, longitude: place.lon },
          period: { startTime: now.toISOString(),
                    endTime: new Date(now.getTime() + 95 * 3600 * 1000).toISOString() },
          universalAqi: false,
          extraComputations: ['HEALTH_RECOMMENDATIONS', 'DOMINANT_POLLUTANT_CONCENTRATION', 'LOCAL_AQI'],
          customLocalAqis: [{ regionCode: 'us', aqi: 'usa_epa' }],
          languageCode: 'en', pageSize: 96 })
      }).then(function (r) { return r.json(); }).then(function (jj) {
        var byDay = {};
        (jj.hourlyForecasts || []).forEach(function (h) {
          if (!h.dateTime) return;
          var day = new Intl.DateTimeFormat('en-CA', { timeZone: state.tz, year: 'numeric',
            month: '2-digit', day: '2-digit' }).format(new Date(h.dateTime));
          var epa = null;
          (h.indexes || []).forEach(function (ix) { if (ix.code === 'usa_epa') epa = ix; });
          if (!epa || epa.aqi == null) return;
          if (!byDay[day] || epa.aqi > byDay[day].aqi) {
            byDay[day] = { aqi: epa.aqi, dominant: epa.dominantPollutant || '',
              lungAdvice: (h.healthRecommendations && h.healthRecommendations.lungDiseasePopulation) || '',
              generalAdvice: (h.healthRecommendations && h.healthRecommendations.generalPopulation) || '' };
          }
        });
        return Object.keys(byDay).length ? { days: byDay } : null;
      }).catch(function (e) { return { error: 'Air quality: ' + e.message }; })
    ]).then(function (g) {
      if (!state.home || state.home.error) return;
      state.home.pollen = g[0]; state.home.airGoogle = g[1];
      renderHome();
    });
  }

  /* ---- why is the flag at half-staff ----
     Three layers. The recurring dates are set by statute (4 USC 7(m))
     and need no network at all. Presidential proclamations come from
     the Federal Register, which is free, keyless and sends CORS
     headers. State orders need a Mast key, because there is no single
     source for them \u2014 every governor publishes differently and Mast
     maintains a parser per state. */
  function nthWeekday(y, m, weekday, n) {     // n = 1 for first, -1 for last
    if (n > 0) {
      var d = new Date(Date.UTC(y, m - 1, 1));
      var shift = (weekday - d.getUTCDay() + 7) % 7;
      return new Date(Date.UTC(y, m - 1, 1 + shift + (n - 1) * 7));
    }
    var last = new Date(Date.UTC(y, m, 0));
    var back = (last.getUTCDay() - weekday + 7) % 7;
    return new Date(Date.UTC(y, m, 0 - back));
  }
  function statutoryHalfStaff(dateStr) {
    var y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7), d = +dateStr.slice(8, 10);
    var iso = function (dt) { return dt.toISOString().slice(0, 10); };
    if (m === 5 && d === 15) return { why: 'Peace Officers Memorial Day', until: 'sunset' };
    if (m === 9 && d === 11) return { why: 'Patriot Day', until: 'sunset' };
    if (m === 12 && d === 7) return { why: 'National Pearl Harbor Remembrance Day', until: 'sunset' };
    if (m === 5 && iso(nthWeekday(y, 5, 1, -1)) === dateStr) {
      return { why: 'Memorial Day', until: 'noon' };
    }
    if (m === 10 && iso(nthWeekday(y, 10, 0, 1)) === dateStr) {
      return { why: 'National Fallen Firefighters Memorial Service', until: 'sunset' };
    }
    return null;
  }

  var FLAG_KEY = 'morningbrief.flag.v1';
  function flagFor(place, dateStr) {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(FLAG_KEY)); } catch (e) {}
    var stateCode = place && place.region ? STATE_ABBR[String(place.region).toLowerCase()] : null;
    if (cached && cached.at && Date.now() - cached.at < 6 * 3600 * 1000
        && cached.date === dateStr && cached.stateCode === stateCode) {
      return Promise.resolve(cached.data);
    }
    var jobs = [federalFlag(dateStr), mastFlag(stateCode)];
    return Promise.all(jobs).then(function (r) {
      var out = { federal: r[0], state: r[1],
                  statutory: statutoryHalfStaff(dateStr) };
      if (!out.federal && !out.state && !out.statutory) out = null;
      try {
        localStorage.setItem(FLAG_KEY, JSON.stringify({ at: Date.now(), date: dateStr,
                                                        stateCode: stateCode, data: out }));
      } catch (e) {}
      return out;
    }).catch(function () { return null; });
  }

  function federalFlag(dateStr) {
    // Anything ordered in the last 45 days could still be running.
    var since = new Date(Date.parse(dateStr + 'T12:00:00Z') - 45 * 86400000).toISOString().slice(0, 10);
    var url = 'https://www.federalregister.gov/api/v1/documents.json'
            + '?conditions[term]=' + encodeURIComponent('"half-staff"')
            + '&conditions[type][]=PRESDOCU'
            + '&conditions[publication_date][gte]=' + since
            + '&order=newest&per_page=4'
            + '&fields[]=title&fields[]=publication_date&fields[]=signing_date'
            + '&fields[]=html_url&fields[]=raw_text_url';
    return j(url).then(function (r) {
      var docs = (r && r.results) || [];
      for (var i = 0; i < docs.length; i++) {
        var t = String(docs[i].title || '');
        if (t.toLowerCase().indexOf('half-staff') < 0) continue;
        return { title: t.replace(/^Display of the Flag at Half-Staff\s*/i, '')
                         .replace(/^as a Mark of Respect\s*/i, 'As a mark of respect '),
                 signed: docs[i].signing_date || docs[i].publication_date,
                 url: docs[i].html_url, raw: docs[i].raw_text_url };
      }
      return null;
    }).catch(function () { return null; });
  }

  /* Mast covers state orders, which have no common source. Confirmed
     against their published documentation (mast.today/api#us-status):
     the key goes in an x-mast-license-key header, not a query string,
     and the response is { ok, status: { isHalfMast, title, authority },
     calendar, cache }. An earlier version of this guessed at the shape
     from field-name patterns and got the header, the nesting and the
     field names all wrong \u2014 it silently produced 'A state order is in
     effect: A state order is in effect', the fallback text echoing
     itself because the real fields were never there to read. */
  function mastFlag(stateCode) {
    var k = (store.keys && store.keys.mast) || '';
    if (!k || !stateCode) return Promise.resolve(null);
    return fetch('https://www.mast.today/api/v1/status?countryCode=US&stateCode=' + stateCode, {
      headers: { 'x-mast-license-key': k }
    }).then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).then(function (j2) {
      if (!j2 || !j2.ok || !j2.status || !j2.status.isHalfMast) return null;
      var st = j2.status;
      if (!st.title || /^no active order$/i.test(st.title)) return null;
      return { title: st.title,
               authority: (st.authority && !/^unknown$/i.test(st.authority)) ? st.authority : '',
               url: st.sourceUrl || st.url || '' };
    }).catch(function () { return null; });
  }

  /* ---- respiratory viruses in wastewater ----  /* ---- respiratory viruses in wastewater ----
     CDC's National Wastewater Surveillance System, dataset atcp-73re:
     weekly viral activity levels for SARS-CoV-2, influenza A and RSV,
     by state. US public domain, keyless.

     Two requests rather than one: the first asks for a single row to
     learn the column names, because a hardcoded schema breaks silently
     the day CDC renames a field. The second asks for this state only.

     WastewaterSCAN feeds into this system but publishes under a
     non-commercial licence that asks you to make contact first, so the
     CDC copy is the one a public page can use. */
  var VIRUS_KEY = 'morningbrief.virus.v1';
  var STATE_ABBR = { alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',
    connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',
    idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',
    maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',
    montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM',
    'new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',
    pennsylvania:'PA','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',
    texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',
    wisconsin:'WI',wyoming:'WY','puerto rico':'PR' };

  function findKey(row, pats) {
    var keys = Object.keys(row || {});
    for (var i = 0; i < pats.length; i++) {
      for (var j = 0; j < keys.length; j++) {
        if (keys[j].toLowerCase().indexOf(pats[i]) > -1) return keys[j];
      }
    }
    return null;
  }
  var VIRUS_NAME = { 'sars-cov-2': 'COVID', 'sars cov 2': 'COVID', 'covid': 'COVID',
    'influenza a': 'Flu A', 'influenza': 'Flu A', 'flu': 'Flu A', 'rsv': 'RSV' };
  function niceVirus(v) {
    var t = String(v || '').toLowerCase();
    var out = null;
    Object.keys(VIRUS_NAME).forEach(function (k) { if (!out && t.indexOf(k) > -1) out = VIRUS_NAME[k]; });
    return out || v;
  }
  var LEVEL_RANK = { 'very low': 5, 'low': 25, 'moderate': 50, 'high': 78, 'very high': 95 };

  function virusFor(place) {
    var region = (place && place.region) ? String(place.region).toLowerCase() : '';
    var abbr = STATE_ABBR[region];
    if (!abbr) return Promise.resolve(null);       // outside the 50 states plus DC and PR

    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(VIRUS_KEY)); } catch (e) {}
    if (cached && cached.abbr === abbr && Date.now() - cached.at < 6 * 3600 * 1000) {
      return Promise.resolve(cached.data);
    }
    var base = 'https://data.cdc.gov/resource/atcp-73re.json';
    return j(base + '?$limit=1').then(function (sample) {
      if (!sample || !sample.length) return null;
      var row = sample[0];
      var kState = findKey(row, ['state', 'jurisdiction', 'territory', 'reporting']);
      var kDate  = findKey(row, ['week_end', 'date', 'week']);
      var kVirus = findKey(row, ['pathogen', 'virus', 'target']);
      var kLevel = findKey(row, ['category', 'level_class', 'wval_category']);
      var kValue = findKey(row, ['wval', 'activity_level', 'value', 'level']);
      if (!kState || !kVirus) return null;

      var where = encodeURIComponent(
        kState + " in('" + abbr + "','" + region.replace(/(^|\s)\S/g, function (c) { return c.toUpperCase(); }) + "')");
      var url = base + '?$where=' + where + '&$limit=400'
              + (kDate ? '&$order=' + kDate + ' DESC' : '');
      return j(url).then(function (rows) {
        if (!rows || !rows.length) return null;
        var latest = {};
        rows.forEach(function (r) {
          var v = niceVirus(r[kVirus]);
          var when = kDate ? r[kDate] : '';
          if (!latest[v] || when > latest[v].when) {
            var lvl = kLevel ? String(r[kLevel] || '').toLowerCase() : '';
            var num = kValue != null ? parseFloat(r[kValue]) : NaN;
            latest[v] = { when: when, level: lvl, value: isFinite(num) ? num : null };
          }
        });
        var out = { at: Date.now(), abbr: abbr,
                    data: { state: place.region, week: null, items: [] } };
        Object.keys(latest).forEach(function (v) {
          var e = latest[v];
          var rank = LEVEL_RANK[e.level];
          if (rank == null && e.value != null) {
            // Fall back to the published numeric bands when no category
            // column is present.
            rank = e.value <= 1.5 ? 5 : e.value <= 3 ? 25 : e.value <= 4.5 ? 50 : e.value <= 8 ? 78 : 95;
            e.level = e.value <= 1.5 ? 'very low' : e.value <= 3 ? 'low' : e.value <= 4.5 ? 'moderate'
                    : e.value <= 8 ? 'high' : 'very high';
          }
          if (rank == null) return;
          out.data.week = out.data.week || e.when;
          out.data.items.push({ virus: v, level: e.level, rank: rank });
        });
        if (!out.data.items.length) return null;
        out.data.items.sort(function (a, b) { return b.rank - a.rank; });
        try { localStorage.setItem(VIRUS_KEY, JSON.stringify(out)); } catch (e) {}
        return out.data;
      });
    }).catch(function () { return null; });
  }

  /* ---- water ----------------------------------------------------
     Two sources. NDBC buoys are real thermometers but only exist
     where one is moored; the Marine API models sea surface
     temperature for ocean coasts but does not cover the Great Lakes
     or any inland water. The station list is fetched once and cached
     for a day, so nearest-buoy works anywhere without a hardcoded
     list of guesses. */
  var STATIONS_KEY = 'morningbrief.stations.v1';
  /* NDBC does not send CORS headers, so a browser request to it fails.
     The attempt is kept because it is the better source when it works
     \u2014 offshore, with wave height \u2014 but a failure is remembered for a
     day so every page load is not spent waiting on a blocked host. */
  function stations() {
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(STATIONS_KEY)); } catch (e) {}
    if (cached && cached.at && Date.now() - cached.at < 86400000) return Promise.resolve(cached.list);
    return fetch('https://www.ndbc.noaa.gov/activestations.xml')
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        var list = [], re = /<station\s+([^>]*)\/?>/g, m;
        while ((m = re.exec(txt))) {
          var a = m[1];
          function attr(n) { var x = new RegExp(n + '="([^"]*)"').exec(a); return x ? x[1] : null; }
          var lat = parseFloat(attr('lat')), lon = parseFloat(attr('lon'));
          if (!isFinite(lat) || !isFinite(lon)) continue;
          list.push({ id: attr('id'), lat: lat, lon: lon, name: attr('name') || attr('id') });
        }
        try { localStorage.setItem(STATIONS_KEY, JSON.stringify({ at: Date.now(), list: list })); } catch (e) {}
        return list;
      })
      .catch(function () {
        try { localStorage.setItem(STATIONS_KEY, JSON.stringify({ at: Date.now(), list: [] })); } catch (e) {}
        return null;
      });
  }
  function milesBetween(a, b, c, e) {
    var R = 3958.8, t = Math.PI / 180;
    var dLat = (c - a) * t, dLon = (e - b) * t;
    var x = Math.sin(dLat / 2) * Math.sin(dLat / 2)
          + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
  }
  function nearestBuoy(lat, lon) {
    return stations().then(function (list) {
      if (!list || !list.length) return null;
      var best = null;
      list.forEach(function (s) {
        var d2 = milesBetween(lat, lon, s.lat, s.lon);
        if (d2 <= 60 && (!best || d2 < best.miles)) best = { st: s, miles: Math.round(d2) };
      });
      return best;
    });
  }
  function buoyReading(b) {
    return fetch('https://www.ndbc.noaa.gov/data/realtime2/' + b.st.id + '.txt')
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (txt) {
        var lines = txt.split('\n');
        var cols = lines[0].replace(/^#/, '').trim().split(/\s+/);

  /* NOAA CO-OPS. Covers the coastline AND the Great Lakes, which no

      });

      return j('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest'
        + '&station=' + encodeURIComponent(best.st.id)

        + '&application=MorningBrief&format=json')

  var todos = [];
  function collectTodos(row) {

  }

  var TODO_ALL = [['day', 'Planning your day'], ['out', 'Heading out'],
                  ['night', 'Planning your night'], ['week', 'Later this week']];
  function sectionOrder() {
    var def = TODO_ALL.map(function (x) { return x[0]; });
    var saved = store.sections || [];
    var out = saved.filter(function (x) { return def.indexOf(x) > -1; });
    def.forEach(function (x) { if (out.indexOf(x) < 0) out.push(x); });

  function todoCard(weekItems) {

    sectionOrder().forEach(function (sec) {

      if (sec === 'week') {

      } else {
        items = todos.filter(function (t) { return t.when === sec; })
                     .sort(function (a, b) { return a.rank - b.rank; })

  /* The axis is a row of its own, so the hours are stated once for the

    var step = store.tickHours;

    return 'linear-gradient(90deg,' + stops.join(',') + ')';

    days.forEach(function (x) {

        stops.push(fn(rec, h, x.d) + ' ' + ((n / (total - 1)) * 100).toFixed(2) + '%');
        n++;

    return 'linear-gradient(90deg,' + stops.join(',') + ')';
  }

  function bgAcross(days, fn) {

    days.forEach(function (x) {

        var rec = x.d.hours[h] || x.d.hours[Object.keys(x.d.hours)[0]];

  /* A range is summarised the way a single day is: one phrase for the

    var hi = Math.max.apply(null, days.map(function (x) { return x.d.feelsMax; }));
    var dew = Math.max.apply(null, days.map(function (x) { return x.d.dewMax; }));
    var span = pair(tempWord(lo), tempWord(hi));
    var hum = dew < 15 ? 'Bone Dry' : dew < 30 ? 'Very Dry'
            : dew >= 75 ? 'Miserable Humidity' : dew >= 70 ? 'Oppressive'

  function renderMultiDay(p, lat, lon, cal, span) {

    /* Day-boundary lines are drawn inside each strip's own .face, exactly
       like the hour lines on a single day \u2014 the only way to have them

    function dayLines(face) {

    /* Tapping a strip shows, for every day in view, the exact sentence

    function strip(bg, label, tipFor) {
      var el = document.createElement('button');

      chev.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true">'

        + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';

      var body = document.createElement('div'); body.className = 'mdexpand'; body.style.display = 'none';

    function pillRow(label, colorFor, textFor, tipFor, subFor) {
      var wrap = document.createElement('div'); wrap.className = 'mdpillrow';
      var lb = document.createElement('div'); lb.className = 'mdrowlabel'; lb.textContent = label;

            rangeFeels(days), function (d) { return feelsCard(d).tip; });
      strip(bgAcross(days, function (r) {
              var base = skyColor(r).match(/\d+/g).map(Number);

            }), rangeSky(days), function (d) { return skyCard(d).tip; });
      // No separate Daylight strip: the day-header row above is already

      strip(bgAcross(days, function (r, h, d) {
              var t = (lat == null) ? { up: [] } : moonTimes(d.date, state.tz, lat, lon);
              var lit = Math.round(((1 - Math.cos(2 * Math.PI * (moonAge(d.date) / LUNATION))) / 2) * 100);
              var isUp = t.up.length ? t.up[h] : false;
              return css(isUp ? blend(NIGHT, [248, 249, 251], 0.25 + 0.7 * (lit / 100)) : NIGHT);
            }), rangeMoon(days, state.tz, lat, lon), function (d) { return moonCard(d.date, state.tz, lat, lon).tip; });
    } else {

        function (d) {

        });

        // Full statement, not truncated at the first comma \u2014 that was
        // cutting the precipitation half off entirely.
        function (d) { return skyCard(d).bold; },
        function (d) { return skyCard(d).tip; });
      pillRow('Moon',
        function (d) {
          var lit2 = (1 - Math.cos(2 * Math.PI * (moonAge(d.date) / LUNATION))) / 2;
          return css(blend(NIGHT, [248, 249, 251], 0.15 + 0.65 * lit2));
        },
        function (d) {

    roundEnds(col);
