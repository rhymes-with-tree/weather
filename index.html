<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Morning Brief</title>
<meta name="description" content="A weather brief for the things weather actually does to you — sunburn, pollen, joints, migraines, bugs, mud, and whether the water is safe.">
<meta property="og:title" content="Morning Brief">
<meta property="og:description" content="A weather brief for the things weather actually does to you.">
<meta property="og:type" content="website">
<link rel="icon" href="data:,">
<style>
  :root{ --page:#FFF; --ink:#16232F; --mid:#5B6B7A; --line:#E4E4E4; --link:#1B57C8;
         --rowh:78px; --gap:8px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       line-height:1.3;-webkit-font-smoothing:antialiased;padding:14px 12px 26px;}
  .wrap{max-width:440px;margin:0 auto;}

  .hdr{background:#FFF;border:1px solid var(--line);border-radius:18px;
       padding:14px 18px 16px;text-align:center;margin:0 0 9px;}
  .hdr.section{margin-top:22px;}
  .hdr .l1{font-size:19px;color:var(--mid);margin-bottom:5px;}
  .hdr .l2{font-size:24px;font-weight:700;letter-spacing:-.015em;}
  select{font:inherit;color:inherit;background:transparent;border:none;
         border-bottom:1.5px dashed #B9C4CC;padding:0 2px 3px;cursor:pointer;
         -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;max-width:100%;}
  .hdr .l2 select{font-weight:700;}
  select:focus-visible{outline:2px solid var(--link);outline-offset:3px;}

  .face{position:relative;}
  /* Sunrise to the left, sunset to the right, so the card reads the way
     the day runs. Wraps to two lines rather than crushing on a narrow
     phone. */
  .face.split{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .face.split .end{display:flex;flex-direction:column;line-height:1.2;}
  .face.split .end.right{text-align:right;}
  .face.split .end b{display:block;}
  .now{position:absolute;top:-13px;bottom:-13px;width:2px;margin-left:-1px;
       background:rgba(22,35,47,.30);box-shadow:0 0 0 1px rgba(255,255,255,.45);
       pointer-events:none;border-radius:1px;}
  .card{border-radius:15px;padding:13px 18px;margin:0 0 8px;width:100%;overflow:hidden;
        border:none;font:inherit;color:var(--ink);text-align:center;
        font-size:17.5px;display:block;cursor:pointer;}
  .card.flat{cursor:default;}
  /* Compact tier. A card whose gradient runs midnight to midnight
     needs the width to be read across; a card that is one word does
     not, so it gets less height and a slightly smaller face. */
  /* Daily facts become a two-up grid of squares. Nothing to read
     across their width, so they trade length for a bigger field of
     colour. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:17px;}
  .card.sm{min-height:var(--rowh);display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;
           padding:10px 12px;font-size:14.5px;border-radius:14px;margin:0;width:auto;
           line-height:1.25;}
  /* Tapped open, a tile takes the full row so the detail has somewhere
     to go instead of straining the square. */
  .card.sm.open{min-height:0;grid-column:span 2;justify-content:flex-start;
                align-items:stretch;text-align:left;padding:13px 16px;}
  .card.sm .tip{text-align:left;}
  .card.sm.skel{height:auto;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .card b{font-weight:700;}
  .det{font-weight:400;opacity:.72;}
  .alert{background:#FBE9E9;border:1px solid #F1D2D2;}
  .note{background:#F4EEDF;border:1px solid #E4D8BE;}
  .ahead{background:#EAF0F7;border:1px solid #CFDCEA;}
  .plain{background:#F2F0EB;}
  .tip{font-size:14.5px;line-height:1.45;text-align:left;margin:11px 0 0;padding-top:10px;
       border-top:1px solid rgba(22,35,47,.16);opacity:.82;}
  .linkcard{background:#F2F0EB;border-radius:15px;padding:14px;text-align:center;margin:0 0 8px;}
  .linkcard a{color:var(--link);font-weight:700;font-size:17px;text-decoration:underline;}
  .skel{background:#F1EFEA;height:48px;}
  .card.sm.skel{height:38px;}
  .busy{opacity:.45;}
  .foot{font-size:11.5px;color:#8A97A3;line-height:1.5;margin:14px 4px 0;}
  /* Phone stays as it was: one column, tiles two across. From tablet
     width up, the hourly cards become a column of their own beside a
     three-across tile grid \u2014 the tiles carry one fact each, so they
     lose nothing by being narrower, while the hourly cards keep the
     width their gradients need. */
  @media (min-width:760px){
    .wrap{max-width:1080px;}
    #homeBody, #shoreBody{display:grid;grid-template-columns:minmax(300px,0.95fr) 1.25fr;
                          gap:12px;align-items:stretch;}
    #homeBody > .alert, #homeBody > .note{grid-column:1 / -1;}
    /* Both sides share one row height, so a card on the left lines up
       with a tile on the right instead of each being sized by its own
       rule. */
    .hourly{display:flex;flex-direction:column;gap:var(--gap);}
    .hourly > .card{margin-bottom:0;flex:0 0 auto;min-height:var(--rowh);
                    display:flex;flex-direction:column;justify-content:center;}
    .card.sm{aspect-ratio:auto;min-height:var(--rowh);font-size:15px;}
    .grid{grid-template-columns:repeat(3,1fr);margin-top:0;}
    .card.sm.open{grid-column:span 3;min-height:0;}
  }
  @media (min-width:1180px){
    .wrap{max-width:1240px;}
    .grid{grid-template-columns:repeat(4,1fr);}
    .card.sm.open{grid-column:span 4;min-height:0;}
  }
  @media (max-width:370px){ .card{font-size:16px;padding:12px 14px;} .hdr .l2{font-size:21px;}
    .card.sm{font-size:13px;padding:9px 10px;} }

  /* ---- public build additions ---- */
  .bar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 10px;}
  .bar button{background:none;border:none;font:inherit;font-size:14px;color:var(--mid);
              cursor:pointer;padding:4px 8px;border-bottom:1px dashed #C3CCD4;}
  .bar button:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .panel{background:#F7F5F1;border:1px solid var(--line);border-radius:18px;
         padding:16px 18px;margin:0 0 12px;}
  .panel h2{font-size:17px;margin:0 0 4px;}
  .panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);
            margin:16px 0 6px;font-weight:600;}
  .panel p.lede{font-size:13.5px;color:var(--mid);margin:0 0 6px;line-height:1.45;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:15px;
       border-top:1px solid #E8E4DC;cursor:pointer;}
  .opt:first-of-type{border-top:none;}
  .opt input{margin:3px 0 0;width:17px;height:17px;flex:0 0 auto;}
  .opt span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .panel input[type=text]{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);
                          border-radius:8px;background:#FFF;color:inherit;margin-top:4px;}
  .tabs{display:flex;gap:5px;margin:0 0 14px;border-bottom:1px solid var(--line);padding-bottom:9px;}
  .tab{background:none;border:1px solid transparent;border-radius:9px;padding:6px 12px;
       font:inherit;font-size:14px;color:var(--mid);cursor:pointer;}
  .tab:hover{background:#EFECE5;}
  .tab.sel{background:#FFF;border-color:var(--line);color:var(--ink);font-weight:600;}
  .steps{margin:4px 0 12px;padding-left:22px;font-size:13.5px;color:var(--mid);line-height:1.5;}
  .steps li{margin-bottom:6px;}
  .ord input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;margin:0;}
  .ord span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px;}
  .preset{background:#FFF;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
          font:inherit;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .preset.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .preset .sw{display:flex;gap:2px;}
  .preset .sw i{width:11px;height:11px;border-radius:3px;display:block;}
  .contrast{margin-top:8px;padding-left:9px;border-left:2px solid #C9BFA9;}
  .contrast.ok{border-left-color:#7FA86B;}
  .contrast.bad{border-left-color:#C4703F;}
  .reset{margin-top:10px;background:#FFF;border:1px solid var(--line);border-radius:9px;
         padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;}
  .ord{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px;
       border-top:1px solid #E8E4DC;}
  .ord span{flex:1 1 auto;}
  .ord button{background:#FFF;border:1px solid var(--line);border-radius:7px;width:30px;height:28px;
              font:inherit;font-size:15px;line-height:1;cursor:pointer;color:var(--ink);}
  .ord button:disabled{opacity:.32;cursor:default;}
  .disc{font-size:12px;color:#7C8996;line-height:1.55;margin:16px 4px 0;
        border-top:1px solid var(--line);padding-top:12px;}
  .disc b{color:var(--mid);}

</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="l1"><select id="daySel" aria-label="Day"></select></div>
    <div class="l2"><select id="placeSel" aria-label="Location"></select></div>
    <div id="searchBox" style="display:none;margin-top:10px">
      <input id="q" type="search" placeholder="Search any US town" autocomplete="off"
             style="font:inherit;width:100%;text-align:center;border:none;border-bottom:1.5px dashed #B9C4CC;padding:4px;background:transparent;color:inherit">
      <ul id="results" style="list-style:none;margin:8px 0 0;padding:0;font-size:16px"></ul>
    </div>
  </div>

  <div class="bar">
    <button id="settingsBtn" aria-expanded="false">Settings</button>
    <button id="aboutBtn" aria-expanded="false">About</button>
  </div>

  <div id="settingsPanel" class="panel" style="display:none"></div>
  <div id="aboutPanel" class="panel" style="display:none"></div>

  <div id="homeBody"></div>

  <div id="shoreSection">
    <div class="hdr section">
      <div class="l1">Water</div>
      <div class="l2"><select id="beachSel" aria-label="Shore"></select></div>
      <div id="shoreBox" style="display:none;margin-top:10px">
        <input id="shoreQ" type="search" placeholder="Search any coast or lake town"
               style="font:inherit;width:100%;text-align:center;border:none;border-bottom:1.5px dashed #B9C4CC;padding:4px;background:transparent;color:inherit">
        <ul id="shoreResults" style="list-style:none;margin:8px 0 0;padding:0;font-size:16px"></ul>
      </div>
    </div>
    <div id="shoreBody"></div>
  </div>

  <p class="disc" id="disclaimer"></p>
</div>

<script>
(function () {
  'use strict';
  var DEG = '\u00B0', DASH = '\u2013', MID = '\u00B7';

  /* ================= storage =================
     Everything lives in this browser. No account, no server, and
     nothing about anyone's location or health leaves the device
     except as coordinates in a weather request. */
  var KEY = 'morningbrief.v1';
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  var store = loadStore();
  if (!store.cards) store.cards = {};          // absent means on
  if (!store.recents) store.recents = [];
  if (!store.shores) store.shores = [];
  if (!store.keys) store.keys = {};

  /* Which cards exist, what each assumes about you, and which section
     of the settings panel it sits in. Everything defaults to on. */
  var CARDS = [
    { id: 'feels',     name: 'Feels Like',        group: 'Weather',  always: true },
    { id: 'sweat',     name: 'Humidity',          group: 'Weather' },
    { id: 'sky',       name: 'Sun and cloud',     group: 'Weather' },
    { id: 'rain',      name: 'Precipitation',     group: 'Weather' },
    { id: 'daylight',  name: 'Sunrise and sunset',group: 'Weather' },
    { id: 'wind',      name: 'Wind',              group: 'Weather', note: 'Kite and sailing notes in the tap' },
    { id: 'burn',      name: 'Sunburn',           group: 'Body' },
    { id: 'frostbite', name: 'Frostbite',         group: 'Body', note: 'Only below freezing' },
    { id: 'air',       name: 'Air quality',       group: 'Body' },
    { id: 'asthma',    name: 'Asthma advice',     group: 'Body', note: 'Adds inhaler guidance to the air quality tap' },
    { id: 'allergy',   name: 'Allergens',         group: 'Body' },
    { id: 'migraine',  name: 'Migraine',          group: 'Body', note: 'Barometric pressure and temperature swings' },
    { id: 'arthritis', name: 'Arthritis',         group: 'Body', note: 'Weather links here are widely reported and weakly evidenced' },
    { id: 'frizz',     name: 'Hair frizz',        group: 'Body' },
    { id: 'bug',       name: 'Bug spray',         group: 'Outdoors' },
    { id: 'shoe',      name: 'Which shoes',       group: 'Outdoors' },
    { id: 'fire',      name: 'Fire weather',      group: 'Outdoors', note: 'Only when conditions approach a Red Flag' },
    { id: 'light',     name: 'Daylight exposure', group: 'Outdoors' },
    { id: 'aurora',    name: 'Aurora',            group: 'Outdoors', note: 'Only during a geomagnetic storm' },
    { id: 'moon',      name: 'Moon phase',        group: 'Outdoors' },
    { id: 'pavement',  name: 'Pavement and paws', group: 'If you have', note: 'A dog' },
    { id: 'frost',     name: 'Windshield frost',  group: 'If you have', note: 'A car' },
    { id: 'rust',      name: 'Road salt and rust',group: 'If you have', note: 'A car' },
    { id: 'pipe',      name: 'Pipe freeze',       group: 'If you have', note: 'A house with exposed plumbing' },
    { id: 'mold',      name: 'Basement damp',     group: 'If you have', note: 'A basement or crawl space' },
    { id: 'mow',       name: 'Mowing',            group: 'If you have', note: 'A lawn you cut yourself' },
    { id: 'shore',     name: 'Water section',     group: 'If you have', note: 'A coast or lake worth checking' }
  ];
  function on(id) { return store.cards[id] !== false; }

  var state = { place: store.place || null, tz: 'America/Detroit', dayOffset: 0,
                home: null, shore: null, shoreSel: store.shore || null,
                recents: store.recents, shoreRecents: store.shores, kp: null };

  /* ================= colour ==================================
     Pale enough for dark text on top. Three fill modes, because
     the ramps do not all mean the same thing:

       range  low colour to high colour        (Feels Like)
       from   the calm end up to the value     (scales where the
              minimum is the good end: rain, sunburn, AQI, risk)
       at     a narrow band around the value   (scales where the
              minimum is ALSO bad: sweat, water temperature, sky)

     Using "from" on a double-ended scale was a real bug: a
     comfortable dew point rendered as purple-to-yellow, implying
     danger that was not there.
     ========================================================== */
  /* ---- theme ----
     Eight ramps, but only four semantic anchors underneath: cold/dry,
     good, warm, danger. Fixing the structure and varying only the
     anchors keeps the colour grammar coherent no matter what someone
     picks \u2014 blue still means cold, green still means fine.
     Page chrome is deliberately NOT themed, so a catastrophic palette
     still leaves Settings and Reset readable. */
  var PRESETS = {
    default: { name: 'Original', cold: '#9FC4E4', good: '#D8DE96', warm: '#E9C68C', danger: '#C48CB0' },
    contrast: { name: 'Higher contrast', cold: '#7FB4E0', good: '#B9DC74', warm: '#F0AE58', danger: '#DE8095' },
    cbsafe: { name: 'Colourblind-safe', cold: '#7FB0DE', good: '#BFD9EA', warm: '#F0C97A', danger: '#C9793B' },
    muted: { name: 'Muted', cold: '#B6C6D2', good: '#CBD3B8', warm: '#DFC7A8', danger: '#C3A3AE' }
  };
  function anchors() {
    var t = store.theme || {};
    var base = PRESETS[t.preset || 'default'] || PRESETS.default;
    return { cold: t.cold || base.cold, good: t.good || base.good,
             warm: t.warm || base.warm, danger: t.danger || base.danger };
  }
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(c) {
    return '#' + c.map(function (x) {
      var v = Math.max(0, Math.min(255, Math.round(x))).toString(16);
      return v.length < 2 ? '0' + v : v;
    }).join('');
  }
  function blend(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  function lighten(c, t) { return blend(c, [255, 255, 255], t); }

  var RAMP = {};
  var NIGHT, TWILIGHT, DAYLIT;
  function buildRamps() {
    var A = anchors();
    var COLD = hex2rgb(A.cold), GOOD = hex2rgb(A.good),
        WARM = hex2rgb(A.warm), DANGER = hex2rgb(A.danger);
    var MIDCOOL = blend(COLD, GOOD, 0.5);
    RAMP = {
      // cold at the bottom, danger at both practical extremes of heat
      feels: [[0,COLD],[25,blend(COLD,MIDCOOL,.6)],[38,MIDCOOL],[50,blend(MIDCOOL,GOOD,.7)],
              [60,GOOD],[70,GOOD],[78,blend(GOOD,WARM,.6)],[86,WARM],
              [94,blend(WARM,DANGER,.6)],[105,DANGER]],
      // double-ended: bone dry is its own hazard
      sweat: [[0,DANGER],[15,blend(DANGER,COLD,.7)],[30,COLD],[45,blend(COLD,GOOD,.7)],
              [55,GOOD],[62,GOOD],[68,blend(GOOD,WARM,.7)],[74,WARM],[80,DANGER]],
      aqi:   [[0,GOOD],[50,blend(GOOD,WARM,.35)],[100,blend(GOOD,WARM,.7)],[150,WARM],
              [200,blend(WARM,DANGER,.7)],[300,DANGER]],
      risk:  [[0,GOOD],[30,blend(GOOD,WARM,.4)],[55,WARM],[80,blend(WARM,DANGER,.75)],[100,DANGER]],
      burn:  [[0,lighten(GOOD,.25)],[3,blend(GOOD,WARM,.5)],[6,WARM],
              [9,blend(WARM,DANGER,.6)],[12,DANGER]],
      // dry is the good end; wet deepens to cold, never to danger
      rain:  [[0,GOOD],[30,blend(GOOD,MIDCOOL,.6)],[60,MIDCOOL],[100,COLD]],
      water: [[32,COLD],[55,blend(COLD,MIDCOOL,.7)],[68,MIDCOOL],[76,blend(MIDCOOL,GOOD,.8)],[85,GOOD]],
      // saturated good-end hue drains to grey, then white for snow
      sky:   [[0,GOOD],[35,lighten(GOOD,.45)],[60,[207,211,214]],[75,[221,224,227]],
              [88,[234,237,239]],[100,[244,246,247]]]
    };
    SUN = GOOD; GREY = [196,200,204]; STORM = [163,169,176];
    SNOW = [246,248,249]; DUSK = blend(COLD, [150,158,170], .5);
    // Daylight card: deep at the edges, warm through each transition,
    // bright through the middle. Built from the same anchors, so it
    // stops being the one card that ignores the theme.
    var t = store.theme || {};
    NIGHT    = t.night ? hex2rgb(t.night) : blend(COLD, [104,116,136], .55);
    TWILIGHT = t.dawn  ? hex2rgb(t.dawn)  : blend(WARM, [255,226,190], .35);
    DAYLIT   = t.day   ? hex2rgb(t.day)   : lighten(GOOD, .42);
  }

  function colorAt(ramp, v) {
    var r = RAMP[ramp];
    if (v <= r[0][0]) return css(r[0][1]);
    for (var i = 1; i < r.length; i++) {
      if (v <= r[i][0]) {
        var a = r[i - 1], b = r[i], t = (v - a[0]) / (b[0] - a[0]);
        return css([a[1][0] + (b[1][0] - a[1][0]) * t,
                    a[1][1] + (b[1][1] - a[1][1]) * t,
                    a[1][2] + (b[1][2] - a[1][2]) * t]);
      }
    }
    return css(r[r.length - 1][1]);
  }
  function css(c) { return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')'; }
  function grad(a, b) { return 'linear-gradient(100deg,' + a + ',' + b + ')'; }
  function bgRange(r, lo, hi) { return grad(colorAt(r, lo), colorAt(r, hi)); }
  function bgFrom(r, v)       { return grad(colorAt(r, RAMP[r][0][0]), colorAt(r, v)); }
  function bgAt(r, v, sp)     { return grad(colorAt(r, v - sp), colorAt(r, v + sp)); }

  /* Midnight to midnight, sampled every hour. The middle of the card
     is the middle of the day, so the shape of the day is the picture:
     cool edges and a warm centre, or grey morning clearing to sun. */
  function bgDay(d, fn) {
    var stops = [];
    for (var h = 0; h < 24; h++) {
      var rec = d.hours[h] || d.hours[Object.keys(d.hours)[0]];
      stops.push(fn(rec, h) + ' ' + ((h / 23) * 100).toFixed(1) + '%');
    }
    return 'linear-gradient(90deg,' + stops.join(',') + ')';
  }

  /* Sky is not one axis. Three corners, blended by weight:
       sun   saturated yellow   the share of the hour that is clear
       grey  overcast or rain   cloud that is not frozen
       white snow               cloud that is frozen
     Rain needs no corner of its own: a rainy day is a grey day, and
     the wetness is already the Precipitation card. Snow earns one
     because it changes the quality of the light, not just wetness.
     Night hours fade toward dusk slate, because a clear midnight is
     not a sunny midnight. */
  var SUN, GREY, STORM, SNOW, DUSK;
  function mix3(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  var SNOW_CODES = [71,73,75,77,85,86], STORM_CODES = [95,96,99];
  function skyColor(rec) {
    var cloud = (rec.cloud == null ? 50 : rec.cloud) / 100;
    var frozen = SNOW_CODES.indexOf(rec.code) > -1;
    var stormy = STORM_CODES.indexOf(rec.code) > -1;
    var greyHue = stormy ? STORM : GREY;
    var white = cloud * (frozen ? 1 : 0);
    var grey  = cloud * (frozen ? 0 : 1);
