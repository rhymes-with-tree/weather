<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Morning Brief</title>
<meta name="description" content="A weather brief for the things weather actually does to you — sunburn, pollen, joints, migraines, bugs, mud, and whether the water is safe.">
<meta property="og:title" content="Morning Brief">
<meta property="og:description" content="A weather brief for the things weather actually does to you.">
<meta property="og:type" content="website">
<link rel="icon" href="data:,">
<style>
  :root{ --page:#FFF; --ink:#16232F; --mid:#5B6B7A; --line:#E4E4E4; --link:#1B57C8;
         --rowh:62px; --gap:7px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       line-height:1.3;-webkit-font-smoothing:antialiased;padding:10px 11px 22px;}
  .wrap{max-width:440px;margin:0 auto;}

  .hdr{background:#FFF;border:1px solid var(--line);border-radius:16px;
       padding:11px 16px 12px;text-align:center;margin:0 0 8px;}
  .hdr.section{margin-top:22px;}
  .hdr .l1{font-size:19px;color:var(--mid);margin-bottom:5px;}
  .hdr .l2{font-size:24px;font-weight:700;letter-spacing:-.015em;}
  select{font:inherit;color:inherit;background:transparent;border:none;
         border-bottom:1.5px dashed #B9C4CC;padding:0 2px 3px;cursor:pointer;
         -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;max-width:100%;}
  .hdr .l2 select{font-weight:700;}
  select:focus-visible{outline:2px solid var(--link);outline-offset:3px;}

  .face{position:relative;}
  /* A tappable card says so: a small chevron that rotates when open.
     Only appears on cards that actually have something behind them, so
     it never promises a tap that does nothing. */
  .more{position:absolute;right:0;top:50%;transform:translateY(-50%);
        width:15px;height:15px;opacity:.42;pointer-events:none;}
  .more svg{display:block;width:100%;height:100%;}
  .card.open .more{transform:translateY(-50%) rotate(180deg);opacity:.55;}
  .card.sm .more{right:-4px;}
  .card.open .more{top:11px;transform:rotate(180deg);}
  /* Sunrise to the left, sunset to the right, so the card reads the way
     the day runs. Wraps to two lines rather than crushing on a narrow
     phone. */
  .face.split{display:flex;align-items:center;gap:10px;}
  .face.split .end{display:flex;flex-direction:column;line-height:1.2;flex:0 0 auto;}
  .face.split .end.mid{flex:1 1 auto;text-align:center;font-weight:600;opacity:.78;}
  .face.split .end.right{text-align:right;margin-left:0;}
  .face.split .end b{display:block;}
  .caption{font-size:13.5px;opacity:.72;text-align:center;margin-top:5px;}
  .now{position:absolute;top:-13px;bottom:-13px;width:2px;margin-left:-1px;
       background:rgba(22,35,47,.30);box-shadow:0 0 0 1px rgba(255,255,255,.45);
       pointer-events:none;border-radius:1px;}
  .card{border-radius:14px;padding:9px 16px;margin:0 0 var(--gap);width:100%;
        min-height:var(--rowh);display:flex;flex-direction:column;justify-content:center;
        border:none;font:inherit;color:var(--ink);text-align:center;
        font-size:17.5px;display:block;cursor:pointer;}
  .card.flat, .card.todo, .card.todo *{cursor:default;}
  /* Compact tier. A card whose gradient runs midnight to midnight
     needs the width to be read across; a card that is one word does
     not, so it gets less height and a slightly smaller face. */
  /* Daily facts become a two-up grid of squares. Nothing to read
     across their width, so they trade length for a bigger field of
     colour. */
  /* Every card is one row tall, sized to hold two lines of label. Rows
     never stretch to fill leftover space \u2014 that is what made a single
     row of water tiles swell to the height of the whole column. Only a
     card opened by tapping is allowed to grow. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:17px;
        grid-auto-rows:minmax(var(--rowh),auto);align-content:start;}
  .card.sm{min-height:var(--rowh);display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;
           padding:8px 11px;font-size:14px;border-radius:12px;margin:0;width:auto;
           line-height:1.22;}
  /* Tapped open, a tile takes the full row so the detail has somewhere
     to go instead of straining the square. */
  .card.open{min-height:0;height:auto;justify-content:flex-start;align-items:stretch;
             text-align:left;padding:13px 16px;}
  .card.sm.open{grid-column:span 2;}
  .card.sm .tip{text-align:left;}
  .card.sm.skel{height:auto;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .card b{font-weight:700;}
  .det{font-weight:400;opacity:.72;}
  .alert{background:#FBE9E9;border:1px solid #F1D2D2;}
  .plain{background:#F2F0EB;}
  .tip{font-size:14.5px;line-height:1.45;text-align:left;margin:11px 0 0;padding-top:10px;
       border-top:1px solid rgba(22,35,47,.16);opacity:.82;}
  .linkcard{background:#F2F0EB;border-radius:15px;padding:14px;text-align:center;margin:0 0 8px;}
  .linkcard a{color:var(--link);font-weight:700;font-size:17px;text-decoration:underline;}
  .skel{background:#F1EFEA;height:48px;}
  .card.sm.skel{height:38px;}
  .busy{opacity:.45;}
  .foot{font-size:11.5px;color:#8A97A3;line-height:1.5;margin:14px 4px 0;}
  /* Phone stays as it was: one column, tiles two across. From tablet
     width up, the hourly cards become a column of their own beside a
     three-across tile grid \u2014 the tiles carry one fact each, so they
     lose nothing by being narrower, while the hourly cards keep the
     width their gradients need. */
  @media (min-width:760px){
    .wrap{max-width:1080px;}
    :root{--rowh:74px;--gap:8px;}
    .card{padding:12px 18px;}
    .card.sm{padding:10px 12px;font-size:15px;}
    /* Left column is the day: four full-width cards, then the tiles
       under them. Right column is the to-do list, which is the longest
       single element and now has somewhere to be. Anything that
       announces itself spans both. */
    /* The to-do list is the right column no matter where it sits in the
       running order; cards and tiles stack on the left in whatever
       order you chose. Nothing spans both any more, which is what used
       to wedge a full-width block between the columns. */
    #homeBody{display:grid;grid-template-columns:1.15fr 0.85fr;
              gap:14px;align-items:start;}
    #homeBody > .todoblock{margin:0;}

    /* Both sides share one row height, so a card on the left lines up
       with a tile on the right instead of each being sized by its own
       rule. */
    .hourly{display:flex;flex-direction:column;gap:var(--gap);}
    .hourly > .card{margin-bottom:0;flex:0 0 auto;min-height:var(--rowh);
                    display:flex;flex-direction:column;justify-content:center;}
    .hourly > .card:not(.open){height:var(--rowh);}
    .hourly > .card.open{height:auto;}
    .card.sm{aspect-ratio:auto;min-height:var(--rowh);font-size:15px;}
    .grid{grid-template-columns:repeat(3,1fr);margin-top:0;}
    .card.sm.open{grid-column:span 3;min-height:0;}
  }
  @media (min-width:1180px){
    .wrap{max-width:1180px;}
  }
  @media (max-width:370px){ .card{font-size:16px;padding:12px 14px;} .hdr .l2{font-size:21px;}
    .card.sm{font-size:13px;padding:9px 10px;} }

  /* ---- public build additions ---- */
  .bar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 10px;}
  .bar button{background:none;border:none;font:inherit;font-size:14px;color:var(--mid);
              cursor:pointer;padding:4px 8px;border-bottom:1px dashed #C3CCD4;}
  .bar button:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .panel{background:#F7F5F1;border:1px solid var(--line);border-radius:18px;
         padding:16px 18px;margin:0 0 12px;}
  .panel h2{font-size:17px;margin:0 0 4px;}
  .panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);
            margin:16px 0 6px;font-weight:600;}
  .panel p.lede{font-size:13.5px;color:var(--mid);margin:0 0 6px;line-height:1.45;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:15px;
       border-top:1px solid #E8E4DC;cursor:pointer;}
  .opt:first-of-type{border-top:none;}
  .opt input{margin:3px 0 0;width:17px;height:17px;flex:0 0 auto;}
  .opt.sub{padding-left:26px;border-top:1px solid #EFECE4;}
  .opt.sub span{font-size:14.5px;}
  .ord + .opt.sub{border-top:1px solid #EFECE4;}
  .opt span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .panel input[type=text]{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);
                          border-radius:8px;background:#FFF;color:inherit;margin-top:4px;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px;
        border-bottom:1px solid var(--line);padding-bottom:9px;}
  .tab{background:none;border:1px solid transparent;border-radius:9px;padding:5px 10px;
       font:inherit;font-size:13.5px;color:var(--mid);cursor:pointer;white-space:nowrap;}
  .tab:hover{background:#EFECE5;}
  .tab.sel{background:#FFF;border-color:var(--line);color:var(--ink);font-weight:600;}
  .steps{margin:4px 0 12px;padding-left:22px;font-size:13.5px;color:var(--mid);line-height:1.5;}
  .steps li{margin-bottom:6px;}
  .ord input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;margin:0;}
  .ord span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px;}
  .preset{background:#FFF;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
          font:inherit;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .preset.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .preset .sw{display:flex;gap:2px;}
  .preset .sw i{width:11px;height:11px;border-radius:3px;display:block;}
  .contrast{margin-top:8px;padding-left:9px;border-left:2px solid #C9BFA9;}
  .contrast.ok{border-left-color:#7FA86B;}
  .contrast.bad{border-left-color:#C4703F;}
  .reset{margin-top:10px;background:#FFF;border:1px solid var(--line);border-radius:9px;
         padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;}
  .ord{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px;
       border-top:1px solid #E8E4DC;}
  .ord span{flex:1 1 auto;}
  .ord button{background:#FFF;border:1px solid var(--line);border-radius:7px;width:30px;height:28px;
              font:inherit;font-size:15px;line-height:1;cursor:pointer;color:var(--ink);}
  .ord button:disabled{opacity:.32;cursor:default;}
  .card.todo{background:#F3F0E8;border:1px solid var(--line);display:block;
             padding:12px 15px 13px;min-height:0;margin-bottom:10px;}
  .todohead{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
            color:var(--ink);opacity:.62;font-weight:700;margin-bottom:7px;}
  .card.todo ul + .todohead{margin-top:14px;padding-top:12px;
                            border-top:1px solid rgba(22,35,47,.13);}
  .card.todo li.week{background:#EDF1F6;border-color:#D3DEEA;}
  .ord.sub{padding-left:18px;}
  .ord.sub span{opacity:.8;}
  .card.todo ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px 9px;}
  .card.todo li{font-size:14.5px;font-weight:600;background:#FFF;border:1px solid var(--line);
                border-radius:999px;padding:4px 11px;}
  .card.todo .tip{text-align:left;}
  .tiphint{font-size:13px;color:var(--mid);text-align:center;margin:0 0 10px;}
  .disc{font-size:12px;color:#7C8996;line-height:1.55;margin:16px 4px 0;
        border-top:1px solid var(--line);padding-top:12px;}
  .disc b{color:var(--mid);}

</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="l1"><select id="daySel" aria-label="Day"></select></div>
    <div class="l2"><select id="placeSel" aria-label="Location"></select></div>
    <div id="searchBox" style="display:none;margin-top:10px">
      <input id="q" type="search" placeholder="Search any US town" autocomplete="off"
             style="font:inherit;width:100%;text-align:center;border:none;border-bottom:1.5px dashed #B9C4CC;padding:4px;background:transparent;color:inherit">
      <ul id="results" style="list-style:none;margin:8px 0 0;padding:0;font-size:16px"></ul>
    </div>
  </div>

  <div class="bar">
    <button id="settingsBtn" aria-expanded="false">Settings</button>
    <button id="aboutBtn" aria-expanded="false">About</button>
  </div>

  <div id="settingsPanel" class="panel" style="display:none"></div>
  <div id="aboutPanel" class="panel" style="display:none"></div>

  <p class="tiphint" id="tipHint">Tap any card for the numbers behind it.</p>
  <div id="alertBody"></div>
  <div id="homeBody"></div>

  <p class="disc" id="disclaimer"></p>
</div>

<script>
(function () {
  'use strict';
  var DEG = '\u00B0', DASH = '\u2013', MID = '\u00B7';

  /* ================= storage =================
     Everything lives in this browser. No account, no server, and
     nothing about anyone's location or health leaves the device
     except as coordinates in a weather request. */
  var KEY = 'morningbrief.v1';
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  var store = loadStore();
  if (!store.cards) store.cards = {};          // absent means on
  if (!store.recents) store.recents = [];
  if (!store.keys) store.keys = {};

  /* Which cards exist, what each assumes about you, and which section
     of the settings panel it sits in. Everything defaults to on. */
  var CARDS = [
    // across the day
    { id: 'feels',     name: 'Feels Like',        note: 'Temperature and humidity together', always: true },
    { id: 'sky',       name: 'Sky',               note: 'Cloud and what is falling' },
    { id: 'daylight',  name: 'Sunrise and sunset' },
    { id: 'moon',      name: 'Moon phase' },
    // tiles
    { id: 'air',       name: 'Air quality' },
    { id: 'allergy',   name: 'Allergens' },
    { id: 'virus',     name: 'Viruses about',     note: 'COVID, flu and RSV in your state\u2019s wastewater' },
    { id: 'burn',      name: 'Sunburn' },
    { id: 'water',     name: 'Water temperature', note: 'Shows when a gauge or buoy is near' },
    { id: 'pavement',  name: 'Pavement and paws', note: 'A dog' },
    { id: 'wind',      name: 'Wind',              note: 'Kite and sailing notes in the tap' },
    { id: 'aurora',    name: 'Aurora',            note: 'Only during a geomagnetic storm' },
    // to-do list only
    { id: 'arthritis', name: 'Arthritis',         note: 'Some people\u2019s arthritis flares with the weather' },
    { id: 'mold',      name: 'Basement',          note: 'If you have one, should you air it out?' },
    { id: 'bug',       name: 'Bug Spray' },
    { id: 'light',     name: 'Daylight Exposure', note: 'When to get some morning light' },
    { id: 'fire',      name: 'Fire Weather',      note: 'Conditions are approaching Red Flag' },
    { id: 'frostbite', name: 'Frostbite' },
    { id: 'frizz',     name: 'Hair Frizz' },
    { id: 'migraine',  name: 'Migraine' },
    { id: 'mow',       name: 'Mow the Lawn',      note: 'Will the rain and mud cooperate?' },
    { id: 'pipe',      name: 'Pipes Freeze',      note: 'Houses with exposed plumbing' },
    { id: 'rust',      name: 'Road Salt/Rust',    note: 'When to wash your car to avoid rust' },
    { id: 'shoe',      name: 'Shoes',             note: 'The best way to step outside' },
    { id: 'frost',     name: 'Windshield Frost',  note: 'How long will you need to scrape the windshield?' },
    { id: 'todo',      name: 'To-do list' }
  ];
  function cardMeta(id) {
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return CARDS[i];
    return { id: id, name: id };
  }

  function on(id) { return store.cards[id] !== false; }

  /* Fitzpatrick scale. It classifies how skin RESPONDS to sun rather
     than what colour it is, which is why each option is written as a
     burn-and-tan behaviour. MED is the minimal erythemal dose in J/m2
     \u2014 the exposure that produces a just-visible burn. Time to burn is
     MED divided by erythemal irradiance, and a UV index of 1 is
     25 mW/m2, so minutes = MED / (UV * 1.5). */
  var SKIN = [
    { id: 1, med: 150,  tone: '#F7DFD0', label: 'Always burns, never tans' },
    { id: 2, med: 250,  tone: '#F0C9A8', label: 'Usually burns, tans a little' },
    { id: 3, med: 350,  tone: '#DDA97C', label: 'Sometimes burns, tans gradually' },
    { id: 4, med: 450,  tone: '#B97C4F', label: 'Rarely burns, tans easily' },
    { id: 5, med: 600,  tone: '#8A5A34', label: 'Very rarely burns, tans deeply' },
    { id: 6, med: 1000, tone: '#543A22', label: 'Never burns' }
  ];
  /* The EPA index is built around two audiences: everyone, and people
     whose lungs or heart make them react sooner. Which one you are
     changes both the wording and where the thresholds bite. */
  function sensitive() { return !!store.sensitive; }

  function skin() {
    var id = store.skin || 2;
    for (var i = 0; i < SKIN.length; i++) if (SKIN[i].id === id) return SKIN[i];
    return SKIN[1];
  }

  var state = { place: store.place || null, tz: 'America/Detroit', dayOffset: 0,
                home: null, recents: store.recents, kp: null };

  /* ================= colour ==================================
     Pale enough for dark text on top. Three fill modes, because
     the ramps do not all mean the same thing:

       range  low colour to high colour        (Feels Like)
       from   the calm end up to the value     (scales where the
              minimum is the good end: rain, sunburn, AQI, risk)
       at     a narrow band around the value   (scales where the
              minimum is ALSO bad: sweat, water temperature, sky)

     Using "from" on a double-ended scale was a real bug: a
     comfortable dew point rendered as purple-to-yellow, implying
     danger that was not there.
     ========================================================== */
  /* ---- theme ----
     Eight ramps, but only four semantic anchors underneath: cold/dry,
     good, warm, danger. Fixing the structure and varying only the
     anchors keeps the colour grammar coherent no matter what someone
     picks \u2014 blue still means cold, green still means fine.
     Page chrome is deliberately NOT themed, so a catastrophic palette
     still leaves Settings and Reset readable. */
  var PRESETS = {
    default: { name: 'Original', cold: '#9FC4E4', good: '#D8DE96', warm: '#E9C68C', danger: '#C48CB0' },
    contrast: { name: 'Higher contrast', cold: '#7FB4E0', good: '#B9DC74', warm: '#F0AE58', danger: '#DE8095' },
    cbsafe: { name: 'Colourblind-safe', cold: '#7FB0DE', good: '#BFD9EA', warm: '#F0C97A', danger: '#C9793B' },
    muted: { name: 'Muted', cold: '#B6C6D2', good: '#CBD3B8', warm: '#DFC7A8', danger: '#C3A3AE' }
  };
  function anchors() {
    var t = store.theme || {};
    var base = PRESETS[t.preset || 'default'] || PRESETS.default;
    return { cold: t.cold || base.cold, good: t.good || base.good,
             warm: t.warm || base.warm, danger: t.danger || base.danger };
  }
  function hex2rgb(h) {
    h = String(h).replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(c) {
    return '#' + c.map(function (x) {
      var v = Math.max(0, Math.min(255, Math.round(x))).toString(16);
      return v.length < 2 ? '0' + v : v;
    }).join('');
  }
  function blend(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
  function lighten(c, t) { return blend(c, [255, 255, 255], t); }

  var RAMP = {};
  var NIGHT, TWILIGHT, DAYLIT;
  function buildRamps() {
    var A = anchors();
    var COLD = hex2rgb(A.cold), GOOD = hex2rgb(A.good),
        WARM = hex2rgb(A.warm), DANGER = hex2rgb(A.danger);
    var MIDCOOL = blend(COLD, GOOD, 0.5);
    RAMP = {
      // cold at the bottom, danger at both practical extremes of heat
      feels: [[0,COLD],[25,blend(COLD,MIDCOOL,.6)],[38,MIDCOOL],[50,blend(MIDCOOL,GOOD,.7)],
              [60,GOOD],[70,GOOD],[78,blend(GOOD,WARM,.6)],[86,WARM],
              [94,blend(WARM,DANGER,.6)],[105,DANGER]],
      // double-ended: bone dry is its own hazard
      sweat: [[0,DANGER],[15,blend(DANGER,COLD,.7)],[30,COLD],[45,blend(COLD,GOOD,.7)],
              [55,GOOD],[62,GOOD],[68,blend(GOOD,WARM,.7)],[74,WARM],[80,DANGER]],
      aqi:   [[0,GOOD],[50,blend(GOOD,WARM,.35)],[100,blend(GOOD,WARM,.7)],[150,WARM],
              [200,blend(WARM,DANGER,.7)],[300,DANGER]],
      risk:  [[0,GOOD],[30,blend(GOOD,WARM,.4)],[55,WARM],[80,blend(WARM,DANGER,.75)],[100,DANGER]],
      burn:  [[0,lighten(GOOD,.25)],[3,blend(GOOD,WARM,.5)],[6,WARM],
              [9,blend(WARM,DANGER,.6)],[12,DANGER]],
      // dry is the good end; wet deepens to cold, never to danger
      rain:  [[0,GOOD],[30,blend(GOOD,MIDCOOL,.6)],[60,MIDCOOL],[100,COLD]],
      water: [[32,COLD],[55,blend(COLD,MIDCOOL,.7)],[68,MIDCOOL],[76,blend(MIDCOOL,GOOD,.8)],[85,GOOD]],
      // saturated good-end hue drains to grey, then white for snow
      sky:   [[0,GOOD],[35,lighten(GOOD,.45)],[60,[207,211,214]],[75,[221,224,227]],
              [88,[234,237,239]],[100,[244,246,247]]]
    };
    SUN = GOOD; GREY = [196,200,204]; STORM = [163,169,176];
    SNOW = [246,248,249]; DUSK = blend(COLD, [150,158,170], .5);
    // Daylight card: deep at the edges, warm through each transition,

  /* A community measurement, not a personal risk score \u2014 it says how
     much virus is in the sewage for your state, which is a real number
     and one of the few things in this app that is measured rather than
     modelled. */
  function virusCard(v) {
    if (!v || !v.items || !v.items.length) return null;
    var worst = v.items[0];
    // Below moderate there is nothing to say and nothing to do, so the
    // tile stays away rather than reporting an absence.
    if (worst.rank < 50) return null;
    var cap1 = function (t) { return t.charAt(0).toUpperCase() + t.slice(1); };
    var pair2 = (v.items.length > 1 && v.items[1].rank >= 50 && v.items[1].level === worst.level)
      ? worst.virus + ' and ' + v.items[1].virus : worst.virus;
    var face = worst.rank >= 78 ? 'Lots of ' + pair2 + ' Going Around'
             : worst.rank >= 50 ? 'Some ' + pair2 + ' Going Around'
             : worst.rank >= 25 ? 'Not Much ' + pair2 + ' Going Around'
             : 'Little Going Around';

    var tip = v.items.map(function (i) { return i.virus + ' ' + i.level; }).join(', ')
            + ' in ' + v.state + ' wastewater'
            + (v.week ? ', week of ' + String(v.week).slice(0, 10) : '') + '. ';
    tip += 'Wastewater picks up infections before people test or see a doctor, including ones with no symptoms. '
         + 'It describes your state, not your street, and says nothing about your own risk. '
         + 'From CDC National Wastewater Surveillance System.';

    var todos = [];
    if (worst.rank >= 78) {
      todos.push({ text: 'Mask in crowded places', when: 'out', rank: 18 });
      todos.push({ text: 'Wash hands more than usual', when: 'day', rank: 18 });
    } else if (worst.rank >= 50) {
      todos.push({ text: 'Wash hands more than usual', when: 'day', rank: 22 });
    }

  }

  function moonCard(dateStr, tz, lat, lon) {
    var age = moonAge(dateStr);
    var f = age / LUNATION;
    var illum = Math.round(((1 - Math.cos(2 * Math.PI * f)) / 2) * 100);
    var name = age < 1.0 ? 'New Moon' : age < 6.38 ? 'Waxing Crescent' : age < 8.38 ? 'First Quarter'
             : age < 13.765 ? 'Waxing Gibbous' : age < 15.765 ? 'Full Moon' : age < 21.15 ? 'Waning Gibbous'
             : age < 23.15 ? 'Last Quarter' : age < 28.53 ? 'Waning Crescent' : 'New Moon';

    var t = (lat == null) ? { rise: null, set: null, up: [] }
                          : moonTimes(dateStr, tz || 'UTC', lat, lon);

    // The card is the night: dark where the moon is down, brightening
    // with how much of it is lit where it is up.
    var DARK = NIGHT;   // the same night the sunrise card ends on
    var lambda = illum / 100;
    var bg = 'linear-gradient(90deg,' + Array.from({ length: 24 }, function (_, h) {
      var isUp = t.up.length ? t.up[h] : false;
      var c = isUp ? blend(DARK, [248, 249, 251], 0.25 + 0.7 * lambda) : DARK;
      return css(c) + ' ' + ((h / 23) * 100).toFixed(1) + '%';
    }).join(',') + ')';

    var left, right;
    if (lat == null) {
      // No location yet, so rise and set cannot be worked out at all.
      left = [name, illum + '% lit']; right = ['', ''];
    } else {
      var riseBox = t.rise != null ? ['Moonrise', hr(t.rise)] : null;
      var setBox  = t.set  != null ? ['Moonset', hr(t.set)]   : null;
      // Whichever happens first goes on the left, so the card reads the
      // way the night runs. Past first quarter the moon sets before it
      // rises again, and showing rise-then-set implied otherwise.
      if (riseBox && setBox) {
        if (t.set < t.rise) { left = setBox; right = riseBox; }
        else { left = riseBox; right = setBox; }
      } else if (riseBox) { left = riseBox; right = ['Moonset', 'after midnight']; }
      else if (setBox)    { left = ['Moon', 'already up']; right = setBox; }
      else { left = ['Moon', 'up all day']; right = ['', '']; }
    }

    var toFull = ((14.765 - age) % LUNATION + LUNATION) % LUNATION;
    var toNew  = ((LUNATION - age) % LUNATION + LUNATION) % LUNATION;
    var next = toFull < toNew
      ? 'Full moon in ' + Math.round(toFull) + ' day' + (Math.round(toFull) === 1 ? '' : 's') + '.'
      : 'New moon in ' + Math.round(toNew) + ' day' + (Math.round(toNew) === 1 ? '' : 's') + '.';

    return { timeline: true, bg: bg,
      split: { left: left, right: right },
      caption: lat == null ? null : name + ' \u00B7 ' + illum + '% lit',
      tip: illum + '% illuminated, ' + Math.round(age) + ' days into the cycle. ' + next
         + ' Rise and set are calculated for your latitude, not fetched.' };
  }

  /* Solar longitude passes 0, 90, 180 and 270 degrees at the equinoxes

  /* Mosquitoes. Warm, humid, calm, and water standing around from
     recent rain. No free mosquito index exists, so this is a rule of
     thumb rather than data. */
  function bugCard(d) {
    if (d.tMax < 50) return null;
    var s = 0, why = [];
    if (d.tMax >= 65 && d.tMax <= 92) { s += 34; why.push('warm enough for them to fly'); }
    else if (d.tMax >= 55) { s += 16; }
    if (d.dewMax >= 62) { s += 26; why.push('humid'); }
    else if (d.dewMax >= 52) { s += 13; }
    if (d.windMax < 8) { s += 20; why.push('barely any wind to keep them off'); }
    else if (d.windMax < 13) { s += 9; }
    else if (d.windMax >= 18) { s -= 12; why.push('windy enough to keep them down'); }
    if (d.rainYesterday >= 0.1 || d.rainSum >= 0.1) { s += 18; why.push('recent rain leaves standing water'); }
    if (d.tMin < 42) { s -= 20; why.push('a cold night knocks them back'); }
    s = Math.max(0, Math.min(100, s));
    var word = s >= 65 ? 'Bugs Are Brutal' : s >= 40 ? 'Bring Bug Spray' : s >= 20 ? 'A Few Bugs' : 'Bug-Free';
    return { bg: bgFlat('risk', s), bold: word, todo: s >= 40 ? 'Bug spray' : null, todoWhen: 'out', todoRank: 40,
      tip: (why.length ? cap(listJoin(why)) + '. ' : '')
         + (s >= 40 ? 'Worst at dawn and dusk. Repellent on exposed skin, and long sleeves after sunset. '
                    : 'You can probably skip the repellent. ')
         + 'Estimated from temperature, dew point, wind and recent rain \u2014 there is no free mosquito data to check it against.' };
  }

  /* Frostbite, using apparent temperature as the wind chill. Times

     when it is cold enough to matter. */
  function frostbiteCard(d) {
    var wc = d.feelsMin;
    if (wc > 32) return null;
    var word = wc <= -48 ? 'Frostbite in 5 min' : wc <= -32 ? 'Frostbite in 10 min'
             : wc <= -18 ? 'Frostbite in 30 min' : wc <= 5 ? 'Cover Exposed Skin'
             : 'Frostbite Unlikely';
    var tip = 'Wind chill bottoms out near ' + Math.round(wc) + DEG + '. ';
    tip += wc <= -18
      ? 'Those are National Weather Service wind chill thresholds for frostbite on uncovered skin. Nothing bare outdoors \u2014 face, ears, fingers.'
      : wc <= 5
        ? 'Not fast frostbite weather, but cold enough that uncovered skin suffers over a long stretch outside. Hat, gloves, something over your face.'
        : 'Below freezing, but not near frostbite territory. Frostbite needs a wind chill around 18 below before it happens in half an hour.';
    // Wind chill charts assume you are dry. Soaked fabric conducts heat
    // away many times faster, so a merely cold day turns dangerous.

      tip += ' Those figures assume you stay dry. Wet clothing pulls heat away many times faster than dry \u2014 melted snow soaking through changes a cold day into a genuinely risky one.';
    }
    // Cold plus wind constricts blood vessels and raises the load on
    // the heart. Advice, not a risk score.
    if (wc <= 15 && d.windMax >= 12) {
      tip += ' Cold this sharp with wind on top of it tightens blood vessels and puts more load on the heart, so heavy work outdoors \u2014 shovelling especially \u2014 costs more than it looks. Warm up inside first and take it in short stretches.';
    }

             // The risk belongs with planning; what to put on belongs with
             // walking out of the door.
             todos: wc <= -18
               ? [{ text: 'High risk of frostbite \u2014 bare skin in ' + word.replace('Frostbite in ', ''),
                    when: 'day', rank: 3 },
                  { text: 'Heavy coat, and cover your face, ears and hands', when: 'out', rank: 3 }]
               : wc <= 5
               ? [{ text: 'Frostbite risk on bare skin', when: 'day', rank: 10 },

  /* Frizz is a dew point story, and it fails at both ends: damp air
     swells the hair shaft, bone-dry air turns it to static. Same ramp
     as Sweat, different consequence. */
  function frizzCard(d) {
    var dp = d.dewMax, w, why;
    if (dp < 20)      { w = 'Static & Flyaways'; why = 'Air this dry pulls moisture out of hair and leaves it charged.'; }
    else if (dp < 45) { w = 'Hair Behaves';      why = 'Dry enough to hold a style, damp enough to avoid static.'; }
    else if (dp < 56) { w = 'Slight Frizz';      why = 'Borderline. Fine on a good hair day, not on a bad one.'; }
    else if (dp < 66) { w = 'Frizz Likely';      why = 'Enough moisture in the air to swell the hair shaft.'; }
    else              { w = 'Frizz Guaranteed';  why = 'Saturated air. Nothing is holding today.'; }
    if (d.rainChance >= 60 && dp >= 45) why += ' Rain on top of it will not help.';

      todo: dp >= 70 ? 'High chance of frizz'

          : dp < 20 ? 'Static air \u2014 hair will not behave' : null,

  /* Fire weather. The National Weather Service issues Red Flag

     conditions, not fire danger. */
  function fireCard(d) {
    var rh = d.rhMin;
    if (rh == null) return null;
    var dryGround = d.rainSum < 0.05 && d.rainYesterday < 0.1;
    var inRange = rh <= 35 && d.windMax >= 15 && dryGround && d.tMax >= 40;
    if (!inRange) return null;

    var full = rh <= 25 && d.windMax >= 25;
    var near = rh <= 30 && d.windMax >= 20;
    var score = full ? 88 : near ? 62 : 40;
    var word = full ? 'Red Flag Conditions' : near ? 'Near Red Flag Conditions' : 'Elevated Fire Risk';

    var tip = 'Humidity bottoms out at ' + Math.round(rh) + '% with wind to '
            + Math.round(d.windMax) + ' mph, and no rain to speak of. ';
    tip += full
      ? 'That is the shape of a Red Flag Warning: fire spreads fast and is hard to stop. No burning, no sparks, and be careful where you park on dry grass.'

  /* Mould grows where humid air meets a cold surface. A basement in

    var dp = d.dewMax;

      var v = [];

      return v.length ? avg(v) : 50;

         + (midCloud < 30 ? 'full sun' : 'this much sun') + ' runs roughly '

         + 'Hold the back of your hand to it for seven seconds \u2014 if you cannot, neither can a dog. Walk early or after sunset, and stay on grass.' };

  /* Wind, which the app had been fetching and never showing. Gust

  function windCard(d) {
