<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Morning Brief</title>
<meta name="description" content="A weather brief for the things weather actually does to you — sunburn, pollen, joints, migraines, bugs, mud, and whether the water is safe.">
<meta property="og:title" content="Morning Brief">
<meta property="og:description" content="A weather brief for the things weather actually does to you.">
<meta property="og:type" content="website">
<link rel="icon" href="data:,">
<style>
  :root{ --page:#FFF; --ink:#16232F; --mid:#5B6B7A; --line:#E4E4E4; --link:#1B57C8;
         --rowh:62px; --gap:7px; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--page);color:var(--ink);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
       line-height:1.3;-webkit-font-smoothing:antialiased;padding:10px 11px 22px;}
  .wrap{max-width:440px;margin:0 auto;}

  .hdr{background:#FFF;border:1px solid var(--line);border-radius:16px;
       padding:11px 16px 12px;text-align:center;margin:0 0 8px;}
  .hdr.section{margin-top:22px;}
  .hdr .l1{font-size:19px;color:var(--mid);margin-bottom:5px;}
  .hdr .l2{font-size:24px;font-weight:700;letter-spacing:-.015em;}
  select{font:inherit;color:inherit;background:transparent;border:none;
         border-bottom:1.5px dashed #B9C4CC;padding:0 2px 3px;cursor:pointer;
         -webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;max-width:100%;}
  .hdr .l2 select{font-weight:700;}
  select:focus-visible{outline:2px solid var(--link);outline-offset:3px;}

  .face{position:relative;}
  /* Fixed-interval reference ticks, off by default. The live "now" tick
     tells you where you are; these tell you where six o'clock is,
     for anyone who does not track that by feel. Reuses the same
     positioning maths as the now-tick, just at fixed hours instead of
     the current time. */
  /* Multi-day view: each of the four across-the-day cards becomes a
     row of narrow day-cards instead of one 24-hour card. Wraps on a
     narrow phone; a landscape phone or a tablet gets everything in one
     row, which is the reason the request mentioned turning the phone
     sideways \u2014 width is the whole constraint here. */
  .mdstrip{cursor:pointer;text-align:left;display:block;width:100%;}
  .mdexpand{margin-top:10px;padding-top:9px;border-top:1px solid rgba(22,35,47,.14);}
  .mdday{font-size:14px;line-height:1.4;margin:0 0 6px;}
  .mdopen{display:inline-block;margin-top:4px;font-size:13.5px;color:var(--link);
          text-decoration:none;font-weight:600;}
  .mdday:last-child{margin-bottom:0;}
  .mdday b{font-weight:700;}

  /* Pills wrapping onto a second row broke the one thing a pill row is
     for \u2014 lining a value up under its day. Fixed percentage width, no
     wrap, no flex-basis guesswork: the same discipline as the day
     header above it, so pill 3 in every row and day segment 3 are
     the same physical column. */
  .mdpillrow{margin-bottom:12px;}
  .mdpills{display:flex;flex-wrap:nowrap;}
  .mdpill{flex:0 0 auto;min-width:0;border:none;border-right:2px solid var(--page);
          border-radius:0;padding:8px 3px;font:inherit;font-size:12px;font-weight:700;
          color:var(--ink);cursor:pointer;text-align:center;overflow:hidden;
          display:flex;flex-direction:column;gap:2px;line-height:1.15;}
  .mdpills .mdpill:first-child{border-top-left-radius:12px;border-bottom-left-radius:12px;}
  .mdpills .mdpill:last-child{border-top-right-radius:12px;border-bottom-right-radius:12px;border-right:none;}
  .mdpilltip{font-size:12.5px;font-weight:400;line-height:1.35;margin:6px 0 0;
             text-align:left;color:var(--ink);}
  /* Always visible, no tap \u2014 for values that are just numbers. */
  .mdsub{font-size:11.5px;font-weight:600;opacity:.75;margin-top:2px;}
  .mdpill.withsub{cursor:default;}
  @media (max-width:430px){ .mdpill{font-size:10.5px;padding:7px 2px;} }
  /* No flex gap: with a gap, each segment's true edge is not at i/N of
     the row's width (gaps eat width unevenly as items shrink to fit),
     which is why the day lines below drifted out of alignment with
     these boundaries. Fixed percentage widths and a thin border instead
     of a gap put every boundary at exactly i/N, matching dayLines(). */
  .dayhead{display:flex;margin-bottom:var(--gap);}
  .dayseg{flex:0 0 auto;min-width:0;border:none;border-right:2px solid var(--page);
          font:inherit;color:var(--ink);
          border-radius:14px;min-height:var(--rowh);padding:6px 3px;cursor:pointer;
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          line-height:1.15;overflow:hidden;}
  .dayseg .dsname{font-size:14px;font-weight:700;white-space:nowrap;}
  .dayseg .dsdate{font-size:12px;opacity:.75;margin-top:1px;}
  .dayseg:last-child{border-right:none;}
  .dayseg.today{box-shadow:0 0 0 2px rgba(22,35,47,.45) inset;}
  @media (max-width:430px){
    .dayseg .dsname{font-size:12px;} .dayseg .dsdate{font-size:11px;}
  }
  /* Lines live inside each card's own .face, not a shared overlay
     outside the cards. That is what lets them sit above the card's
     colored background (visible crossing the gradient) while staying
     below the card's own text (z-index 0 vs 1) \u2014 only guaranteed
     within one shared stacking context. Every card draws the same
     x-position independently, so the page still reads as one
     continuous line; the small gap between cards is the only break. */
  .tline{position:absolute;top:0;bottom:0;width:1px;margin-left:-0.5px;z-index:0;
         pointer-events:none;background:rgba(255,255,255,.8);
         box-shadow:0 0 0 .5px rgba(22,35,47,.18);}
  .tline.major{width:2px;margin-left:-1px;background:rgba(255,255,255,.92);
               box-shadow:0 0 0 .5px rgba(22,35,47,.26);}
  .face b, .mdrowlabel, .dsname, .dsdate{position:relative;z-index:1;}
  /* Same weight as the card labels, because people could not find the
     time when it was small and grey. */
  .timeaxis{position:relative;height:22px;margin:3px 2px 0;}
  .timeaxis span{position:absolute;top:0;font-size:15px;font-weight:700;color:var(--ink);
                 transform:translateX(-50%);white-space:nowrap;}
  /* A tappable card says so: a small chevron that rotates when open.
     Only appears on cards that actually have something behind them, so
     it never promises a tap that does nothing. */
  /* Bottom right corner of the card rather than beside the words, which
     is where it used to collide with a label that wrapped. */
  .more{position:absolute;right:7px;bottom:5px;width:12px;height:12px;
        opacity:.3;pointer-events:none;}
  .more svg{display:block;width:100%;height:100%;}
  .card.open .more{transform:rotate(180deg);opacity:.45;}
  /* Sunrise to the left, sunset to the right, so the card reads the way
     the day runs. Wraps to two lines rather than crushing on a narrow
     phone. */
  .face.split{display:flex;align-items:center;gap:10px;}
  .face.split .end{display:flex;flex-direction:column;line-height:1.2;flex:0 0 auto;}
  .face.split .end.mid{flex:1 1 auto;text-align:center;font-weight:600;opacity:.78;}
  .face.split .end.right{text-align:right;margin-left:0;}
  .face.split .end b{display:block;}
  .caption{font-size:13.5px;opacity:.72;text-align:center;margin-top:5px;}
  .credit{display:block;margin-top:8px;}
  .credit a{color:inherit;text-decoration:none;font:700 13px system-ui;border:none;}
  .mastmark{font-family:'Lobster',cursive;font-size:1.35em;font-weight:400;}
  /* "You are here", same local containment as the hour lines, in the
     accent colour so it reads as different in kind. */
  .nowline{position:absolute;top:0;bottom:0;width:2.5px;margin-left:-1.25px;z-index:0;
           background:var(--link);box-shadow:0 0 0 1px rgba(255,255,255,.6);}
  .card{border-radius:14px;padding:9px 16px;margin:0 0 var(--gap);width:100%;
        min-height:var(--rowh);display:flex;flex-direction:column;justify-content:center;
        border:none;font:inherit;color:var(--ink);text-align:center;
        font-size:17.5px;display:block;cursor:pointer;}
  .card.flat, .card.todo, .card.todo .todohead{cursor:default;}
  /* Compact tier. A card whose gradient runs midnight to midnight
     needs the width to be read across; a card that is one word does
     not, so it gets less height and a slightly smaller face. */
  /* Daily facts become a two-up grid of squares. Nothing to read
     across their width, so they trade length for a bigger field of
     colour. */
  /* Every card is one row tall, sized to hold two lines of label. Rows
     never stretch to fill leftover space \u2014 that is what made a single
     row of water tiles swell to the height of the whole column. Only a
     card opened by tapping is allowed to grow. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:17px;
        grid-auto-rows:minmax(var(--rowh),auto);align-content:start;}
  .card.sm{min-height:var(--rowh);display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;
           padding:8px 11px;font-size:14px;border-radius:12px;margin:0;width:auto;
           line-height:1.22;}
  /* Tapped open, a tile takes the full row so the detail has somewhere
     to go instead of straining the square. */
  .card.open{min-height:0;height:auto;justify-content:flex-start;align-items:stretch;
             text-align:left;padding:13px 16px;}
  .card.sm.open{grid-column:span 2;}
  .card.sm .tip{text-align:left;}
  .card.sm.skel{height:auto;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .card b{font-weight:700;}
  .det{font-weight:400;opacity:.72;}
  .alert{background:#FBE9E9;border:1px solid #F1D2D2;}
  .plain{background:#F2F0EB;}
  .tip{font-size:14.5px;line-height:1.45;text-align:left;margin:11px 0 0;padding-top:10px;
       border-top:1px solid rgba(22,35,47,.16);opacity:.82;}
  .linkcard{background:#F2F0EB;border-radius:15px;padding:14px;text-align:center;margin:0 0 8px;}
  .linkcard a{color:var(--link);font-weight:700;font-size:17px;text-decoration:underline;}
  .skel{background:#F1EFEA;height:48px;}
  .card.sm.skel{height:38px;}
  .busy{opacity:.45;}
  .foot{font-size:11.5px;color:#8A97A3;line-height:1.5;margin:14px 4px 0;}
  /* Phone stays as it was: one column, tiles two across. From tablet
     width up, the hourly cards become a column of their own beside a
     three-across tile grid \u2014 the tiles carry one fact each, so they
     lose nothing by being narrower, while the hourly cards keep the
     width their gradients need. */
  @media (min-width:760px){
    .wrap{max-width:1080px;}
    :root{--rowh:74px;--gap:8px;}
    .card{padding:12px 18px;}
    .card.sm{padding:10px 12px;font-size:15px;}
    /* Left column is the day: four full-width cards, then the tiles
       under them. Right column is the to-do list, which is the longest
       single element and now has somewhere to be. Anything that
       announces itself spans both. */
    /* The to-do list is the right column no matter where it sits in the
       running order; cards and tiles stack on the left in whatever
       order you chose. Nothing spans both any more, which is what used
       to wedge a full-width block between the columns. */
    #homeBody{display:grid;grid-template-columns:1.15fr 0.85fr;
              gap:14px;align-items:start;}
    #homeBody > .todoblock{margin:0;}

    /* Both sides share one row height, so a card on the left lines up
       with a tile on the right instead of each being sized by its own
       rule. */
    .hourly{display:flex;flex-direction:column;gap:var(--gap);}
    /* Zero gap between the timeline cards. Their per-card lines are
     contained, not overhung, so with no gap between boxes a line drawn
     at the same x in consecutive cards touches exactly \u2014 reading as
     one line down the page without needing a shared cross-card overlay
     (which cannot keep text above it without also hiding it under the
     next card's opaque background). Corners are squared here and
     rounded only at the very top and bottom by roundEnds(). */
  .hourly > .card{margin:0;border-radius:0;flex:0 0 auto;min-height:var(--rowh);
                    display:flex;flex-direction:column;justify-content:center;}
    .hourly > .card:not(.open){height:var(--rowh);}
    .hourly > .card.open{height:auto;}
    .card.sm{aspect-ratio:auto;min-height:var(--rowh);font-size:15px;}
    .grid{grid-template-columns:repeat(3,1fr);margin-top:0;}
    .card.sm.open{grid-column:span 3;min-height:0;}
  }
  @media (min-width:1180px){
    .wrap{max-width:1180px;}
  }
  @media (max-width:370px){ .card{font-size:16px;padding:12px 14px;} .hdr .l2{font-size:21px;}
    .card.sm{font-size:13px;padding:9px 10px;} }

  /* Phone, turned sideways. Two separate problems, both from the same
     cause: none of the widths above were chosen with landscape phones
     in mind, so the layout guesses wrong at exactly the widths a
     landscape phone lands on.

     Under 760px, .wrap is still capped at its portrait width (440px),
     so a landscape phone just gets that same narrow column centered in
     a lot of blank space.

     760px and up is where most current phones' landscape width
     actually lands (iPhone 14/15 standard: 844px; Pro Max: 926px), and
     that is also the desktop breakpoint above, which puts #homeBody
     into a two-column grid built for the to-do sidebar. Multi-day view
     never has a to-do sidebar, so it was rendering into that layout's
     left column only \u2014 about 58% of the width, with the other 42%
     empty \u2014 instead of the one wide column it actually wants. */
  @media (orientation:landscape) and (max-width:960px){
    .wrap{max-width:100%;}
    #homeBody.multiday{display:block;}
  }

  /* ---- public build additions ---- */
  .bar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 10px;}
  .bar button{background:none;border:none;font:inherit;font-size:14px;color:var(--mid);
              cursor:pointer;padding:4px 8px;border-bottom:1px dashed #C3CCD4;}
  .bar button:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .panel{background:#F7F5F1;border:1px solid var(--line);border-radius:18px;
         padding:16px 18px;margin:0 0 12px;}
  .panel h2{font-size:17px;margin:0 0 4px;}
  .panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);
            margin:16px 0 6px;font-weight:600;}
  .panel p.lede{font-size:13.5px;color:var(--mid);margin:0 0 6px;line-height:1.45;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:15px;
       border-top:1px solid #E8E4DC;cursor:pointer;}
  .opt:first-of-type{border-top:none;}
  .opt input{margin:3px 0 0;width:17px;height:17px;flex:0 0 auto;}
  .opt.sub{padding-left:26px;border-top:1px solid #EFECE4;}
  .opt.sub span{font-size:14.5px;}
  .ord + .opt.sub{border-top:1px solid #EFECE4;}
  .opt span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .panel input[type=text]{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);
                          border-radius:8px;background:#FFF;color:inherit;margin-top:4px;}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px;
        border-bottom:1px solid var(--line);padding-bottom:9px;}
  .tab{background:none;border:1px solid transparent;border-radius:9px;padding:5px 10px;
       font:inherit;font-size:13.5px;color:var(--mid);cursor:pointer;white-space:nowrap;}
  .tab:hover{background:#EFECE5;}
  .tab.sel{background:#FFF;border-color:var(--line);color:var(--ink);font-weight:600;}
  .steps{margin:4px 0 12px;padding-left:22px;font-size:13.5px;color:var(--mid);line-height:1.5;}
  .steps li{margin-bottom:6px;}
  .ord input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;margin:0;}
  .ord span small{display:block;font-size:12.5px;color:var(--mid);line-height:1.35;margin-top:1px;}
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px;}
  .preset{background:#FFF;border:1px solid var(--line);border-radius:10px;padding:7px 10px;
          font:inherit;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .preset.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);}
  .preset .sw{display:flex;gap:2px;}
  .preset .sw i{width:11px;height:11px;border-radius:3px;display:block;}
  .contrast{margin-top:8px;padding-left:9px;border-left:2px solid #C9BFA9;}
  .contrast.ok{border-left-color:#7FA86B;}
  .contrast.bad{border-left-color:#C4703F;}
  .reset{margin-top:10px;background:#FFF;border:1px solid var(--line);border-radius:9px;
         padding:7px 12px;font:inherit;font-size:14px;cursor:pointer;}
  .ord{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:14.5px;
       border-top:1px solid #E8E4DC;}
  .ord span{flex:1 1 auto;}
  .ord button{background:#FFF;border:1px solid var(--line);border-radius:7px;width:30px;height:28px;
              font:inherit;font-size:15px;line-height:1;cursor:pointer;color:var(--ink);}
  .ord button:disabled{opacity:.32;cursor:default;}
  .card.todo{background:#F3F0E8;border:1px solid var(--line);display:block;
             padding:12px 15px 13px;min-height:0;margin-bottom:10px;}
  .todohead{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
            color:var(--ink);opacity:.62;font-weight:700;margin-bottom:7px;}
  .card.todo ul + .todohead{margin-top:14px;padding-top:12px;
                            border-top:1px solid rgba(22,35,47,.13);}
  .card.todo li.week{background:#EDF1F6;border-color:#D3DEEA;}
  .ord.sub{padding-left:18px;}
  .ord.sub span{opacity:.8;}
  .card.todo ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:7px 9px;}
  .card.todo li{font-size:14.5px;font-weight:600;background:#FFF;border:1px solid var(--line);
                border-radius:999px;padding:4px 11px;cursor:pointer;}
  .card.todo li:focus-visible{outline:2px solid var(--link);outline-offset:2px;}
  .card.todo li.done{opacity:.38;font-weight:400;text-decoration:line-through;background:transparent;}
  .card.todo .tip{text-align:left;}
  .tiphint{font-size:13px;color:var(--mid);text-align:center;margin:0 0 10px;}
  .disc{font-size:12px;color:#7C8996;line-height:1.55;margin:16px 4px 0;
        border-top:1px solid var(--line);padding-top:12px;}
  .disc b{color:var(--mid);}

</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="l1"><select id="daySel" aria-label="Day"></select>
      <select id="spanSel" aria-label="Days shown" style="margin-left:6px"></select>
    </div>
    <div class="l2"><select id="placeSel" aria-label="Location"></select></div>
    <div id="searchBox" style="display:none;margin-top:10px">
      <input id="q" type="search" placeholder="Search any US town" autocomplete="off"
             style="font:inherit;width:100%;text-align:center;border:none;border-bottom:1.5px dashed #B9C4CC;padding:4px;background:transparent;color:inherit">
      <ul id="results" style="list-style:none;margin:8px 0 0;padding:0;font-size:16px"></ul>
    </div>
  </div>

  <div class="bar">
    <button id="settingsBtn" aria-expanded="false">Settings</button>
    <button id="aboutBtn" aria-expanded="false">About</button>
  </div>

  <div id="settingsPanel" class="panel" style="display:none"></div>
  <div id="aboutPanel" class="panel" style="display:none"></div>

  <p class="tiphint" id="tipHint">Tap any card for the numbers behind it.</p>
  <div id="alertBody"></div>
  <div id="homeBody"></div>

  <p class="disc" id="disclaimer"></p>
</div>

<script>
(function () {
  'use strict';
  var DEG = '\u00B0', DASH = '\u2013', MID = '\u00B7';

  /* ================= storage =================
     Everything lives in this browser. No account, no server, and
     nothing about anyone's location or health leaves the device
     except as coordinates in a weather request. */
  var KEY = 'morningbrief.v1';
  function loadStore() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function saveStore() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  var store = loadStore();
  if (!store.cards) store.cards = {};          // absent means on
  if (!store.recents) store.recents = [];
  if (!store.keys) store.keys = {};
  if (!store.done) store.done = {};

  /* Which cards exist, what each assumes about you, and which section
     of the settings panel it sits in. Everything defaults to on. */
  var CARDS = [
    // across the day
    { id: 'feels',     name: 'Feels Like',        note: 'Temperature and humidity together', always: true },
    { id: 'sky',       name: 'Sky',               note: 'Cloud and what is falling' },
    { id: 'daylight',  name: 'Sunrise and sunset' },
    { id: 'moon',      name: 'Moon phase' },
    // tiles
    { id: 'flag',      name: 'Flag at half-staff', note: 'Only when an order is in effect' },
    { id: 'air',       name: 'Air quality' },
    { id: 'allergy',   name: 'Allergens' },
    { id: 'virus',     name: 'Viruses about',     note: 'COVID, flu and RSV in your state\u2019s wastewater' },
    { id: 'burn',      name: 'Sunburn' },
    { id: 'water',     name: 'Water temperature', note: 'Shows when a gauge or buoy is near' },
    { id: 'pavement',  name: 'Pavement and paws', note: 'A dog' },
    { id: 'wind',      name: 'Wind',              note: 'Kite and sailing notes in the tap' },
    { id: 'aurora',    name: 'Aurora',            note: 'Only during a geomagnetic storm' },
    { id: 'eclipse',   name: 'Eclipse',           note: 'Only on an eclipse day' },
    // to-do list only
    { id: 'mask',      name: 'Masking',           note: 'Suggests a mask when the air or the viruses are bad' },
    { id: 'swim',      name: 'Swimming',          note: 'Suggests a swim, and flags good swimming days ahead' },
    { id: 'arthritis', name: 'Arthritis',         note: 'Some people\u2019s arthritis flares with the weather' },
    { id: 'mold',      name: 'Basement',          note: 'If you have one, should you air it out?' },
    { id: 'bug',       name: 'Bug Spray' },
    { id: 'light',     name: 'Daylight',          note: 'How much usable light today, and when' },
    { id: 'fire',      name: 'Fire Weather',      note: 'Conditions are approaching Red Flag' },
    { id: 'frostbite', name: 'Frostbite' },
    { id: 'frizz',     name: 'Hair Frizz' },
    { id: 'migraine',  name: 'Migraine' },
    { id: 'mow',       name: 'Mow the Lawn',      note: 'Will the rain and mud cooperate?' },
    { id: 'pipe',      name: 'Pipes Freeze',      note: 'Houses with exposed plumbing' },
